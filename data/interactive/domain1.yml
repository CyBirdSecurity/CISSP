interactive_questions:

  # ── Ordering ─────────────────────────────────────────────────

  - id: iq-d1-001
    domain: domain1
    type: ordering
    question: "Place the NIST Risk Management Framework (RMF) steps in the correct order:"
    items:
      - "Prepare"
      - "Categorize"
      - "Select"
      - "Implement"
      - "Assess"
      - "Authorize"
      - "Monitor"
    correct_order: [0, 1, 2, 3, 4, 5, 6]
    explanation: >
      The NIST RMF (SP 800-37) follows seven steps in order: Prepare establishes context and
      priorities; Categorize classifies the information system by impact level; Select chooses
      appropriate security controls; Implement applies those controls; Assess evaluates their
      effectiveness; Authorize senior management accepts residual risk; Monitor provides ongoing
      awareness and reports program effectiveness.

  - id: iq-d1-002
    domain: domain1
    type: ordering
    question: "Arrange the NIST Incident Response lifecycle phases in the correct order:"
    items:
      - "Preparation"
      - "Detection and Analysis"
      - "Containment, Eradication, and Recovery"
      - "Post-Incident Activity"
    correct_order: [0, 1, 2, 3]
    explanation: >
      Per NIST SP 800-61: Preparation establishes the capability to respond; Detection and Analysis
      identifies and validates incidents; Containment, Eradication, and Recovery limits damage,
      removes the threat, and restores systems; Post-Incident Activity captures lessons learned
      and improves the program.

  # ── Matching ─────────────────────────────────────────────────

  - id: iq-d1-003
    domain: domain1
    type: matching
    question: "Classify each security control into its correct functional category:"
    items:
      - "Firewall"
      - "CCTV Camera"
      - "Intrusion Detection System (IDS)"
      - "Patch Management"
      - "Access Control List (ACL)"
      - "Audit Logs"
    categories:
      - "Preventive"
      - "Detective"
      - "Corrective"
    correct_mapping:
      0: "Preventive"
      1: "Detective"
      2: "Detective"
      3: "Corrective"
      4: "Preventive"
      5: "Detective"
    explanation: >
      Preventive controls block threats before they occur (firewalls, ACLs). Detective controls
      identify threats during or after an event (CCTV, IDS, audit logs). Corrective controls
      restore systems or reduce impact after an incident (patch management). Note that many
      controls span categories — IDS is primarily detective, though some IPS configurations
      add preventive capability.

  - id: iq-d1-004
    domain: domain1
    type: matching
    question: "Match each attack scenario to the CIA Triad property it primarily violates:"
    items:
      - "An attacker intercepts and reads encrypted emails"
      - "A hacker modifies financial records in a database"
      - "A DDoS attack takes an e-commerce site offline"
      - "An employee copies confidential customer data to a USB drive"
    categories:
      - "Confidentiality"
      - "Integrity"
      - "Availability"
    correct_mapping:
      0: "Confidentiality"
      1: "Integrity"
      2: "Availability"
      3: "Confidentiality"
    explanation: >
      Confidentiality ensures information is not disclosed to unauthorized parties (interception,
      unauthorized copying). Integrity ensures information is accurate and unaltered
      (database modification). Availability ensures systems and data are accessible when
      needed (DDoS). Many real-world attacks impact multiple properties simultaneously.

  # ── Multi-Select ─────────────────────────────────────────────

  - id: iq-d1-005
    domain: domain1
    type: multiselect
    question: "Which of the following are components of the CIA Triad? (Select all that apply)"
    options:
      - "Confidentiality"
      - "Authentication"
      - "Integrity"
      - "Availability"
    correct_answers: [0, 2, 3]
    explanation: >
      The CIA Triad consists of Confidentiality (protecting information from unauthorized
      disclosure), Integrity (ensuring information is accurate and unmodified), and
      Availability (ensuring authorized users can access information when needed).
      Authentication is an important security concept but is not part of the CIA Triad —
      it is part of the AAA framework (Authentication, Authorization, Accounting).

  - id: iq-d1-006
    domain: domain1
    type: multiselect
    question: "Which of the following are valid responses to identified risk? (Select all that apply)"
    options:
      - "Risk Avoidance"
      - "Risk Elimination"
      - "Risk Transfer"
      - "Risk Acceptance"
    correct_answers: [0, 2, 3]
    explanation: >
      The four standard risk responses are: Accept (tolerate the risk), Avoid (discontinue
      the activity), Transfer (shift impact to a third party, e.g., insurance), and Mitigate/Reduce
      (implement controls to lower likelihood or impact). "Risk Elimination" is not a recognized
      standard term — risk can be reduced or avoided but rarely fully eliminated; residual risk
      always remains.

  # ── Fill-in-the-Blank ────────────────────────────────────────

  - id: iq-d1-007
    domain: domain1
    type: fillblank
    question: "Complete the quantitative risk formula:"
    template: "Annual Loss Expectancy (ALE) = {blank} × Single Loss Expectancy (SLE)"
    choices:
      - "Annual Rate of Occurrence (ARO)"
      - "Asset Value (AV)"
      - "Exposure Factor (EF)"
      - "Return on Investment (ROI)"
    correct_answer: 0
    explanation: >
      ALE = ARO × SLE. The Annual Rate of Occurrence (ARO) represents how many times per year
      a threat is expected to materialize. Single Loss Expectancy (SLE) is the expected monetary
      loss per incident. Together they give the Annual Loss Expectancy — the expected annual cost
      of a specific risk. This is the foundation of quantitative risk analysis in CISSP.

  - id: iq-d1-008
    domain: domain1
    type: fillblank
    question: "Complete the Single Loss Expectancy formula:"
    template: "SLE = Asset Value (AV) × {blank}"
    choices:
      - "Annual Rate of Occurrence (ARO)"
      - "Annual Loss Expectancy (ALE)"
      - "Exposure Factor (EF)"
      - "Return on Security Investment (ROSI)"
    correct_answer: 2
    explanation: >
      SLE = AV × EF. The Exposure Factor (EF) is the percentage of asset value lost in a
      single incident, expressed as a decimal (0.0–1.0). For example, if a $100,000 server
      has a 40% chance of being fully destroyed in a fire (EF = 0.4), the SLE is $40,000.
      Understanding SLE is critical for justifying security control costs using quantitative
      risk analysis.

  - id: iq-d1-009
    domain: domain1
    type: ordering
    question: "Place the Business Continuity Planning (BCP) phases in the correct order:"
    items:
      - "Project Scope and Planning"
      - "Business Impact Analysis (BIA)"
      - "Continuity Planning"
      - "Approval and Implementation"
    correct_order: [0, 1, 2, 3]
    explanation: >
      The four BCP phases per ISC² are: (1) Project Scope and Planning — define objectives,
      team, and resources; (2) Business Impact Analysis — identify critical processes and
      quantify the impact of disruptions; (3) Continuity Planning — develop recovery
      strategies and write the plan; (4) Approval and Implementation — gain senior management
      sign-off and train personnel. The BIA is foundational because it drives all recovery
      strategy decisions that follow.

  - id: iq-d1-010
    domain: domain1
    type: matching
    question: "Match each security framework or standard to its primary focus area:"
    items:
      - "NIST Cybersecurity Framework (CSF)"
      - "ISO/IEC 27001"
      - "PCI DSS"
      - "SOC 2"
    categories:
      - "Cybersecurity Risk Management"
      - "Information Security Management System"
      - "Payment Card Security"
      - "Service Organization Controls"
    correct_mapping:
      0: "Cybersecurity Risk Management"
      1: "Information Security Management System"
      2: "Payment Card Security"
      3: "Service Organization Controls"
    explanation: >
      NIST CSF provides a voluntary framework for managing cybersecurity risk using five
      functions (Identify, Protect, Detect, Respond, Recover). ISO/IEC 27001 is the
      international standard for establishing an ISMS. PCI DSS is mandated for any
      organization that stores, processes, or transmits cardholder data. SOC 2 is an
      auditing standard for service organizations covering security, availability,
      processing integrity, confidentiality, and privacy.

  - id: iq-d1-011
    domain: domain1
    type: multiselect
    question: "Which of the following are goals of a security awareness and training program? (Select all that apply)"
    options:
      - "Reduce the likelihood of human error leading to security incidents"
      - "Eliminate the need for technical security controls"
      - "Change employee attitudes and behaviors toward security"
      - "Help the organization meet regulatory compliance requirements"
    correct_answers: [0, 2, 3]
    explanation: >
      Security awareness programs aim to reduce human error (the leading cause of breaches),
      change behaviors and build a security-conscious culture, and satisfy compliance
      obligations (e.g., HIPAA, PCI DSS training requirements). They do NOT replace technical
      controls — defense-in-depth requires both people and technology controls operating
      together. Awareness training is a compensating administrative control, not a substitute
      for preventive technical ones.

  - id: iq-d1-012
    domain: domain1
    type: fillblank
    question: "Complete the basic risk equation used in qualitative risk analysis:"
    template: "Risk = {blank} × Vulnerability × Asset Value"
    choices:
      - "Threat"
      - "Exposure Factor (EF)"
      - "Annual Rate of Occurrence (ARO)"
      - "Impact"
    correct_answer: 0
    explanation: >
      The simplified risk equation is Risk = Threat × Vulnerability × Asset Value. A threat
      is any circumstance or event with the potential to cause harm. Vulnerability is a
      weakness that a threat can exploit. Asset Value reflects what is at stake. This model
      shows that risk can be reduced by addressing any one of the three components — removing
      threats, patching vulnerabilities, or reducing asset exposure through segmentation or
      classification.

  - id: iq-d1-013
    domain: domain1
    type: ordering
    question: "Arrange the steps of the change management process in the correct order:"
    items:
      - "Submit change request"
      - "Assess impact and risk"
      - "Obtain approval from change advisory board (CAB)"
      - "Implement the change"
      - "Review and close"
    correct_order: [0, 1, 2, 3, 4]
    explanation: >
      A formal change management process begins with a documented request, followed by
      impact and risk assessment to evaluate potential disruptions, then CAB approval to
      ensure oversight. Implementation follows only after approval, and a post-implementation
      review closes the record and captures lessons learned. Skipping steps — especially
      impact assessment or approval — is one of the most common causes of unplanned outages
      and security misconfigurations in enterprise environments.
