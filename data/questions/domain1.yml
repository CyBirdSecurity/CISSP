      incorrect:
        - "Threat agents include both automated systems AND human actors AND natural events. The distinction is not human vs. automated."
        - "Threat agent is the broader term including any source of harm (natural, human, technical); threat actor specifically refers to intentional human adversaries — this is the correct distinction."
        - "Both threat agents and threat actors can be internal or external. Insider threats are both internal and intentional threat actors."
        - "While used informally as synonyms, they have distinct meanings in formal risk analysis. Threat actor implies intentional human intent; threat agent is broader."
