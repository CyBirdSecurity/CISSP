  - id: q-d1-118
    domain: domain1
    question: "An organization performs a cost-benefit analysis for a new security control. The expected annual benefit is $80,000 in risk reduction, the annual cost is $95,000, and the control requires $30,000 upfront implementation. What is the correct decision based purely on economic criteria?"
    options:
      - "Implement the control because the risk reduction ($80,000) justifies the investment"
      - "Reject the control because annual costs ($95,000) exceed annual benefits ($80,000), producing a negative net return"
      - "Implement the control because the total 3-year benefit ($240,000) exceeds total 3-year cost ($315,000)"
      - "Defer the decision until the implementation cost is amortized over the control's lifecycle"
    correct_answer: 1
    explanations:
      correct: "Pure economic analysis: Annual benefit = $80,000, Annual cost = $95,000. Annual net = $80,000 - $95,000 = -$15,000 loss per year. Even adding the $30,000 upfront cost does not change the negative annual return. The control costs more to operate annually than the risk reduction it provides. Based purely on economic criteria, the control should be rejected or alternatives sought."
      incorrect:
        - "The risk reduction ($80,000) does not justify the investment when annual costs ($95,000) exceed annual benefits ($80,000) by $15,000. The control produces a negative economic return."
        - "Annual costs ($95,000) exceed annual benefits ($80,000) by $15,000/year, and there is an additional $30,000 upfront cost — the control should be rejected based on economic criteria."
        - "3-year total benefit ($240,000) would be compared to 3-year total cost ($285,000 operating + $30,000 implementation = $315,000). The 3-year NPV is negative, confirming rejection."
        - "Deferring for amortization doesn't change the economic picture. If annual operating costs exceed annual benefits indefinitely, the control will never achieve positive ROI."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["risk", "quantitative", "cost-benefit", "governance"]

  - id: q-d1-119
    domain: domain1
    question: "A company's information security policy states: 'All employees must use strong passwords.' Which document type should contain the specific requirement that passwords must be at least 14 characters with complexity requirements?'"
    options:
      - "Policy — high-level management direction"
      - "Standard — specific, mandatory, measurable requirement"
      - "Procedure — step-by-step implementation instructions"
      - "Guideline — recommended best practice"
    correct_answer: 1
    explanations:
      correct: "Standards specify the specific, measurable, mandatory technical requirements that implement a policy. The policy says 'use strong passwords' (what must be done); the standard specifies '14 characters minimum, must include uppercase, lowercase, numbers, and symbols' (the specific mandatory parameters). Standards are mandatory and measurable, unlike guidelines which are optional."
      incorrect:
        - "Policies define high-level direction and intent (e.g., 'employees must use strong passwords'). They do not contain specific technical parameters like character counts — that granularity belongs in standards."
        - "Standards contain the specific, mandatory, measurable requirements that implement policies — a 14-character minimum with complexity rules is a classic standard specification."
        - "Procedures provide step-by-step instructions for implementing standards (e.g., 'Step 1: Press Ctrl+Alt+Del, Step 2: Select Change Password'). Character count requirements belong in the standard, not the procedure."
        - "Guidelines are recommended but not mandatory. A password character count requirement is mandatory and must be in a standard, not a guideline."
    difficulty: "easy"
    cognitive_level: "recall"
    tags: ["governance", "policy", "standards"]

  - id: q-d1-120
    domain: domain1
    question: "Which of the following BEST describes 'Separation of Duties' (SoD) as an administrative security control?"
    options:
      - "Ensuring that employees rotate through multiple job roles over their tenure"
      - "Dividing a critical or sensitive task so that no single person can complete it alone without oversight"
      - "Requiring that all security-related tasks be performed by two separate security teams"
      - "Ensuring that developers and operations teams work in separate organizational units"
    correct_answer: 1
    explanations:
      correct: "Separation of Duties divides critical or sensitive tasks into components that require multiple different people to complete. No single individual has end-to-end control over a sensitive process — this prevents fraud, error, and misuse. Example: the person who initiates a financial transaction should not be the same person who approves it, and not the same person who reconciles it."
      incorrect:
        - "Rotating through multiple roles over time describes job rotation — a related but distinct control. SoD divides a single process among multiple individuals simultaneously."
        - "SoD divides a critical task so that no single person can complete it alone — this is the definition, preventing fraud and error through shared responsibility."
        - "SoD does not require separate organizational teams for all security tasks. It applies to specific sensitive processes where a single person's control creates unacceptable risk."
        - "Dev/ops organizational separation may reduce certain risks but does not define SoD. SoD is about dividing access and control over specific processes, not organizational structure."
    difficulty: "easy"
    cognitive_level: "recall"
    tags: ["principles", "access-control", "governance"]

  - id: q-d1-121
    domain: domain1
    question: "An information security manager is preparing a briefing for non-technical executives about cyber risk. Which approach is MOST effective for communicating risk in a way that drives executive decision-making?"
    options:
      - "Present detailed technical vulnerability reports with CVSS scores for all open findings"
      - "Translate cybersecurity risk into business impact terms — financial loss, operational disruption, and reputational harm"
      - "Provide a comprehensive list of all security controls in place to demonstrate program maturity"
      - "Show executives the firewall logs and IDS alerts to demonstrate the volume of threats"
    correct_answer: 1
    explanations:
      correct: "Executives make decisions based on business impact — financial loss, operational disruption, legal/regulatory consequences, and reputational harm. Technical details (CVSS scores, firewall logs) are meaningless without business context. Effective risk communication translates technical risks into business outcomes: 'This vulnerability could result in a $2M breach' resonates more than 'CVSS 9.8 critical finding.'"
      incorrect:
        - "CVSS scores and vulnerability details are meaningful to technical teams but do not help executives understand business impact or make informed resource allocation decisions."
        - "Translating cybersecurity risk into business impact terms (financial, operational, reputational) is the most effective approach for executive risk communication."
        - "Listing controls in place describes what the security team is doing but doesn't communicate whether the organization is adequately protected or what residual risks remain."
        - "Raw technical data (firewall logs, IDS alerts) without business context overwhelms executives and doesn't support strategic decision-making about risk priorities or investments."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["governance", "communication", "management"]

  - id: q-d1-122
    domain: domain1
    question: "The 'Bow-Tie' risk analysis model is useful in security risk management because it:"
    options:
      - "Provides a standardized numerical score for comparing risks across different domains"
      - "Visually represents both the causes leading to a risk event AND the consequences after it occurs, along with controls at each stage"
      - "Automates risk assessment by analyzing threat feeds and vulnerability data simultaneously"
      - "Replaces the need for both a threat assessment and a vulnerability assessment"
    correct_answer: 1
    explanations:
      correct: "The Bow-Tie model visualizes risk as a tie-knot shape: on the left side are causes/threats leading to the central risk event; on the right are consequences/impacts. Controls on the left prevent the event (preventive controls); controls on the right limit consequences (recovery controls). This dual view helps organizations understand both prevention and response controls comprehensively."
      incorrect:
        - "Bow-Tie is a visual qualitative analysis tool, not a numerical scoring methodology. CVSS, DREAD, and FAIR provide numerical scoring approaches."
        - "The Bow-Tie model visually represents causes leading to a risk event and consequences after it, along with preventive and recovery controls at each stage — this is its key value."
        - "Bow-Tie is a conceptual modeling tool that requires human analysis. It does not automate risk assessment or integrate automated threat feeds."
        - "Bow-Tie complements threat and vulnerability assessments by showing how identified threats and vulnerabilities connect to consequences. It does not replace either assessment."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["risk", "threat-modeling", "assessment"]

  - id: q-d1-123
    domain: domain1
    question: "A CISO discovers that a business unit signed a contract with a cloud vendor without security review, and the vendor now processes regulated customer data. The contract has a three-year term with no right-to-audit clause. What should the CISO do FIRST?"
    options:
      - "Assess the actual risk exposure of the data already being processed"
      - "Demand the business unit terminate the contract immediately"
      - "Report the business unit manager to executive leadership for policy violation"
      - "Add a right-to-audit clause requirement to the procurement policy"
    correct_answer: 0
    explanations:
      correct: "Understanding the current exposure comes first, because every subsequent decision — whether to accept, renegotiate, or terminate — depends on knowing what data is at risk and what the vendor's actual posture is. Acting before assessing risks a disproportionate or misdirected response."
      incorrect:
        - "This is the correct answer — assess the risk before choosing a response."
        - "Termination may be warranted but is a costly decision that cannot be justified before the exposure is understood."
        - "Accountability matters, but the immediate priority is the data at risk, not the personnel issue."
        - "Strengthening the policy prevents recurrence and should happen, but it does nothing about the exposure that already exists."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["third-party risk", "governance", "incident response"]

  - id: q-d1-124
    domain: domain1
    question: "An organization calculates that a particular risk has an ALE of $80,000. A proposed control costs $95,000 per year and would reduce the ALE to $10,000. What is the correct analysis?"
    options:
      - "The control is justified because it reduces annual loss by $70,000 against a $95,000 cost only if other factors such as regulatory penalties or reputation are also considered"
      - "The control should be implemented because it reduces the ALE substantially"
      - "The control should be rejected because its cost exceeds the original ALE"
      - "The control should be rejected because the residual ALE is not zero"
    correct_answer: 0
    explanations:
      correct: "The control delivers $70,000 of annual risk reduction for $95,000, so on pure quantitative grounds it is not cost-effective. However, ALE calculations frequently omit regulatory fines, contractual penalties, and reputational damage, so the decision requires evaluating whether those unquantified factors close the $25,000 gap."
      incorrect:
        - "This is the correct answer — it applies the quantitative test correctly while recognizing the limits of the model."
        - "Substantial reduction alone does not justify a control; the reduction must be weighed against the cost."
        - "Comparing cost to the original ALE is the wrong test. The correct comparison is cost against the reduction in ALE achieved."
        - "Residual risk is expected and acceptable. No control eliminates risk entirely, and requiring zero residual risk is not a valid decision criterion."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["quantitative risk", "ALE", "cost-benefit"]

  - id: q-d1-125
    domain: domain1
    question: "During a merger, the acquiring company discovers the target has been operating without documented security policies for five years. Regulators have not yet examined the target. What is the MOST significant governance concern?"
    options:
      - "The acquiring company inherits the target's unremediated regulatory liability upon completion"
      - "The target's employees will need security awareness training"
      - "Documentation will take significant effort to produce retroactively"
      - "The target's security tools may be incompatible with the acquirer's"
    correct_answer: 0
    explanations:
      correct: "Liability transfers with acquisition. Undiscovered regulatory violations, breach notification failures, and compliance gaps become the acquirer's responsibility, which is precisely why security due diligence belongs in the merger process before completion rather than after."
      incorrect:
        - "This is the correct answer — inherited liability is the governance issue that can materially change the deal's value."
        - "Training is a real need but a routine operational cost, not the most significant governance concern."
        - "Producing documentation is an effort issue, not a liability issue."
        - "Tool incompatibility is an integration cost, well below inherited regulatory exposure in significance."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["mergers", "due diligence", "compliance"]

  - id: q-d1-126
    domain: domain1
    question: "An employee reports that they clicked a phishing link and entered their credentials. They waited two days before reporting because they feared disciplinary action. What does this MOST clearly indicate about the security program?"
    options:
      - "The organization's culture discourages reporting, which delays detection and increases incident impact"
      - "The phishing simulation program needs to be run more frequently"
      - "The email filtering technology is inadequate"
      - "The employee requires individual remedial training"
    correct_answer: 0
    explanations:
      correct: "A punitive culture teaches people to conceal mistakes, and the two-day delay gave the attacker an uninterrupted window. Mature programs treat good-faith reporting as valuable and respond supportively, because rapid reporting is what makes detective controls effective."
      incorrect:
        - "This is the correct answer — the reporting delay, not the click, is the systemic finding."
        - "More simulations do not address the fear that caused the delay and may reinforce it if results are used punitively."
        - "Filtering will never stop every phishing message, which is exactly why fast reporting matters so much."
        - "Focusing on the individual misses the organizational pattern that will cause the next employee to delay as well."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["security culture", "awareness", "incident reporting"]

  - id: q-d1-127
    domain: domain1
    question: "A company operating in the EU and the US must decide how to handle a data subject's request to delete their personal data, when that data also appears in backups retained for seven years under financial regulation. What is the MOST defensible approach?"
    options:
      - "Delete from active systems, document why backup deletion is impractical, ensure the data is not restored to active use, and let it expire on the normal backup cycle"
      - "Immediately delete the individual's records from all backup media to comply fully with the request"
      - "Refuse the request entirely, citing the financial retention requirement"
      - "Delete the backups containing the record and re-create them without that individual"
    correct_answer: 0
    explanations:
      correct: "Regulators generally accept that expunging individuals from immutable backups is impractical, provided the organization documents its position, prevents restoration into active use, and allows the data to age out normally. This balances the erasure right against a genuine legal retention obligation."
      incorrect:
        - "This is the correct answer — it honors the request as far as practicable while respecting a competing legal obligation."
        - "Selectively modifying backups destroys their integrity and their evidentiary value, and is generally not expected by regulators."
        - "Blanket refusal ignores the obligation to honor the request in active systems, where compliance is entirely achievable."
        - "Destroying and re-creating backups defeats their purpose and would likely violate the financial retention requirement itself."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["GDPR", "right to erasure", "retention"]

  - id: q-d1-128
    domain: domain1
    question: "A risk assessment identifies a threat with high impact but very low likelihood, and a second threat with low impact but very high likelihood. Both have similar calculated risk values. Executives ask which to address first. What is the BEST guidance?"
    options:
      - "Consider the organization's risk appetite and whether the high-impact event could be existential, since equal expected values do not imply equal consequences"
      - "Address the high-likelihood threat first because it will certainly occur"
      - "Address the high-impact threat first because impact always outweighs likelihood"
      - "Address neither, since equal risk values indicate both are within tolerance"
    correct_answer: 0
    explanations:
      correct: "Expected-value arithmetic treats a certain small loss and a remote catastrophic loss as equivalent, but an organization can absorb repeated small losses while a single existential event ends it. Risk appetite and survivability, not the calculated value alone, should drive the sequencing."
      incorrect:
        - "This is the correct answer — it recognizes the limitation of expected value as a sole decision criterion."
        - "Frequency alone does not establish priority when the alternative threat could be catastrophic."
        - "Impact does not automatically outweigh likelihood; that would be an equally mechanical rule."
        - "Equal calculated values say nothing about whether either falls within the organization's stated tolerance."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["risk assessment", "risk appetite", "prioritization"]

  - id: q-d1-129
    domain: domain1
    question: "An organization's incident response plan requires notifying affected customers within 72 hours of confirming a breach. During an incident, the team is uncertain whether personal data was actually accessed. What is the MOST appropriate action?"
    options:
      - "Continue investigating while preparing notification, and engage legal counsel to determine the notification trigger under applicable law"
      - "Wait until the investigation conclusively proves data was accessed before starting any notification process"
      - "Notify all customers immediately regardless of investigation status"
      - "Restart the 72-hour clock each time new information emerges"
    correct_answer: 0
    explanations:
      correct: "Notification obligations and their triggers vary by jurisdiction and often turn on reasonable belief rather than proof. Preparing notification in parallel with investigation preserves the ability to meet the deadline, and legal counsel determines when the obligation is actually triggered."
      incorrect:
        - "This is the correct answer — investigate and prepare in parallel, with counsel determining the trigger."
        - "Waiting for conclusive proof frequently causes organizations to miss statutory deadlines, since deadlines often begin at reasonable belief."
        - "Premature notification of unaffected customers causes unnecessary alarm and reputational harm, and may itself be inaccurate."
        - "Notification clocks are generally not restarted by new information; this would be an unsupportable interpretation."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["breach notification", "incident response", "legal"]

  - id: q-d1-130
    domain: domain1
    question: "A security manager proposes implementing a control that would reduce risk substantially but would make a core business process significantly slower. Business leadership objects. What does the CISSP-expected approach require?"
    options:
      - "Present the risk in business terms and let the accountable business owner make an informed risk decision"
      - "Implement the control because security requirements take precedence over business convenience"
      - "Withdraw the proposal since business leadership has objected"
      - "Escalate to the board to override the business leadership decision"
    correct_answer: 0
    explanations:
      correct: "Security professionals advise on risk; accountable business owners decide whether to accept it. The professional obligation is to ensure the decision is informed and documented, not to make the decision unilaterally or to abandon the concern."
      incorrect:
        - "This is the correct answer — inform the decision, document the outcome, and respect the accountability structure."
        - "Security does not automatically override business need. The discipline exists to enable the business, balancing risk against operational reality."
        - "Silently withdrawing leaves the risk undocumented and unowned, which is a failure of the advisory role."
        - "Escalating to override rather than to inform bypasses the proper accountability structure and should not be the first response."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["governance", "risk acceptance", "professional ethics"]

  - id: q-d1-131
    domain: domain1
    question: "A company's BCP designates a recovery site 3 miles from the primary facility to minimize staff travel time. A consultant identifies this as a weakness. What is the PRIMARY concern?"
    options:
      - "A regional event such as flooding, earthquake, or extended power loss would likely affect both sites simultaneously"
      - "Three miles is too far for staff to travel during an emergency"
      - "Recovery sites must always be in a different country"
      - "The recovery site will have higher operating costs at that distance"
    correct_answer: 0
    explanations:
      correct: "Recovery site separation exists to ensure the same event cannot disable both locations. A site three miles away shares the same power grid, flood plain, seismic zone, and regional infrastructure, which defeats the purpose of having an alternate site."
      incorrect:
        - "This is the correct answer — insufficient geographic separation means shared exposure to regional threats."
        - "Short travel distance is a benefit, not the concern; the problem is shared risk exposure."
        - "There is no requirement for a different country. The requirement is sufficient separation from shared regional threats."
        - "Cost is not the primary concern, and proximity would generally not increase operating costs."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["BCP", "recovery site", "geographic separation"]

  - id: q-d1-132
    domain: domain1
    question: "An organization is selecting a security framework. It operates globally, needs a certifiable standard customers will recognize, and wants a formal management system rather than a control checklist. Which is the BEST fit?"
    options:
      - "ISO/IEC 27001"
      - "NIST Cybersecurity Framework"
      - "CIS Critical Security Controls"
      - "COBIT"
    correct_answer: 0
    explanations:
