  - id: q-d1-103
    domain: domain1
    question: "Under HIPAA, the 'minimum necessary' standard primarily requires covered entities to:"
    options:
      - "Use only the minimum cost security controls required by HIPAA"
      - "Limit access to and disclosure of PHI to the minimum amount necessary to accomplish the intended purpose"
      - "Retain patient health records for the minimum legally required period only"
      - "Apply minimum encryption strength of 128-bit AES to all PHI"
    correct_answer: 1
    explanations:
      correct: "The HIPAA minimum necessary standard (45 CFR §164.502(b)) requires covered entities and business associates to make reasonable efforts to limit access to, use of, and disclosure of protected health information (PHI) to the minimum necessary to accomplish the intended purpose. This limits data exposure and aligns with the security principle of least privilege."
      incorrect:
        - "The minimum necessary standard applies to PHI access and disclosure, not to selecting cheapest security controls. HIPAA requires reasonable and appropriate safeguards."
        - "The minimum necessary standard limits PHI access and disclosure to what is minimally needed for the intended purpose — this is the correct HIPAA definition."
        - "Data retention is covered by separate HIPAA retention requirements (6 years for policies/procedures). The minimum necessary standard addresses access and disclosure scope."
        - "HIPAA does not mandate specific encryption algorithms or key lengths — it requires 'reasonable and appropriate' technical safeguards and addresses addressable implementation specifications."
