    cognitive_level: "recall"
    tags: ["HIPAA", "privacy", "legal", "compliance"]

  - id: q-d1-104
    domain: domain1
    question: "A pre-employment background check reveals that a candidate for a security engineer position was convicted of a misdemeanor DUI 8 years ago, unrelated to computers. What is the MOST appropriate response?"
    options:
      - "Automatically disqualify the candidate as any criminal record is disqualifying for security roles"
      - "Conduct an individualized assessment considering the nature, severity, time elapsed, and relevance to the specific role"
      - "Proceed with hiring as a DUI is not directly related to computer crime or information security"
      - "Request the candidate provide a written explanation and automatically approve if their explanation is satisfactory"
    correct_answer: 1
    explanations:
      correct: "An individualized assessment is legally required in many jurisdictions (EEOC guidance prohibits blanket exclusions based on criminal history) and is the most appropriate practice. The assessment considers: nature of the crime, time elapsed, relevance to the specific position, evidence of rehabilitation, and business necessity. A DUI from 8 years ago may have no bearing on trustworthiness for a security role."
      incorrect:
        - "Blanket disqualification for all criminal records is illegal in many jurisdictions under fair employment laws (EEOC, ban-the-box laws) and fails to consider whether the specific offense is relevant to the role."
        - "An individualized assessment — considering the nature, severity, time elapsed, and job relevance — is the correct and legally appropriate approach."
        - "Automatically proceeding with hiring without review also fails the assessment obligation. The organization must document that it considered the conviction and determined it did not disqualify the candidate based on the role's requirements."
        - "While a written explanation may be part of the process, automatic approval based on the candidate's explanation alone bypasses the organization's own risk assessment. The decision must be made by the hiring organization, not delegated to the candidate."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["personnel", "legal", "hiring"]

  - id: q-d1-105
    domain: domain1
    question: "Which of the following is a 'leading' security metric as opposed to a 'lagging' metric?"
    options:
      - "Number of security incidents reported last quarter"
      - "Percentage of critical vulnerabilities patched within the SLA window"
      - "Total cost of data breaches over the past 12 months"
      - "Number of regulatory findings in the last external audit"
    correct_answer: 1
    explanations:
      correct: "Percentage of critical vulnerabilities patched within the SLA window is a leading metric — it measures a current security program activity that predicts future security posture. High patch compliance rates suggest lower future breach risk. Leading metrics are forward-looking process measures. Lagging metrics measure past outcomes (incidents, breaches, audit findings)."
      incorrect:
        - "Number of incidents reported last quarter is a lagging metric — it measures what has already happened. It reflects past security failures, not current program effectiveness."
        - "Patch compliance rate (percentage of critical vulnerabilities patched within SLA) is a leading metric — it measures current security program activities that predict future outcomes."
        - "Total breach costs over 12 months is a lagging metric — it measures past financial impact of security failures, not predictive of future performance."
        - "Regulatory findings in the last audit is a lagging metric — it reflects past compliance gaps that were found during the assessment period."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["governance", "metrics", "measurement"]

  - id: q-d1-106
    domain: domain1
    question: "A GDPR Data Protection Impact Assessment (DPIA) is REQUIRED before processing begins in which situation?"
    options:
      - "Any time an organization collects email addresses from website visitors"
      - "When processing is likely to result in a high risk to the rights and freedoms of natural persons"
      - "Only when processing personal data of EU citizens outside of the EU"
      - "Whenever an organization hires a new data processor vendor"
    correct_answer: 1
    explanations:
      correct: "GDPR Article 35 requires a DPIA before processing that is 'likely to result in a high risk to the rights and freedoms of natural persons.' Triggers include systematic and extensive profiling, large-scale processing of special categories of data, and systematic monitoring of public areas. The DPIA assesses risks and identifies mitigations before processing begins."
      incorrect:
        - "Collecting email addresses does not automatically trigger a DPIA requirement. GDPR Article 35 requires DPIAs for high-risk processing — routine email collection from website visitors is generally not high-risk processing."
        - "GDPR Article 35 requires a DPIA when processing is likely to result in high risk to individuals' rights and freedoms — this is the correct trigger."
        - "DPIAs are required based on the risk level of processing activities, not based on geographic location of processing or data subjects."
        - "Hiring a new data processor requires a Data Processing Agreement (DPA) under Article 28, not necessarily a DPIA. A DPIA is required for high-risk processing activities, not for every vendor engagement."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["GDPR", "privacy", "DPIA"]

  - id: q-d1-107
    domain: domain1
    question: "Which statement BEST describes how 'inherent risk' relates to 'residual risk' in risk management?"
    options:
      - "Inherent risk is the risk that remains after controls are applied; residual risk is risk before controls"
      - "Inherent risk is the natural risk level without controls; residual risk is what remains after controls are applied"
      - "They are equivalent when controls are 100% effective"
      - "Inherent risk applies to internal threats; residual risk applies to external threats"
    correct_answer: 1
    explanations:
      correct: "Inherent risk is the raw risk level that exists before any security controls or mitigations are applied. Residual risk is the risk that remains after controls are implemented. The relationship is: Inherent Risk → Apply Controls → Residual Risk. Organizations document residual risk and compare it to their risk tolerance to determine if additional controls are needed."
      incorrect:
        - "This is reversed. Inherent risk is before controls; residual risk is after controls. Getting this backward leads to fundamental misunderstanding of risk treatment evaluation."
        - "Inherent risk is the natural risk level without controls applied; residual risk is what remains after applying controls — this is the correct relationship."
        - "If controls were 100% effective, residual risk would approach zero, not equal inherent risk. They are only equal when no controls exist at all."
        - "Both inherent and residual risk concepts apply regardless of threat source (internal or external). The internal/external distinction is about threat origin, not risk calculation methodology."
    difficulty: "easy"
    cognitive_level: "recall"
    tags: ["risk", "fundamentals", "definitions"]

  - id: q-d1-108
    domain: domain1
    question: "The NIST Cybersecurity Framework (CSF) 'Govern' function, added in CSF 2.0, primarily addresses which organizational need?"
    options:
      - "Technical controls for detecting and responding to cybersecurity threats"
