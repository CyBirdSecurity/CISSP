    correct_answer: 1
    explanations:
      correct: "CSF 2.0 added the Govern function to address the organizational context and strategy required to achieve cybersecurity outcomes. It covers establishing cybersecurity risk management strategy, policy, roles, responsibilities, and oversight. Govern is the foundational function that informs how the other five functions (Identify, Protect, Detect, Respond, Recover) are implemented."
      incorrect:
        - "Detecting and responding to threats is addressed by the Detect and Respond functions in the CSF — not the new Govern function."
        - "The Govern function addresses organizational context, strategy, expectations, and accountability for cybersecurity risk management — this is the primary purpose of CSF 2.0's Govern addition."
        - "Recovery planning and communications are covered by the Recover and Respond functions. Govern addresses the strategic and accountability layer above specific response functions."
        - "Supply chain risk is addressed within the Identify function and related Categories. While Govern provides overarching policy direction, supply chain specifics fall under Identify."
