      incorrect:
        - "Both Type I and Type II use the same Trust Services Criteria (Security, Availability, Processing Integrity, Confidentiality, Privacy). The difference is the time horizon, not the scope of criteria."
        - "SOC 2 Type II provides an auditor's opinion on control effectiveness over a defined period of time — this is the key distinguishing characteristic."
        - "Both SOC 2 Type I and Type II are auditor-prepared reports. The difference is point-in-time (Type I) versus period of time (Type II) assessment."
        - "SOC 1 covers financial reporting controls (ICFR). SOC 2 Type I and Type II both address the Trust Services Criteria for security-related controls."
