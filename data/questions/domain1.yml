      incorrect:
        - "Legal holds are about evidence preservation, not surveillance authorization. Increased monitoring during litigation may have separate legal and HR implications unrelated to legal holds."
        - "A legal hold requires preservation of electronically stored information that may be relevant to anticipated or actual litigation — this is the correct definition."
        - "Legal holds apply to specific, identified data relevant to the litigation, not the entire organization's data. Normal retention schedules for unrelated data continue."
        - "Legal holds do not transfer liability. The organization retains legal responsibility for preserving evidence and its security obligations remain unchanged."
