        - "This reversal is incorrect. KPIs measure how well controls perform; KRIs signal increasing risk levels and are predictive/forward-looking."
        - "A KRI is forward-looking and signals increasing risk exposure, while a KPI measures current or historical performance — this is the correct distinction."
        - "KRIs and KPIs serve distinct purposes. KRIs are predictive risk signals; KPIs measure operational performance. They are not interchangeable."
        - "While policy compliance can be measured as a KPI, the defining distinction is that KRIs are forward-looking risk signals, not compliance measures."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["governance", "metrics", "risk"]

  - id: q-d1-081
    domain: domain1
    question: "The Capability Maturity Model Integration (CMMI) Level 3 is characterized by which of the following?"
