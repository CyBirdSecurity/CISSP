  - id: q-d1-102
    domain: domain1
    question: "What is the primary purpose of a 'Legal Hold' (litigation hold) notice from an information security perspective?"
    options:
      - "It authorizes security teams to increase monitoring of suspects during litigation"
      - "It requires the preservation of electronically stored information (ESI) that may be relevant to anticipated litigation"
      - "It restricts all data deletion and backup rotation for the entire organization during a lawsuit"
      - "It transfers legal liability for data security from the organization to its legal counsel"
    correct_answer: 1
    explanations:
