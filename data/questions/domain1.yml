      incorrect:
        - "Vulnerabilities without active threats represent lower risk — not automatically high risk. Risk requires both components."
        - "Risk is not solely defined by vulnerability — a credible threat must exist to exploit it."
        - "Risk is reduced but rarely absolute zero — a threat could emerge at any time. Vulnerabilities still warrant remediation."
