    cognitive_level: "applied"
    tags: ["frameworks", "ISO 27001", "certification"]

  - id: q-d1-133
    domain: domain1
    question: "A penetration tester engaged by an organization discovers evidence that an actual attacker is currently active in the environment. What should the tester do FIRST?"
    options:
      - "Stop testing and immediately notify the designated escalation contact"
      - "Continue the test to determine the full extent of the attacker's access"
      - "Attempt to remove the attacker from the environment"
      - "Complete the engagement and document the finding in the final report"
    correct_answer: 0
    explanations:
      correct: "Discovering a live intrusion is outside the scope of a penetration test. Testing must stop so the organization's incident response process can take over, and continuing risks contaminating evidence and confusing attribution between the tester's activity and the attacker's."
      incorrect:
        - "This is the correct answer — stop and escalate immediately through the agreed contact."
        - "Continuing contaminates the incident scene and may destroy evidence the responders need."
        - "Remediation is not the tester's role and acting unilaterally could alert the attacker or damage systems."
        - "Waiting for the final report leaves an active attacker operating unopposed for the remainder of the engagement."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["penetration testing", "rules of engagement", "incident response"]

  - id: q-d1-134
    domain: domain1
    question: "An organization's asset inventory shows 1,200 servers, but a network discovery scan identifies 1,450 responding hosts. What is the MOST significant implication?"
    options:
      - "250 systems are unmanaged, meaning they are unpatched, unmonitored, and outside every control the program assumes is universal"
      - "The discovery scan is likely producing false positives and should be re-run"
      - "The inventory should be updated to 1,450 to match the scan"
      - "Network capacity planning will need revision"
    correct_answer: 0
    explanations:
      correct: "Systems absent from the inventory receive no patching, no monitoring, no backup, and no access review. They are blind spots that attackers exploit precisely because no one is watching them, and every control the program believes is universally applied is in fact not."
      incorrect:
        - "This is the correct answer — unmanaged assets represent unmeasured and unmitigated risk."
        - "Dismissing the discrepancy as scanner error without investigation would leave real exposure unaddressed."
        - "Simply changing the number records the discrepancy without investigating what those systems are, who owns them, or whether they should exist."
        - "Capacity planning is an operational concern far less significant than the existence of unmanaged systems."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["asset management", "shadow IT", "inventory"]
