    question: "Under GDPR Article 37, which condition REQUIRES an organization to appoint a Data Protection Officer (DPO)?"
    options:
      - "Any organization that processes personal data of more than 500 individuals"
      - "Public authorities and organizations whose core activities involve large-scale processing of sensitive data"
      - "Any organization subject to GDPR that operates in more than one EU member state"
      - "Organizations with annual revenue exceeding €10 million that process personal data"
    correct_answer: 1
    explanations:
      correct: "GDPR Article 37 requires DPO appointment for: (1) public authorities or bodies, (2) organizations whose core activities require large-scale, regular, and systematic monitoring of individuals, or (3) organizations whose core activities involve large-scale processing of special categories (sensitive) data. Revenue thresholds or data subject counts are not the legal triggers."
      incorrect:
        - "GDPR does not specify a minimum number of data subjects to trigger DPO requirements. The triggers are the nature and scale of processing activities."
        - "GDPR Article 37 requires a DPO for public authorities and organizations whose core activities involve large-scale processing of sensitive or systematically monitored personal data."
        - "Operating in multiple EU member states does not automatically require a DPO. A single-country SME processing sensitive data at scale must appoint one; a multinational with minimal data processing may not need to."
