  - id: q-d1-085
    domain: domain1
    question: "A SOC 2 Type II report differs from a SOC 2 Type I report primarily because it:"
    options:
      - "Covers a broader set of Trust Services Criteria than Type I"
      - "Provides an auditor's opinion on the effectiveness of controls over a period of time"
      - "Is prepared by management and reviewed by auditors, while Type I is fully auditor-prepared"
      - "Applies to financial reporting controls, while Type I applies to security controls"
    correct_answer: 1
    explanations:
