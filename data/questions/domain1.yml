      - "ERM and information security risk management use identical methodologies and frameworks"
    correct_answer: 1
    explanations:
      correct: "Enterprise risk management (ERM) provides a holistic, organization-wide view of all risk categories — operational, financial, strategic, reputational, legal, and technology/cybersecurity. Information security risk management is a subset of ERM focused on information and technology risks. Effective security programs integrate with ERM to ensure cybersecurity risk is viewed in the context of the overall business risk portfolio."
      incorrect:
