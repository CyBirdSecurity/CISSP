  - id: q-d1-098
    domain: domain1
    question: "Which of the following BEST illustrates 'security risk framing' as described in NIST SP 800-39?"
    options:
      - "Conducting a quantitative risk assessment using ALE calculations"
      - "Establishing the organizational context, constraints, and assumptions that define how risk decisions will be made"
      - "Selecting appropriate security controls from NIST SP 800-53 control catalog"
      - "Communicating risk findings to the board of directors after an assessment"
    correct_answer: 1
    explanations:
      correct: "Risk framing (the first step in NIST SP 800-39's risk management process) establishes the context for risk decisions. It defines the assumptions, constraints, risk tolerances, and priorities that influence how risk is assessed, responded to, and monitored. Without framing, risk decisions lack organizational context and may be inconsistent with business objectives."
      incorrect:
        - "ALE calculations are part of risk assessment — the second step in NIST SP 800-39. Risk framing comes first and defines the context for those assessments."
        - "Establishing organizational context, constraints, and assumptions for risk decision-making is the definition of risk framing — this is the correct description."
        - "Selecting security controls is the risk response step — the third component of NIST SP 800-39. Framing precedes and informs control selection."
        - "Communicating risk findings is part of risk monitoring and risk assessment activities — it occurs after framing has established the context for those communications."
    difficulty: "hard"
    cognitive_level: "recall"
    tags: ["risk", "NIST", "governance"]

  - id: q-d1-099
    domain: domain1
    question: "From a corporate governance perspective, the board of directors' primary role in cybersecurity is:"
    options:
      - "Reviewing and approving firewall rules and network security configurations"
      - "Overseeing that management has established adequate risk management programs and accountability"
      - "Directly managing security incident response and breach investigation"
      - "Drafting security policies and standards for the organization"
    correct_answer: 1
    explanations:
      correct: "The board's role is governance oversight — ensuring that management has established appropriate risk management programs, accountability structures, and that the organization is managing cyber risk within its risk appetite. The board sets direction and holds management accountable but does not manage operations or technical configurations."
      incorrect:
        - "Firewall rules and technical configurations are operational management tasks — far below board-level governance responsibilities. The board oversees strategy and risk, not technical controls."
        - "The board of directors provides governance oversight by ensuring management has adequate risk management programs and accountability structures for cybersecurity."
        - "Incident response is an operational management function. The board may be briefed on significant incidents but does not directly manage response activities."
        - "Drafting policies and standards is management's responsibility (CISO, security team). The board approves high-level policy direction and risk appetite, not operational security documents."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["governance", "board", "accountability"]

  - id: q-d1-100
    domain: domain1
    question: "Which of the following is a REQUIRED element of a contract to address third-party information security obligations?"
    options:
      - "Requiring the vendor to use only open-source software in their products"
      - "Security requirements, audit rights, breach notification obligations, and data handling standards"
      - "Requiring the vendor to carry a minimum of $100 million in cyber liability insurance"
      - "Mandating that the vendor achieve ISO 27001 certification within one year"
    correct_answer: 1
    explanations:
      correct: "Contractual security obligations should include: security requirements (what controls the vendor must implement), audit rights (ability to audit or receive audit reports), breach notification obligations (how and when to notify if a breach occurs), and data handling standards (classification, retention, destruction). These elements protect the contracting organization and establish accountability."
      incorrect:
        - "Requiring open-source software is not a standard security contract requirement and may be overly restrictive. Contracts should focus on security outcomes, not technology choices."
        - "Security requirements, audit rights, breach notification, and data handling standards are the essential elements of third-party security contract provisions."
        - "Insurance minimums may be appropriate for high-risk vendors but are not universally required for all third-party contracts. Insurance levels should be proportional to the risk and data sensitivity."
        - "Mandating specific certifications (like ISO 27001) can be part of vendor requirements but imposing an arbitrary timeline is not a standard contract element. Many organizations accept SOC 2 reports or equivalent assurance."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["governance", "third-party", "contracts"]

