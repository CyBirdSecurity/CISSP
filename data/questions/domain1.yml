        - "Information security risk management is a component of the broader ERM framework — ERM takes a comprehensive organizational view of all risk types including cybersecurity."
        - "ERM explicitly includes technology, operational, and cyber risks alongside financial risks. Treating them as separate silos undermines the holistic purpose of ERM."
        - "ERM and security risk management share common principles (identify, assess, respond, monitor) but may use different frameworks, risk registers, and tolerance thresholds tailored to their respective domains."
