  - id: q-d1-113
    domain: domain1
    question: "A multinational organization processes EU citizens' data in the US. Under GDPR, which mechanism is most commonly used to provide adequate protection for this international data transfer?"
    options:
      - "EU-US data residency agreements automatically approved by the European Commission"
      - "Standard Contractual Clauses (SCCs) or adequacy decisions from the European Commission"
      - "Storing all EU citizen data in geographically separate databases without access from the US"
      - "Encrypting all data in transit using TLS 1.3 automatically satisfies GDPR transfer requirements"
    correct_answer: 1
    explanations:
      correct: "GDPR Chapter V requires that personal data transferred to third countries receive adequate protection. The most common mechanisms are: (1) European Commission adequacy decisions (for countries deemed to provide equivalent protection) and (2) Standard Contractual Clauses (SCCs) — pre-approved contract clauses that impose GDPR-equivalent obligations on the data importer. The EU-US Data Privacy Framework (2023) is the current adequacy mechanism for US transfers."
      incorrect:
        - "There is no automatic EU-US agreement covering all data transfers. Specific mechanisms (adequacy decisions, SCCs, Binding Corporate Rules) must be used. The EU-US Data Privacy Framework requires self-certification by US organizations."
        - "Standard Contractual Clauses (SCCs) and adequacy decisions from the European Commission are the most commonly used GDPR transfer mechanisms."
        - "Geographic data residency is one approach (keeping data in the EU) but does not enable the transfer that may be operationally necessary. The question asks about protecting international transfers, not preventing them."
        - "Encryption protects data security but does not address GDPR's legal basis requirements for international transfers. A receiving country still needs adequate legal protections regardless of encryption."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["GDPR", "privacy", "international", "legal"]

  - id: q-d1-114
    domain: domain1
    question: "An organization's risk register shows a risk rated as 'high likelihood, high impact' that has been in the register for three years with no treatment action. This most likely indicates a failure in which aspect of risk management?"
    options:
      - "Risk identification — the risk was not properly discovered during the initial assessment"
      - "Risk monitoring — the risk's status has not been updated to reflect current conditions"
      - "Risk treatment — the organization has failed to respond to an accepted risk beyond its tolerance"
      - "Risk communication — the risk has not been communicated to the appropriate stakeholders"
    correct_answer: 2
    explanations:
      correct: "A high-high risk with no treatment over three years represents a failure in risk treatment (response). Unless the organization has formally accepted this risk (and documented it as an exception within its risk tolerance), leaving a high-priority risk untreated indicates inadequate risk response governance. Risks must be treated, accepted, transferred, or avoided — they cannot simply persist without action."
      incorrect:
        - "The risk is in the register, which means it was identified. The failure is not in identification but in treatment — the identified risk has received no response action."
        - "While monitoring may need improvement, the core failure is that the organization has not taken any treatment action on a high-priority risk — this is a risk treatment failure."
        - "Risk treatment failure — the organization has not responded to an accepted risk that likely exceeds its tolerance — is the most accurate characterization of this situation."
        - "If the risk is in the register and visible to stakeholders, communication may be occurring. The problem is not awareness — it is the absence of treatment action."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["risk", "governance", "risk-management"]

  - id: q-d1-115
    domain: domain1
    question: "A security manager presents the board with both quantitative risk data (ALE calculations) and qualitative assessments. The board questions whether quantitative assessments are always more accurate than qualitative. What is the BEST response?"
    options:
      - "Quantitative assessments are always more objective and accurate than qualitative approaches"
      - "Quantitative assessments appear precise but rely on estimates; qualitative assessments may better capture expert judgment when data is limited"
      - "Qualitative assessments are always preferred because boards don't understand financial calculations"
      - "The choice between methods is irrelevant as they always produce the same risk prioritization"
    correct_answer: 1
    explanations:
      correct: "Quantitative risk assessments (ALE, SLE, ARO) appear precise with specific dollar amounts but are only as accurate as their input estimates — ARO values especially are often educated guesses. Qualitative assessments (High/Medium/Low ratings) may better capture expert judgment when historical data is scarce. Each approach has strengths: quantitative provides financial context; qualitative provides accessible expert consensus. Most mature programs use both."
      incorrect:
        - "Quantitative assessments are not always more accurate. Their precision is illusory if the underlying inputs (ARO, EF, asset values) are estimated without reliable historical data. Garbage in, garbage out."
        - "Quantitative methods appear precise but depend on estimates; qualitative methods may better reflect expert judgment when empirical data is limited — this accurately describes the trade-offs."
        - "Many boards prefer quantitative data for financial decisions. The suggestion that qualitative is 'always preferred' for boards is incorrect — the choice should be risk-based and context-dependent."
        - "Quantitative and qualitative methods frequently produce different prioritizations because they measure different things. An extreme qualitative risk may not correspond to the highest ALE if the asset value is low."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["risk", "assessment", "quantitative", "qualitative"]

