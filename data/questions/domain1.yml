  - id: q-d1-086
    domain: domain1
    question: "An employee requests a security policy exception to use personally owned cloud storage for work files. What is the MOST important element of a formal policy exception process?"
    options:
      - "Automatic approval for exceptions with defined duration and mandatory review date"
      - "Documented business justification, compensating controls, risk acceptance by an appropriate authority, and time-bound review"
      - "Immediate escalation to the CISO for all exception requests regardless of risk level"
      - "Denial of all exceptions to maintain consistent policy enforcement"
    correct_answer: 1
    explanations:
      correct: "A formal policy exception process requires: documented business justification (why the exception is needed), compensating controls (alternative mitigations), formal risk acceptance by an appropriate authority (manager, CISO, risk committee depending on risk level), and a time-bound review date (exceptions should not be permanent). This ensures exceptions are managed rather than ignored."
      incorrect:
        - "Automatic approval undermines the exception process — exceptions must be formally evaluated and accepted by an appropriate authority with documented justification and compensating controls."
        - "A documented business justification, compensating controls, risk acceptance by appropriate authority, and time-bound review are all essential elements of a formal exception process."
        - "Not all exceptions require CISO involvement. A risk-based approach delegates exception approval based on risk level — low-risk exceptions may be approved by line managers; high-risk ones escalate to senior leadership."
        - "A blanket denial policy creates shadow IT and compliance failures. A formal exception process acknowledges business reality while managing risk through documentation, compensating controls, and time limits."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["governance", "policy", "risk"]

  - id: q-d1-087
    domain: domain1
    question: "An organization's board formally sets its risk appetite at 'low' for regulatory compliance violations. An operational team proposes a control shortcut that provides 80% compliance at 20% cost. What is the correct response?"
    options:
      - "Implement the shortcut as it is more cost-effective than full compliance"
      - "Reject the shortcut because it exceeds the board-defined risk appetite for compliance risk"
      - "Implement the shortcut but document the deviation as an accepted risk"
      - "Escalate to the CISO to make a judgment call on cost versus compliance"
    correct_answer: 1
    explanations:
      correct: "When the board has formally established a low risk appetite for regulatory compliance, operational decisions must stay within that threshold. An 80% compliance approach carries residual compliance risk that exceeds the board's stated tolerance. The board's risk appetite is a governance mandate, not a suggestion. The operational team must find a fully compliant solution."
      incorrect:
        - "Cost-effectiveness does not override the board's risk appetite statement. A low compliance risk appetite means regulatory violations are not acceptable even if cheaper."
        - "Rejecting the shortcut is correct because it would produce compliance risk that exceeds the board-defined low risk appetite — governance mandate overrides operational cost preference."
        - "Documenting as accepted risk does not resolve the problem if the residual risk exceeds the board's stated appetite. Risk acceptance must align with the risk appetite framework."
        - "The CISO cannot override a board-level risk appetite decision. The appropriate path is to find a compliant approach or present a business case to the board to revise the risk appetite."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["risk", "governance", "risk-appetite"]

  - id: q-d1-088
    domain: domain1
    question: "During an employee onboarding process, which security procedure is MOST directly related to the principle of least privilege?"
    options:
      - "Providing the new employee with a security awareness training certificate"
      - "Assigning access rights that correspond only to the specific duties of the new role"
      - "Conducting a background check prior to the employee starting work"
      - "Having the employee sign the acceptable use policy before receiving system access"
    correct_answer: 1
    explanations:
      correct: "Least privilege requires that individuals are granted only the minimum access necessary to perform their specific job functions. During onboarding, this means provisioning access rights that precisely match the new employee's defined role — not granting broad access 'just in case' or replicating another user's access profile."
      incorrect:
        - "Security awareness training is a critical onboarding activity but is related to education and policy compliance — not directly to least privilege access provisioning."
        - "Assigning access rights that correspond only to the specific duties of the new role directly implements the principle of least privilege during onboarding."
        - "Background checks are a personnel security control related to trustworthiness verification — important but not directly related to least privilege."
        - "Signing the acceptable use policy establishes the employee's acknowledgment of security responsibilities — it is a governance control, not a least privilege access control."
    difficulty: "easy"
    cognitive_level: "applied"
    tags: ["personnel", "principles", "access-control"]

  - id: q-d1-089
    domain: domain1
    question: "Under GDPR, which of the following is a valid lawful basis for processing personal data for marketing purposes?"
    options:
      - "Legitimate interest always justifies marketing data processing without consent"
      - "Explicit consent or, where applicable, legitimate interests that are not overridden by the data subject's rights"
      - "Contract performance is a sufficient lawful basis for all marketing activities"
      - "Public interest automatically authorizes marketing by nonprofit organizations"
    correct_answer: 1
    explanations:
      correct: "For marketing purposes, organizations typically rely on explicit consent (Article 6(1)(a)) or legitimate interests (Article 6(1)(f)), but legitimate interests requires a balancing test — the organization's interests must not be overridden by the individual's rights and expectations. Direct marketing can qualify under legitimate interests, but the data subject must always have the right to object."
      incorrect:
        - "Legitimate interest does not automatically justify marketing processing. It requires a three-part test: purpose test (is there a legitimate interest?), necessity test (is processing necessary?), and balancing test (do individual rights override the interest?). Blanket claims of legitimate interest are not valid."
        - "For marketing, explicit consent or legitimate interests (with balancing test) are the appropriate lawful bases under GDPR — neither is an unlimited right."
        - "Contract performance (Article 6(1)(b)) only covers processing necessary to fulfill the specific contract terms. Using contract data for unrelated marketing is not covered by this lawful basis."
        - "Public interest (Article 6(1)(e)) covers tasks in the public interest or official authority — it does not authorize commercial marketing activities by nonprofits."
    difficulty: "hard"
    cognitive_level: "recall"
    tags: ["GDPR", "privacy", "legal"]

  - id: q-d1-090
    domain: domain1
    question: "Which of the following correctly describes the relationship between a 'security event' and a 'security incident'?"
    options:
      - "A security event and a security incident are synonymous terms used interchangeably"
      - "Every security event is an incident; not all incidents generate events"
      - "A security event is any observable occurrence; an incident is an event that adversely affects security"
      - "A security incident is a low-severity event; a security breach is a high-severity incident"
    correct_answer: 2
    explanations:
      correct: "A security event is any observable occurrence in a system or network — most events are benign (a user logging in successfully is an event). A security incident is an event or series of events that adversely affects the confidentiality, integrity, or availability of information assets and requires a response. All incidents are events, but not all events are incidents."
      incorrect:
        - "These are distinct terms with specific meanings in security. Using them interchangeably leads to miscommunication about severity and required response actions."
        - "Not every event is an incident. Events include routine activities (logins, file accesses). Only events that adversely affect CIA or require response are incidents."
        - "A security event is any observable occurrence; a security incident is an event adversely affecting security — this correctly distinguishes the two terms."
        - "Severity levels don't define the event/incident distinction. An incident is any adverse event requiring response, regardless of severity. A 'breach' typically refers to confirmed unauthorized access or data exposure."
    difficulty: "easy"
    cognitive_level: "recall"
    tags: ["incident-response", "fundamentals", "definitions"]

  - id: q-d1-091
    domain: domain1
    question: "The SABSA (Sherwood Applied Business Security Architecture) framework is best described as:"
    options:
      - "A technical standard specifying encryption algorithms for enterprise systems"
      - "A business-driven security architecture framework that aligns security to business objectives"
      - "A risk scoring methodology for quantifying cybersecurity threats"
      - "A compliance framework for regulated financial institutions"
    correct_answer: 1
    explanations:
      correct: "SABSA is an enterprise security architecture framework that ensures security is derived from and aligned with business requirements. It uses a layered architecture model (similar to Zachman framework) with six layers: Contextual (Business), Conceptual (Architect), Logical (Designer), Physical (Builder), Component (Tradesman), and Operational. It is business-driven, not compliance-driven."
      incorrect:
        - "SABSA is an architecture framework, not a technical encryption standard. Encryption standards like AES or FIPS 140-2 address algorithm selection."
        - "SABSA is a business-driven security architecture framework that aligns security controls and decisions with business objectives and requirements."
        - "Risk scoring methodologies include FAIR, NIST risk frameworks, and qualitative matrices. SABSA provides architectural guidance, not a risk scoring system."
        - "SABSA applies across industries and is not specific to financial institutions. Compliance frameworks for finance include GLBA, SOX, and PCI DSS."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["frameworks", "architecture", "governance"]

  - id: q-d1-092
    domain: domain1
    question: "An organization performs a risk treatment analysis and identifies that a specific technical control will reduce the ALE from $200,000 to $50,000. The control costs $120,000 annually. What is the value of this control?"
    options:
      - "The control provides no value because it costs more than the residual risk"
      - "$30,000 net benefit — the control saves $150,000 in ALE while costing $120,000"
      - "$50,000 — equal to the residual ALE after the control is implemented"
      - "The control should be rejected because ALE reduction should equal 100% of the control cost"
    correct_answer: 1
    explanations:
      correct: "The value of a control is calculated as: ALE Before - ALE After - Annual Control Cost = $200,000 - $50,000 - $120,000 = $30,000 net benefit. Even though the control costs $120,000, it reduces losses by $150,000, producing a positive net value. Controls with positive net value are worth implementing from a cost-benefit perspective."
      incorrect:
        - "The control does have value. ALE reduction ($150,000) minus annual cost ($120,000) yields a $30,000 net benefit. The control costs less than the risk reduction it provides."
        - "$30,000 is the correct net benefit: $200,000 (ALE before) - $50,000 (ALE after) - $120,000 (control cost) = $30,000 positive return."
        - "$50,000 is the residual ALE, not the value of the control. Control value is the net financial benefit: risk reduction minus control cost."
        - "There is no requirement for ALE reduction to equal 100% of control cost. Any positive net value (risk reduction minus control cost) justifies the control on cost-benefit grounds."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["risk", "quantitative", "cost-benefit"]

  - id: q-d1-093
    domain: domain1
    question: "Under the NIST Risk Management Framework (RMF), which role has the authority to formally accept residual risk and authorize a system to operate?"
    options:
      - "The System Owner"
      - "The Chief Information Security Officer (CISO)"
      - "The Authorizing Official (AO)"
      - "The Information System Security Officer (ISSO)"
    correct_answer: 2
    explanations:
      correct: "The Authorizing Official (AO) — typically a senior organizational official — has the authority and accountability to formally accept the residual risk of a system and issue an Authorization to Operate (ATO). This is a non-delegatable senior management accountability role. The AO reviews the Security Assessment Report and Plan of Action and Milestones (POA&M) before authorizing."
      incorrect:
        - "The System Owner is responsible for day-to-day system operations and ensuring security controls are implemented, but they cannot authorize a system to operate — that authority belongs to the AO."
        - "The CISO provides security policy and oversight for the organization but does not have the authority to authorize individual systems to operate under RMF. The AO is the correct role."
        - "The AO (Authorizing Official) has the authority to formally accept residual risk and issue an Authorization to Operate."
        - "The ISSO manages the security posture of the system and supports the assessment process but does not have authority to authorize system operation — that is the AO's role."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["governance", "RMF", "NIST", "roles"]

  - id: q-d1-094
    domain: domain1
    question: "An organization using a third-party SaaS provider experiences a data breach caused by a vulnerability in the provider's software. From a governance perspective, who bears ultimate accountability to the customers whose data was breached?"
    options:
      - "The SaaS provider, as the technical cause of the breach is in their software"
      - "The organization that contracted the SaaS provider, as the data controller"
      - "The cyber insurance company, as they cover the breach costs"
      - "Shared equally between the SaaS provider and the contracting organization"
    correct_answer: 1
    explanations:
      correct: "Under GDPR and most privacy frameworks, the data controller (the contracting organization) bears ultimate accountability to data subjects for how their data is protected, even when processing is delegated to a data processor (SaaS provider). The controller must conduct due diligence, have a data processing agreement in place, and cannot transfer accountability to a vendor."
      incorrect:
        - "While the SaaS provider may have technical liability and contractual obligations to the contracting organization, they are typically a data processor. The data controller (the contracting organization) holds primary accountability to affected individuals."
        - "The contracting organization, as the data controller, bears ultimate accountability to its customers — it chose and contracted the SaaS provider and is responsible for ensuring adequate protections."
        - "Insurance covers costs but does not transfer legal accountability. Accountability to data subjects remains with the data controller regardless of insurance coverage."
        - "While contractual liability may be shared, ultimate accountability to data subjects is not equally shared. The data controller has primary legal and regulatory accountability."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["governance", "GDPR", "third-party", "accountability"]

  - id: q-d1-095
    domain: domain1
    question: "What is the Annualized Rate of Occurrence (ARO) for a threat event that is expected to happen approximately once every four years?"
    options:
      - "4.0"
      - "0.25"
      - "0.5"
      - "25%"
    correct_answer: 1
    explanations:
      correct: "ARO is the estimated frequency of a threat occurring in a one-year period. If an event occurs once every four years, the ARO = 1/4 = 0.25. This represents a 25% probability of occurrence in any given year and is used in calculating ALE (ALE = SLE × ARO)."
      incorrect:
        - "4.0 would mean the event occurs 4 times per year. Once every four years = 1/4 = 0.25."
        - "0.25 is the correct ARO for an event expected to occur once every four years (1 ÷ 4 = 0.25)."
        - "0.5 would represent once every two years. Once every four years = 0.25."
        - "25% correctly represents the probability, but ARO is expressed as a decimal (0.25) in risk calculations, not as a percentage — though both represent the same value."
    difficulty: "easy"
    cognitive_level: "recall"
    tags: ["risk", "quantitative", "ARO"]

  - id: q-d1-096
    domain: domain1
    question: "The Exposure Factor (EF) in quantitative risk analysis represents which of the following?"
    options:
      - "The total annual cost of security controls protecting an asset"
      - "The percentage of asset value lost if a specific threat materializes"
      - "The probability that a vulnerability will be exploited in a given year"
      - "The ratio of residual risk to inherent risk after controls are applied"
    correct_answer: 1
    explanations:
      correct: "The Exposure Factor (EF) is the percentage of asset value expected to be lost if a specific threat event occurs. For example, if a fire would destroy 50% of a $1,000,000 building, EF = 0.50. SLE = Asset Value × EF. The EF reflects how much damage a single incident would cause."
      incorrect:
        - "Control costs are part of the cost-benefit analysis, not the EF. EF represents potential loss per incident as a percentage of asset value."
        - "EF is the percentage of asset value lost if a specific threat materializes — this is the definition of Exposure Factor."
        - "The probability of exploitation in a given year is the Annualized Rate of Occurrence (ARO), not the Exposure Factor."
        - "The ratio of residual to inherent risk describes risk reduction effectiveness, not the Exposure Factor. EF is specific to a single threat event's damage potential."
    difficulty: "easy"
    cognitive_level: "recall"
    tags: ["risk", "quantitative", "EF"]

  - id: q-d1-097
    domain: domain1
    question: "COBIT 2019 is best described as a framework for which purpose?"
    options:
      - "Selecting and implementing security controls for federal information systems"
      - "Governance and management of enterprise IT, supporting business goals alignment"
