        - "The Purpose Specification Principle requires that the purposes for which personal data are collected be specified at or before collection. It defines what purposes are allowed — the Use Limitation Principle enforces those limits."
        - "The Use Limitation Principle directly addresses secondary use — using data beyond the stated purposes — and is the correct OECD principle here."
