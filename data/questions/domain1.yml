  - id: q-d1-083
    domain: domain1
    question: "The California Consumer Privacy Act (CCPA) differs from GDPR most significantly in which way?"
    options:
      - "CCPA applies to all businesses regardless of size; GDPR only applies to large enterprises"
      - "CCPA grants opt-out rights for data sales; GDPR requires affirmative opt-in consent for most processing"
      - "CCPA requires 72-hour breach notification; GDPR requires 30-day notification"
      - "CCPA applies extraterritorially to any business worldwide; GDPR applies only within the EU"
    correct_answer: 1
    explanations:
      correct: "A key distinction is the consent model: CCPA gives consumers the right to opt-out of the sale of their personal information (opt-out model), while GDPR typically requires explicit, affirmative consent (opt-in) before collecting or processing personal data for many purposes. GDPR's lawful basis framework is more comprehensive than CCPA's opt-out approach."
      incorrect:
        - "CCPA applies to businesses meeting revenue/data thresholds ($25M revenue OR 100,000 consumers' data OR 50% revenue from selling data). Both CCPA and GDPR have thresholds — neither applies to all businesses."
        - "CCPA's opt-out for data sales versus GDPR's opt-in consent model is the most significant philosophical distinction between the two frameworks."
        - "GDPR requires 72-hour breach notification; CCPA does not independently set breach notification timing (California's separate data breach notification law applies). This choice reverses the actual requirement."
        - "Both laws have extraterritorial reach. GDPR applies to any organization offering goods/services to EU residents; CCPA applies to qualifying businesses with California consumers. Neither is strictly geographically limited."
