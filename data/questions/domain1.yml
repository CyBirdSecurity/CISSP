    correct_answer: 1
    explanations:
      correct: "CMMI Level 3 (Defined) means processes are well-characterized, understood, and described in standards, procedures, and tools. They are proactively managed across the organization. Level 1 is Initial (chaotic), Level 2 is Managed (reactive), Level 3 is Defined (proactive), Level 4 is Quantitatively Managed, Level 5 is Optimizing."
