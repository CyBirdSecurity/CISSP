      incorrect:
        - "Internet connectivity during forensic imaging introduces risk of evidence contamination; forensic workstations are typically isolated."
        - "Write blocker preventing evidence modification is correct — this is the foundational forensic evidence preservation control."
        - "Encrypting the evidence drive before imaging is not standard practice; evidence integrity is maintained through hashing, not encryption."
        - "Booting from the evidence drive modifies it (updates last boot time, log files, swap); forensic imaging must be done without booting the subject drive."
