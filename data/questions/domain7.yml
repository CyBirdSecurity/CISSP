  - id: q-d7-092
    domain: domain7
    question: "During an incident response, the team discovers that the attacker used a legitimate cloud storage service (OneDrive, Dropbox) as their C2 infrastructure. Why does this technique complicate detection and response?"
    options:
      - "Cloud storage services encrypt all traffic, making it impossible to detect"
      - "Traffic to legitimate cloud services blends with normal business traffic, blocking the C2 channel by domain may disrupt legitimate business operations"
      - "Cloud services have legal immunity from law enforcement requests"
      - "Blocking cloud storage IPs prevents all internet access for the organization"
    correct_answer: 1
    explanations:
      correct: "Using legitimate cloud services (Dropbox, OneDrive, GitHub, Slack API) for C2 is called 'living off trusted sites' (LOTS). Traffic to these services is normally allowed and expected, making it difficult to distinguish malicious C2 communication from legitimate use. Blocking the entire domain would disrupt legitimate business use — the attacker exploits this dependency."
      incorrect:
        - "While HTTPS encryption conceals content, detection focuses on behavioral anomalies (unusual volumes, process making cloud API calls, timing patterns) — TLS interception can also help."
        - "Blending with legitimate traffic making blocking problematic is correct — this is why LOTS/cloud C2 complicates response."
        - "Cloud services do not have legal immunity; they comply with lawful legal process through their terms of service."
        - "Cloud storage services share IPs with CDNs and many other services; blocking their IPs would affect far more than just that service."
    difficulty: "hard"
    tags: ["C2", "cloud-C2", "living-off-trusted-sites", "incident-response"]

  - id: q-d7-093
    domain: domain7
    question: "An organization's security team is reviewing an after-action report from a security incident. They identify that the incident spread to additional systems because the initial containment team did not isolate lateral movement pathways. What type of IR improvement should be prioritized?"
    options:
      - "Investing in better perimeter firewalls"
      - "Developing and practicing containment playbooks that include network isolation procedures, not just endpoint isolation"
      - "Increasing log retention from 90 to 365 days"
      - "Implementing stronger password policies across the organization"
    correct_answer: 1
    explanations:
      correct: "The root cause was incomplete containment — isolating the initial compromised system but not blocking lateral movement pathways (network segments, shared credentials, remote administration channels). Containment playbooks must explicitly address east-west traffic isolation, account disablement, and network segmentation procedures, not just endpoint removal from the network."
      incorrect:
        - "Perimeter firewalls don't address internal lateral movement once an attacker is inside the network."
        - "Containment playbooks addressing network isolation and lateral movement pathways is correct — this directly addresses the identified IR gap."
        - "Log retention helps with detection and forensics; it doesn't prevent lateral movement during containment."
        - "Password policies are preventive; they don't address the containment execution gap identified in the lessons learned."
    difficulty: "medium"
    tags: ["containment", "lateral-movement", "playbooks", "lessons-learned"]

  - id: q-d7-094
    domain: domain7
    question: "An organization must notify affected individuals of a data breach within 72 hours under GDPR. The security team identifies a breach on Friday afternoon. What should guide the notification timeline decision?"
    options:
      - "The 72-hour clock starts only on the next business day since the weekend should not count"
      - "The 72-hour clock starts when the organization becomes aware of the breach; weekends are not excluded and missing the deadline requires justification"
      - "Notification can be delayed up to 30 days if the investigation is not complete"
      - "The 72 hours applies only to breaches affecting EU citizens regardless of where the breach occurred"
    correct_answer: 1
    explanations:
      correct: "GDPR Article 33 requires notification to the supervisory authority 'without undue delay and, where feasible, not later than 72 hours after becoming aware.' The clock runs continuously from the moment of awareness — weekends do not pause it. If the 72-hour deadline cannot be met, the notification should be sent with a reason for the delay, and information can be supplemented once investigation progresses."
      incorrect:
        - "GDPR's 72-hour clock is continuous; business days are not a valid exception and missing the deadline requires explanation."
        - "Continuous 72-hour clock from awareness with weekends not excluded is correct — this is the GDPR Article 33 requirement."
        - "30-day extensions are not provided in GDPR; notification must occur within 72 hours with phased updates if needed."
        - "GDPR applies to processing of EU residents' data regardless of where the breach occurred; the requirement is not limited to EU-located breaches."
    difficulty: "medium"
    tags: ["GDPR", "breach-notification", "72-hour", "incident-response"]

  - id: q-d7-095
    domain: domain7
    question: "A security operations team deploys a network flow analysis solution to detect anomalous traffic patterns. Which threat is BEST detected through NetFlow/IPFIX analysis rather than deep packet inspection?"
    options:
      - "SQL injection attacks in HTTP POST bodies"
      - "XSS payloads embedded in web page responses"
      - "Encrypted C2 traffic detected through behavioral patterns: beacon intervals, data volume anomalies, and unusual connection patterns"
      - "Malware signatures in downloaded executable files"
    correct_answer: 2
    explanations:
      correct: "NetFlow/IPFIX captures connection metadata (IP, port, protocol, bytes, duration, timing) without inspecting packet content. This is ideal for behavioral analysis of encrypted traffic: C2 beacons appear as regular connection intervals; data exfiltration shows as large outbound data volumes; lateral movement appears as unusual internal scanning patterns. Content inspection is impossible in encrypted flows, but behavioral patterns remain visible."
      incorrect:
        - "SQL injection payloads are in packet content; NetFlow only captures metadata without payload inspection."
        - "XSS in response bodies requires content inspection; NetFlow cannot inspect HTTP response content."
        - "Behavioral C2 detection through connection metadata is correct — NetFlow excels at pattern analysis when content inspection is unavailable."
        - "Malware signature detection requires file content inspection; NetFlow only captures connection metadata."
    difficulty: "medium"
    tags: ["NetFlow", "network-analysis", "behavioral-detection", "encrypted-traffic"]

  - id: q-d7-096
    domain: domain7
    question: "An organization's BCP identifies that a critical business process depends on a third-party SaaS vendor. During the vendor's outage, the organization has no manual fallback. What BCP design principle has the organization failed to implement?"
    options:
      - "Single point of failure analysis and redundancy planning"
      - "Business Impact Analysis (BIA) for internal systems only"
      - "Vendor due diligence for cybersecurity posture"
      - "Asset inventory management"
    correct_answer: 0
    explanations:
      correct: "The organization has a single point of failure (the SaaS vendor) with no redundancy or fallback procedure. BCP requires identifying single points of failure — dependencies on single vendors, systems, or people — and implementing redundancy or manual fallback procedures. This applies to external vendors as much as internal systems."
      incorrect:
        - "Single point of failure analysis and redundancy planning is correct — this is the BCP principle the organization failed to apply."
        - "BIA should cover all dependencies including third-party vendors; limiting to internal systems is an incomplete BIA."
        - "Vendor cybersecurity due diligence addresses security posture; the issue here is availability/redundancy planning."
        - "Asset inventory management tracks assets; it doesn't address single-vendor dependency risk."
    difficulty: "medium"
    tags: ["BCP", "single-point-of-failure", "third-party-dependency", "redundancy"]

  - id: q-d7-097
    domain: domain7
    question: "An organization wants to improve its mean time to detect (MTTD) for security incidents. Which combination of improvements would MOST directly reduce MTTD?"
    options:
      - "Increasing log retention from 90 to 365 days and adding more analysts to the SOC"
      - "Improving detection rule quality, expanding log source coverage, implementing threat hunting, and tuning alerts to reduce false positive fatigue"
      - "Implementing stronger preventive controls to reduce the number of incidents"
      - "Conducting more frequent penetration tests to identify vulnerabilities"
    correct_answer: 1
    explanations:
      correct: "MTTD is reduced by improving detection effectiveness: better correlation rules find incidents faster, comprehensive log coverage eliminates blind spots, threat hunting proactively finds incidents that automated detection misses, and reducing false positive volume ensures analysts aren't overwhelmed and miss real incidents. All four directly contribute to faster detection."
      incorrect:
        - "Longer log retention improves investigation capability after detection but doesn't improve detection speed; more analysts help but without detection improvements they triage the same slow alerts."
        - "Improving detection rules, expanding coverage, threat hunting, and reducing false positive fatigue is correct — these directly reduce time to detect."
        - "Stronger preventive controls reduce incident frequency but don't improve detection speed for incidents that do occur."
        - "Penetration tests identify vulnerabilities; they don't directly improve the SOC's detection speed for real incidents."
    difficulty: "medium"
    tags: ["MTTD", "SOC", "detection-engineering", "false-positives"]

  - id: q-d7-098
    domain: domain7
    question: "An organization operates a 24x7 SOC and is evaluating SOC staffing models. Which model provides the most resilience for continuous coverage while maintaining deep expertise?"
    options:
      - "Follow-the-sun model with geographically distributed regional SOC teams covering different time zones"
      - "Single-location 24x7 SOC with rotating overnight shifts for all analysts"
      - "Business-hours-only SOC with automated alerting for off-hours incidents"
      - "Fully outsourced MSSP with no in-house security operations team"
    correct_answer: 0
    explanations:
      correct: "Follow-the-sun SOC models place security operations teams in different geographic regions (e.g., Americas, EMEA, APAC) that hand off coverage as business hours shift globally. Each team works normal daytime hours, avoiding overnight shifts that cause analyst fatigue. This model provides continuous coverage with engaged, well-rested analysts and regional context."
      incorrect:
        - "Follow-the-sun with geographically distributed regional teams is correct — this is the optimal model for 24x7 coverage quality."
        - "Single-location overnight shifts cause analyst fatigue and lower detection quality; it is less resilient than follow-the-sun."
        - "Business-hours-only SOC creates coverage gaps when attackers commonly operate (nights and weekends); this is a significant risk."
        - "Fully outsourced MSSP loses institutional knowledge and organizational context; a hybrid model typically provides better outcomes."
    difficulty: "medium"
    tags: ["SOC", "staffing-models", "follow-the-sun", "security-operations"]

  - id: q-d7-099
    domain: domain7
    question: "A forensic analyst is examining an image of a compromised Windows system and wants to determine what programs were recently executed, even if the files have since been deleted. Which Windows artifact provides evidence of program execution?"
    options:
      - "Windows Registry Run keys — programs registered for startup"
      - "Windows Prefetch files (.pf) — records of program execution including last run time and frequency"
      - "Windows Event Log 4688 — new process creation events"
      - "Windows Scheduled Tasks XML — tasks configured to run programs"
    correct_answer: 1
    explanations:
      correct: "Windows Prefetch files (in C:\\Windows\\Prefetch) are created by the Windows SuperFetch service and record evidence of program execution: the executable name, last run time, run count, and files accessed during execution. Even if the executable is deleted, the prefetch file may persist, providing evidence that the program was executed."
      incorrect:
        - "Registry Run keys show programs configured to auto-start, not a record of programs that actually executed."
        - "Prefetch files recording execution history even after file deletion is correct — this is a primary forensic artifact for execution evidence."
        - "Event ID 4688 provides real-time process creation logs but requires process auditing to be enabled; if logging was disabled or logs cleared, 4688 events would be missing. Prefetch files persist independently."
        - "Scheduled Tasks XML shows configured tasks, not evidence of program execution history."
    difficulty: "hard"
    tags: ["Windows-forensics", "Prefetch", "execution-artifacts", "digital-forensics"]

  - id: q-d7-100
    domain: domain7
    question: "An organization's crisis communications plan designates a single authorized spokesperson for all external communications during a security incident. What is the PRIMARY security reason for this control?"
    options:
      - "To reduce the number of people who must be briefed on incident details, limiting information exposure"
      - "To ensure consistent, legally reviewed messaging and prevent accidental disclosure of sensitive investigation details or admission of liability"
      - "To allow other staff to focus on technical response rather than communications"
      - "To comply with SEC regulations requiring designated incident communicators"
    correct_answer: 1
    explanations:
      correct: "Multiple, uncoordinated communicators risk contradictory statements, premature disclosure of investigation findings (tipping off attackers or creating legal admissions), and inconsistent messaging that damages credibility. A single spokesperson ensures all external communications are reviewed by legal counsel and PR before release, protecting the investigation and the organization's legal position."
      incorrect:
        - "Limiting briefings reduces information exposure risk but is a secondary benefit; the primary purpose is communication consistency and legal protection."
        - "Consistent legally reviewed messaging preventing accidental harmful disclosures is correct — this is the primary security and legal rationale."
        - "Staff focus on technical response is an operational benefit; the primary purpose is communication control, not resource allocation."
        - "SEC regulations apply to publicly traded companies for material disclosure; single-spokesperson policy applies broadly, not only for SEC compliance."
    difficulty: "medium"
    tags: ["crisis-communications", "incident-response", "spokesperson", "legal"]

  - id: q-d7-101
    domain: domain7
    question: "What is the difference between a 'disaster recovery plan' (DRP) and a 'business continuity plan' (BCP), and which is broader in scope?"
    options:
      - "DRP is broader — it covers all aspects of business recovery; BCP only addresses IT systems"
      - "BCP is broader — it covers how the organization continues business functions during and after a disruption; DRP is a subset focused specifically on IT system and infrastructure recovery"
      - "They are equivalent documents with different names used in different industries"
      - "DRP covers natural disasters; BCP covers cybersecurity incidents"
    correct_answer: 1
    explanations:
      correct: "BCP is the comprehensive framework for maintaining and recovering all business functions during disruptions — including people, processes, facilities, supply chains, and communications. DRP is a technical subset of BCP specifically focused on IT system and infrastructure recovery procedures. A complete BCP incorporates the DRP along with many other plans."
      incorrect:
        - "DRP is narrower, not broader; it is a subset of the larger BCP focused on technical IT recovery."
        - "BCP is broader covering all business functions with DRP as a technical IT subset is correct — this is the correct hierarchical relationship."
        - "BCP and DRP have distinct scopes and purposes; the distinction is well-established in standards (ISO 22301, NIST SP 800-34)."
        - "Both BCP and DRP apply to all types of disruptions — natural disasters, cyber incidents, pandemics, facility failures — not separated by type."
    difficulty: "easy"
    tags: ["BCP", "DRP", "business-continuity", "disaster-recovery"]

  - id: q-d7-102
    domain: domain7
    question: "An organization's SOC analyst notices that a Windows workstation is making DNS queries for randomly generated domain names (e.g., a3f7k9j2.example.com, p9x4q1b8.example.com) at regular 60-second intervals. What does this behavior indicate?"
    options:
      - "Normal Windows Update check-in behavior with Microsoft servers"
      - "Domain Generation Algorithm (DGA) malware communicating with C2 infrastructure using algorithmically generated domains"
      - "The workstation's DHCP client attempting to lease a new IP address"
      - "The user performing automated web research using a browser extension"
    correct_answer: 1
    explanations:
      correct: "Domain Generation Algorithms (DGAs) programmatically generate large numbers of pseudo-random domain names. Malware queries many DGA domains until one resolves — the attacker pre-registers that domain for C2. Regular beacon intervals (60 seconds) combined with random domain name patterns are characteristic of DGA-based malware beaconing. Detection via DNS analytics is more effective than blacklisting individual domains."
      incorrect:
        - "Windows Update uses static Microsoft domains (windowsupdate.com, download.microsoft.com); random domain generation is not characteristic of Windows Update."
        - "DGA malware with regular beacon intervals is correct — this pattern is a well-known indicator of DGA-based C2 communication."
        - "DHCP queries use broadcast or unicast to the DHCP server and do not generate random domain DNS queries."
        - "Browser extensions may generate web traffic but not regular, systematic random domain DNS queries at machine intervals."
    difficulty: "medium"
    tags: ["DGA", "malware", "C2", "DNS-analysis"]
