        - "PCI DSS requires the CDE to be isolated from untrusted networks with firewalls controlling and logging all inter-zone traffic — this is PCI DSS Requirement 1."
        - "Out-of-band management is a security best practice but is not a specific PCI DSS requirement. PCI DSS focuses on controlling access to and from the CDE, not specifically mandating OOB management."
