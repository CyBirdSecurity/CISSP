  - id: q-d4-067
    domain: domain4
    question: "Which OSI model layer does Ethernet (IEEE 802.3) primarily operate at, and what security functions operate at this layer?"
    options:
      - "Layer 1 (Physical) — Ethernet handles signal transmission and cable specifications"
      - "Layer 2 (Data Link) — Ethernet handles MAC addressing, frame delivery, and Layer 2 security functions like port security and 802.1X"
      - "Layer 3 (Network) — Ethernet handles IP routing and Layer 3 packet filtering"
      - "Layer 4 (Transport) — Ethernet handles connection reliability and flow control"
    correct_answer: 1
    explanations:
      correct: "Ethernet (IEEE 802.3) operates at Layer 2 (Data Link) of the OSI model, using MAC addresses for frame delivery within a local network. Layer 2 security functions include: port security (limiting MAC addresses per port), 802.1X (port-based authentication), VLAN segmentation, Dynamic ARP Inspection (DAI), DHCP snooping, and storm control. Layer 2 attacks include MAC flooding, ARP poisoning, and VLAN hopping."
      incorrect:
        - "Layer 1 handles physical signal transmission (voltage levels, cable types, connectors). Ethernet's Layer 1 component (cabling, signaling) exists, but Ethernet as a protocol primarily operates at Layer 2 for addressing and frame delivery."
        - "Ethernet operates at Layer 2 (Data Link), using MAC addressing and providing Layer 2 security functions like port security and 802.1X — this is correct."
        - "IP routing is a Layer 3 function. Ethernet operates at Layer 2 using MAC addresses. IP addresses (Layer 3) are carried within Ethernet frames (Layer 2) but Ethernet itself is Layer 2."
        - "TCP/UDP (Transport Layer) handles connection reliability and flow control. Ethernet provides Layer 2 local delivery using MAC addresses."
    difficulty: "easy"
    tags: ["network-security", "OSI", "Ethernet", "Layer2"]

  - id: q-d4-068
    domain: domain4
    question: "What is 'MPLS VPN' and what security property does it provide that traditional internet-based VPNs do not?"
    options:
      - "MPLS VPNs provide stronger encryption than IPsec VPNs, using proprietary algorithms"
      - "MPLS VPNs use label-switched paths to logically separate customer traffic within a provider network — providing traffic isolation without necessarily encrypting data"
      - "MPLS VPNs eliminate the need for authentication between sites connected to the service"
      - "MPLS VPNs are faster than internet VPNs because they bypass standard IP routing"
    correct_answer: 1
    explanations:
      correct: "MPLS VPNs use label-switched paths to route customer traffic through a service provider's network with logical separation between different customers' traffic. Traffic isolation is achieved through the label forwarding mechanism — different customers' packets follow different label paths and never mix. However, MPLS VPNs do not provide end-to-end encryption by default; the security comes from logical separation (trusted provider environment), not cryptographic protection. For sensitive data, encryption (IPsec) should be layered over MPLS."
      incorrect:
        - "MPLS VPNs do not use proprietary encryption and are not inherently stronger than IPsec. MPLS provides logical separation; encryption is a separate layer that can be added on top."
        - "MPLS VPNs use label-switched paths to logically separate customer traffic within a provider's network — providing isolation without necessarily encrypting data — this correctly describes the MPLS VPN security property."
        - "MPLS VPNs still require customer edge (CE) and provider edge (PE) router authentication for the VPN provisioning. Authentication requirements are not eliminated."
        - "MPLS provides quality of service guarantees and efficient forwarding but operates within the same provider network — performance advantages are QoS-related, not from bypassing IP routing."
    difficulty: "hard"
    tags: ["network-security", "VPN", "MPLS", "WAN"]

  - id: q-d4-069
    domain: domain4
    question: "What is 'network address translation' (NAT) and what limited security benefit does it provide?"
    options:
      - "NAT provides strong security by encrypting all traffic between internal and external networks"
      - "NAT translates private internal IP addresses to public addresses, providing limited security by obscuring internal network structure from external observers"
      - "NAT provides strong authentication of outbound connections preventing unauthorized traffic leaving the network"
      - "NAT replaces the need for firewalls by blocking all unsolicited inbound connections by design"
    correct_answer: 1
    explanations:
      correct: "NAT translates private RFC 1918 IP addresses (10.x.x.x, 192.168.x.x, 172.16-31.x.x) to public IP addresses, conserving public IP space. Its limited security benefit: it obscures the internal network structure from external observers (they see only the public NAT IP, not internal hosts). However, NAT is NOT a security control — it does not prevent attacks, does not authenticate traffic, does not encrypt, and should not be relied upon as a security mechanism. A firewall is required in addition to NAT."
      incorrect:
        - "NAT does not encrypt traffic. The confusion arises because NAT modifies packet headers (IP addresses/port numbers) but this is not encryption. Encryption is a separate security mechanism."
        - "NAT translates private IPs to public addresses, providing limited security through internal network obscurity — but is not a security control and does not replace firewalls."
        - "NAT does not authenticate outbound connections. Traffic leaving the network through NAT is forwarded based on routing and NAT translation tables, not authentication."
        - "While NAPT (PAT) blocks unsolicited inbound connections by default (no NAT table entry means no path back in), this is a side effect of stateful translation, not a designed security feature. A proper stateful firewall provides this function more reliably and configurably."
    difficulty: "medium"
    tags: ["network-security", "NAT", "architecture", "firewalls"]

  - id: q-d4-070
    domain: domain4
    question: "What is the 'Internet of Things' (IoT) security challenge, and which specific risk is MOST commonly exploited by attackers?"
    options:
      - "IoT devices consume excessive bandwidth, creating availability problems for enterprise networks"
      - "Default or hardcoded credentials and lack of patching capability make IoT devices easy entry points for attackers"
      - "IoT devices are too new for malware to have been developed targeting them"
      - "IoT security is managed entirely by device manufacturers, removing enterprise responsibility"
    correct_answer: 1
    explanations:
      correct: "IoT devices present significant security challenges because they commonly ship with default or hardcoded credentials (admin/admin, vendor-specific defaults), have limited or no patch mechanisms, run outdated embedded operating systems, and cannot support endpoint security agents. Botnets like Mirai demonstrated large-scale exploitation of IoT default credentials. Additionally, IoT devices often lack encryption, logging, and security monitoring capabilities."
      incorrect:
        - "While some IoT devices (cameras, NAS devices) consume significant bandwidth, bandwidth consumption is an operational concern. The primary security concern is the attack surface they create as entry points."
        - "Default/hardcoded credentials and lack of patching make IoT devices easy attack targets — this is the most commonly exploited IoT security risk."
        - "Malware targeting IoT (Mirai, BrickerBot, and derivatives) has existed since at least 2016 and has been responsible for some of the largest DDoS attacks ever recorded."
        - "Enterprise organizations have responsibility for managing the security of IoT devices on their networks, including network segmentation, credential management, and traffic monitoring, regardless of manufacturer obligations."
    difficulty: "medium"
    tags: ["network-security", "IoT", "vulnerabilities", "attacks"]

  - id: q-d4-071
    domain: domain4
    question: "What is 'protocol tunneling' as an attack technique, and why is it difficult to detect?"
    options:
      - "Attackers use protocol tunneling to make encrypted traffic appear as legitimate unencrypted traffic"
      - "Attackers encode malicious data or C2 communications inside permitted protocols (like DNS or HTTPS) to bypass network controls that block specific ports or protocols"
      - "Protocol tunneling allows attackers to replay captured network sessions without decryption"
      - "Attackers use tunneling to reduce the size of malware payloads for faster transmission"
    correct_answer: 1
    explanations:
      correct: "Protocol tunneling encodes data or C2 (command-and-control) communications inside permitted protocols. DNS tunneling encodes data in DNS query names/responses (DNS is typically allowed outbound). HTTP/HTTPS tunneling uses web protocols to carry non-web traffic through firewalls. Since firewalls typically allow these protocols, the malicious traffic appears legitimate. Detection requires DPI and behavioral analysis (unusual DNS query patterns, excessive DNS query volume, unexpected HTTP traffic patterns)."
      incorrect:
        - "Making encrypted traffic appear unencrypted would be unusual — attackers generally want their traffic to blend in with legitimate encrypted traffic. Tunneling is about using allowed protocols to carry unauthorized content."
        - "Protocol tunneling encodes malicious data inside permitted protocols (DNS, HTTPS) to bypass network controls — difficult to detect because the carrier protocol is legitimate."
        - "Session replay is a different attack (retransmitting captured authentication tokens). Tunneling is about carrier protocol obfuscation for bypass and covert communication."
        - "Payload compression is an optimization technique. Protocol tunneling focuses on bypassing network controls by using allowed protocols, not on reducing payload size."
    difficulty: "medium"
    tags: ["network-security", "tunneling", "C2", "evasion"]

  - id: q-d4-072
    domain: domain4
    question: "What is 'DHCP snooping' and which attack does it prevent?"
    options:
      - "DHCP snooping monitors DHCP traffic for unusual patterns to detect network reconnaissance"
      - "DHCP snooping creates a binding table of legitimate IP-to-MAC-to-port assignments and blocks rogue DHCP servers from providing malicious IP configuration to clients"
      - "DHCP snooping encrypts DHCP traffic to prevent eavesdropping on IP assignment conversations"
      - "DHCP snooping rate-limits DHCP requests to prevent DHCP starvation attacks"
    correct_answer: 1
    explanations:
      correct: "DHCP snooping is a Layer 2 switch security feature that designates ports as 'trusted' (connected to legitimate DHCP servers) or 'untrusted' (client ports). It blocks DHCP server responses from untrusted ports, preventing rogue DHCP servers. It also builds a DHCP binding table (MAC-to-IP-to-port mapping) that is used by Dynamic ARP Inspection (DAI) to validate ARP traffic. Primary prevention: rogue DHCP server attacks where an attacker provides malicious default gateway or DNS server to clients."
      incorrect:
        - "DHCP traffic monitoring for reconnaissance describes general network monitoring/IDS. DHCP snooping is a specific switch-level control blocking rogue DHCP servers, not general pattern analysis."
        - "DHCP snooping blocks rogue DHCP servers by building a binding table and restricting DHCP responses to trusted ports — this is the correct function and the attack it prevents."
        - "DHCP is typically cleartext. DHCP snooping does not encrypt DHCP traffic — it controls which DHCP responses are forwarded based on trusted/untrusted port designations."
        - "DHCP starvation (MAC flooding DHCP requests to exhaust the IP pool) is a related DoS attack. DHCP snooping can limit rate of requests per port, but its primary purpose is blocking rogue DHCP servers, not rate limiting."
    difficulty: "medium"
    tags: ["network-security", "DHCP", "Layer2", "rogue-DHCP"]

  - id: q-d4-073
    domain: domain4
    question: "What is 'carrier sense multiple access with collision detection' (CSMA/CD) and why is it irrelevant in modern switched Ethernet networks?"
    options:
      - "CSMA/CD remains critical in modern networks for preventing network loops"
      - "CSMA/CD was needed in shared-medium hub networks to manage collisions; switched Ethernet creates dedicated full-duplex links where collisions cannot occur"
      - "CSMA/CD is used in modern Wi-Fi networks (802.11) to manage channel access"
      - "CSMA/CD was replaced by token ring protocols in enterprise networks"
    correct_answer: 1
    explanations:
      correct: "CSMA/CD was the contention management protocol for shared bus/hub Ethernet where all hosts shared the same collision domain. When two hosts transmitted simultaneously, a collision occurred; CSMA/CD detected it and initiated backoff/retransmission. Modern switched Ethernet creates dedicated point-to-point full-duplex connections between each host and the switch — collisions are physically impossible. Switches eliminate collision domains, making CSMA/CD irrelevant for switched wired Ethernet."
      incorrect:
        - "Network loops are prevented by Spanning Tree Protocol (STP), not CSMA/CD. Loop prevention is a Layer 2 topology control, unrelated to CSMA/CD collision management."
        - "CSMA/CD was for shared-medium hub networks; switched Ethernet's dedicated full-duplex links eliminate collisions entirely, making CSMA/CD irrelevant — this is the correct explanation."
        - "Wi-Fi uses CSMA/CA (Carrier Sense Multiple Access with Collision Avoidance) — the 'A' is Avoidance, not Detection. Wireless cannot detect collisions (they happen at the destination), so it uses avoidance techniques instead."
        - "Token Ring used a token-passing protocol for access control — a completely different LAN technology that competed with Ethernet historically. CSMA/CD was not 'replaced' by Token Ring."
    difficulty: "medium"
    tags: ["network-security", "Ethernet", "Layer2", "protocols"]

  - id: q-d4-074
    domain: domain4
    question: "A network engineer wants to implement 'port mirroring' on a core switch. What is the primary security use case for port mirroring?"
    options:
      - "Doubling network ports' bandwidth by mirroring traffic across two physical connections"
      - "Sending copies of traffic from monitored ports/VLANs to an IDS/IPS or network analysis tool without interrupting traffic flow"
      - "Creating redundant network paths to maintain connectivity if a primary port fails"
      - "Enforcing network access control by copying traffic to a NAC quarantine VLAN"
    correct_answer: 1
    explanations:
      correct: "Port mirroring (also called SPAN — Switch Port Analyzer) copies network traffic from specified source ports or VLANs to a destination port connected to a monitoring tool (IDS, IPS, network performance monitor, packet capture). This enables passive, non-intrusive traffic analysis without being in the network path. Security teams use port mirroring to feed IDS/IPS systems and forensic capture tools without impacting production traffic."
      incorrect:
        - "Port mirroring creates a copy of traffic for monitoring — it does not increase the bandwidth of the mirrored ports. Link aggregation (LACP) is the technique for combining bandwidth."
        - "Port mirroring sends traffic copies to monitoring tools (IDS/IPS, packet capture) without interrupting production traffic flow — this is the primary security use case."
        - "Redundant network paths are created by STP, LACP, or ECMP routing — not port mirroring. Mirroring copies traffic; it does not create redundant paths."
        - "NAC quarantine uses VLAN assignment to restrict non-compliant devices. Port mirroring is for passive traffic analysis and monitoring, not access enforcement."
    difficulty: "medium"
    tags: ["network-security", "monitoring", "IDS", "SPAN"]

  - id: q-d4-075
    domain: domain4
    question: "What is the purpose of 'ingress filtering' (BCP38) at internet service provider networks?"
    options:
      - "Filtering malicious content from inbound web traffic at the ISP level"
      - "Dropping packets that have source IP addresses that are clearly spoofed or do not match the IP range allocated to the customer"
      - "Inspecting all inbound traffic from the internet for known malware signatures"
      - "Rate-limiting inbound traffic from specific countries to prevent DDoS attacks"
    correct_answer: 1
    explanations:
      correct: "BCP38 (Best Current Practice 38, RFC 2827) specifies ingress filtering — ISPs should drop packets from their customers whose source IP addresses fall outside the IP ranges allocated to that customer. This prevents customers from sending packets with spoofed source IPs (used in reflection/amplification DDoS and IP spoofing attacks). Wide BCP38 deployment would significantly reduce the effectiveness of spoofing-based attacks."
      incorrect:
        - "Content filtering (blocking malicious web content) is a different control from ingress filtering. BCP38 is specifically about source IP address validation, not content inspection."
        - "BCP38 ingress filtering drops packets with source IPs not belonging to the customer's allocated IP range — preventing IP address spoofing attacks."
        - "Malware signature inspection is performed by DPI or security gateways. BCP38 ingress filtering is specifically about source IP address validity, not content inspection."
        - "Geographic rate-limiting is a DDoS mitigation technique. BCP38 is specifically about validating source IP addresses match the customer's allocated IP range — not geographic restrictions."
    difficulty: "hard"
    tags: ["network-security", "BCP38", "ingress-filtering", "spoofing"]

  - id: q-d4-076
    domain: domain4
    question: "What is the primary difference between 'active' and 'passive' network reconnaissance?"
    options:
      - "Active reconnaissance uses automated tools; passive reconnaissance is performed manually"
      - "Active reconnaissance involves direct interaction with target systems (scanning, probing); passive reconnaissance gathers information without touching target systems"
      - "Active reconnaissance is authorized; passive reconnaissance is unauthorized by definition"
      - "Active reconnaissance targets network devices; passive reconnaissance targets endpoints"
    correct_answer: 1
    explanations:
      correct: "Active reconnaissance involves directly probing or scanning target systems — activities like port scanning (nmap), ping sweeps, vulnerability scanning, and banner grabbing generate traffic that reaches the target and may be detected and logged. Passive reconnaissance gathers information without directly interacting with the target — using OSINT (public DNS records, WHOIS, social media, job postings, shodan.io, certificate transparency logs). Passive recon is harder to detect."
      incorrect:
        - "Both active and passive reconnaissance can use automated tools. The distinction is whether the technique generates traffic that reaches and interacts with the target system."
        - "Active reconnaissance directly probes target systems; passive reconnaissance gathers information without touching the target — this is the correct distinction."
        - "Both can be authorized (penetration testing) or unauthorized (attack reconnaissance). The distinction is the interaction method, not authorization status."
        - "Both types of reconnaissance can target any system type. The distinction is interaction (active touches the target; passive does not)."
    difficulty: "easy"
    tags: ["network-security", "reconnaissance", "penetration-testing"]

  - id: q-d4-077
    domain: domain4
    question: "What is 'link-layer security' (MACsec, IEEE 802.1AE) and when is it preferred over transport-layer encryption?"
    options:
      - "MACsec encrypts only IP traffic; preferred when UDP performance is critical"
      - "MACsec encrypts all traffic on a network link at Layer 2, including non-IP protocols, protecting against physical layer tapping between switches"
      - "MACsec is a wireless security protocol that replaces WPA3 in enterprise environments"
      - "MACsec provides application-layer encryption preferred when end-to-end security is required"
    correct_answer: 1
    explanations:
      correct: "MACsec (IEEE 802.1AE) provides hop-by-hop encryption at Layer 2 (Ethernet frame level), protecting all traffic on a physical link segment between devices. Unlike TLS (which protects specific application sessions), MACsec encrypts everything on the link — including non-IP protocols, Layer 2 control traffic, and protocols that don't natively support encryption. It is preferred when protecting physical links between data center switches where traffic might be intercepted by physical layer tapping."
      incorrect:
        - "MACsec encrypts all Layer 2 traffic including non-IP protocols — not just IP traffic. It operates at the Ethernet frame level, before IP layer processing."
        - "MACsec encrypts all Layer 2 traffic on a network link, including non-IP protocols, protecting against physical tapping between network devices — this correctly describes MACsec's function and use case."
        - "MACsec (802.1AE) is a wired Ethernet security standard. WPA3 is wireless security (802.11). They are separate standards for different link types."
        - "MACsec is Layer 2 (hop-by-hop between directly connected devices). End-to-end application security is provided by TLS/application encryption. MACsec protects the physical link, not the end-to-end application session."
    difficulty: "hard"
    tags: ["network-security", "MACsec", "Layer2", "encryption"]

  - id: q-d4-078
    domain: domain4
    question: "What is an 'amplification DDoS attack' and which protocol is most commonly exploited for amplification?"
    options:
      - "An amplification attack multiplies the attacker's bandwidth by adding more attack sources; primarily uses TCP"
      - "An amplification attack sends small requests to servers that respond with much larger responses, directing those responses at a victim with a spoofed source IP; UDP-based protocols like DNS, NTP, and SSDP are most commonly exploited"
      - "An amplification attack increases the impact of malware by installing multiple copies; targets endpoint security software"
      - "An amplification attack uses reflected traffic to confuse intrusion detection systems"
    correct_answer: 1
    explanations:
      correct: "An amplification (reflection/amplification) DDoS attack exploits UDP-based protocols with a high response-to-request size ratio. The attacker sends small requests to open resolvers/servers with the victim's IP as the spoofed source address. The servers send much larger responses to the victim, amplifying traffic. DNS amplification (50x), NTP monlist amplification (700x+), and SSDP amplification (30x) are common examples. TCP is less useful because the SYN-ACK handshake prevents source spoofing for establishing connections."
      incorrect:
        - "Adding attack sources describes a botnet-based volumetric DDoS — not amplification. Amplification uses reflection from legitimate servers to multiply traffic without needing more attack sources."
        - "Amplification attacks exploit UDP servers that produce large responses to small requests, directing amplified traffic at a victim using source IP spoofing — DNS, NTP, and SSDP are most commonly exploited."
        - "Malware amplification is not a recognized network attack term. DDoS amplification is specifically about exploiting UDP protocol response ratios."
        - "Confusing IDS systems describes evasion techniques. Amplification attacks focus on overwhelming the victim's bandwidth with high-volume reflected traffic, not IDS evasion."
    difficulty: "medium"
    tags: ["network-security", "DDoS", "amplification", "UDP"]

  - id: q-d4-079
    domain: domain4
    question: "What is 'network segmentation' and what specific security benefit does it provide during an incident?"
    options:
      - "Network segmentation improves network performance by separating broadcast traffic"
      - "Network segmentation limits the blast radius of a compromise by containing lateral movement — an attacker who breaches one segment cannot freely traverse to other segments"
      - "Network segmentation provides redundant network paths to improve availability"
      - "Network segmentation enables more granular user authentication at different network zones"
    correct_answer: 1
    explanations:
      correct: "Network segmentation divides the network into separate zones (using VLANs, subnets, firewalls) with controlled access between them. During an incident, segmentation limits lateral movement — an attacker who compromises a workstation in the employee segment cannot directly reach PCI cardholder data systems in the payment segment or critical infrastructure in the OT segment. This containment limits the blast radius and reduces the scope and cost of incident response."
      incorrect:
        - "Reducing broadcast traffic is a performance benefit of network segmentation (VLANs). The security benefit — particularly during incidents — is lateral movement containment, not performance."
        - "Network segmentation limits lateral movement blast radius during incidents — an attacker in one segment cannot freely traverse to other segments."
        - "Redundant network paths are provided by routing protocols, STP, LACP, and dual-homed connections. Segmentation addresses security zones, not path redundancy."
        - "Authentication at network boundaries is a control that can be applied to segmented networks (802.1X, firewall authentication). Segmentation itself is the network division; authentication is a control applied within that architecture."
    difficulty: "medium"
    tags: ["network-security", "segmentation", "incident-response", "containment"]

  - id: q-d4-080
    domain: domain4
    question: "Which of the following BEST describes a 'cloud access security broker' (CASB)'s 'reverse proxy' deployment mode?"
    options:
      - "The CASB sits between the internet and the organization's cloud services, inspecting all traffic"
      - "The CASB sits between users and cloud services, inspecting and controlling traffic for managed devices without requiring endpoint agents"
      - "The CASB redirects cloud service traffic through an on-premises security gateway for inspection"
      - "The CASB uses API integration with cloud providers to audit and enforce policies without sitting in the traffic path"
    correct_answer: 1
    explanations:
      correct: "In reverse proxy mode, the CASB sits between users and the cloud service (traffic flows through the CASB). Users' cloud service traffic is routed through the CASB for inspection, DLP, and policy enforcement. This deployment works for managed and unmanaged devices without requiring endpoint software. The CASB typically works by redirecting cloud service URLs through its infrastructure."
      incorrect:
        - "The described scenario would be a forward proxy or gateway deployment. Reverse proxy specifically positions the CASB between users and cloud services, inspecting outbound access."
        - "Reverse proxy mode positions the CASB between users and cloud services, inspecting and controlling traffic for managed devices — without requiring endpoint agents in this deployment mode."
        - "Redirecting through on-premises gateways describes a forward proxy or PAC file deployment approach. Reverse proxy mode positions the CASB inline in the cloud service traffic path."
        - "API integration mode (not reverse proxy) uses cloud provider APIs to audit logs and enforce policies without sitting in the traffic path. Reverse proxy is specifically an inline traffic inspection mode."
    difficulty: "hard"
    tags: ["network-security", "CASB", "cloud", "proxy"]

  - id: q-d4-081
    domain: domain4
    question: "What is 'implicit deny' as a firewall rule design principle?"
    options:
      - "Specific traffic types are implicitly permitted without requiring explicit allow rules"
      - "At the end of every firewall rule set, a default deny rule blocks all traffic not explicitly permitted by earlier rules"
      - "Implicit deny allows all outbound traffic while blocking inbound traffic by default"
      - "Firewall rules must explicitly deny each blocked traffic type — implicit denial is insufficient"
    correct_answer: 1
    explanations:
      correct: "Implicit deny (deny-all-unless-explicitly-permitted or 'default deny') is the most fundamental firewall design principle: at the end of the rule set, a catch-all rule denies all traffic not explicitly permitted. This ensures that new protocols, ports, or traffic types are blocked by default — they only become accessible when explicitly authorized. Security fails open if only explicit deny rules exist (anything not specifically blocked is permitted)."
      incorrect:
        - "Implicit permit (allow all by default unless explicitly blocked) is the opposite and insecure approach. Implicit deny is the security-default: block all unless explicitly allowed."
        - "Implicit deny means the final rule blocks all traffic not explicitly permitted — new traffic types are denied by default until explicitly allowed."
        - "Blocking only inbound traffic while allowing all outbound is an overly permissive firewall design. Implicit deny applies to both directions — outbound rules should also be explicit."
        - "Implicit deny is more secure than explicit blocking because it handles unknown/new traffic types. Explicit deny lists (blacklisting) miss any traffic type not specifically named."
    difficulty: "easy"
    tags: ["network-security", "firewalls", "principles", "access-control"]

  - id: q-d4-082
    domain: domain4
    question: "What is the security risk of using 'HTTP' instead of 'HTTPS' for internal web applications?"
    options:
      - "HTTP is not supported by modern browsers, causing compatibility issues for users"
      - "HTTP transmits all data in clear text, enabling eavesdropping and MITM attacks by anyone on the same network path"
      - "HTTP cannot support authenticated sessions, making internal applications less functional"
      - "HTTP is blocked by most enterprise firewalls, preventing internal application access"
    correct_answer: 1
    explanations:
      correct: "HTTP transmits all data, including usernames, passwords, session cookies, and sensitive application data, in plaintext. Anyone on the same network segment (or with access to network infrastructure along the path) can capture and read this traffic using simple packet capture tools. Internal networks are not inherently trusted — insider threats, compromised workstations, and rogue devices can all perform passive eavesdropping. HTTPS with TLS should be used for all web applications, including internal ones."
      incorrect:
        - "Modern browsers support HTTP and HTTPS. Browsers increasingly warn about HTTP sites and may block some capabilities (geolocation, camera access require HTTPS), but HTTP itself is not technically blocked."
        - "HTTP transmits all data in cleartext, enabling eavesdropping and MITM attacks by anyone on the same network path — this is the primary security risk."
        - "HTTP can support authenticated sessions (via cookies or headers) — the risk is that those session tokens are transmitted in clear text and can be stolen. HTTP does not technically prevent sessions."
        - "Enterprise firewalls typically allow HTTP (port 80) as well as HTTPS (port 443). HTTP is not blocked by default in most internal networks."
    difficulty: "easy"
    tags: ["network-security", "HTTPS", "encryption", "web"]

  - id: q-d4-083
    domain: domain4
    question: "What is 'DNS poisoning' (DNS cache poisoning) and which DNSSEC mechanism is designed to prevent it?"
    options:
      - "DNS poisoning floods DNS servers with requests to exhaust resources; DNSSEC rate limiting prevents it"
      - "DNS poisoning injects fraudulent records into DNS resolver caches redirecting users to malicious sites; DNSSEC's digital signatures on DNS records allow resolvers to verify record authenticity"
      - "DNS poisoning modifies DNS zone files on authoritative servers; DNSSEC encrypts zone transfers"
      - "DNS poisoning intercepts DNS queries and replaces responses with malicious IPs; prevented by DNS over TLS"
    correct_answer: 1
    explanations:
      correct: "DNS cache poisoning (Kaminsky attack) injects fraudulent DNS records into recursive resolver caches. Users querying the poisoned resolver receive false IP addresses and are redirected to attacker-controlled sites. DNSSEC (DNS Security Extensions) adds digital signatures to DNS records — resolvers can cryptographically verify that records came from the authorized zone and were not tampered with, detecting poisoned records."
      incorrect:
        - "Resource exhaustion from DNS flooding is a DoS attack, not DNS poisoning. DNSSEC addresses record authenticity, not DoS attacks."
        - "DNS poisoning injects fraudulent records into resolver caches; DNSSEC's digital signatures allow resolvers to verify record authenticity and detect tampered records — this is correct."
        - "DNS zone file modification on authoritative servers is a server compromise — a different attack requiring compromise of the authoritative server infrastructure. DNSSEC zone transfers can be secured with TSIG, but that's different from DNSSEC record signing."
        - "DNS over TLS/HTTPS (DoT/DoH) encrypts the transport, preventing eavesdropping on queries. They do not address cache poisoning (fraudulent records). DNSSEC addresses record authenticity at the protocol level."
    difficulty: "medium"
    tags: ["network-security", "DNS", "DNSSEC", "attacks"]

  - id: q-d4-084
    domain: domain4
    question: "What is a 'network proxy' server and what primary security function does it provide?"
    options:
      - "A proxy server provides load balancing across multiple servers to prevent performance bottlenecks"
      - "A proxy server acts as an intermediary for client requests, providing content filtering, access control, caching, and the ability to inspect and log traffic"
      - "A proxy server encrypts all client communications using TLS, replacing the need for VPNs"
      - "A proxy server provides DNS resolution services with enhanced security features"
    correct_answer: 1
    explanations:
      correct: "A forward proxy server sits between internal clients and external services. Security functions include: URL and content filtering (blocking malicious or non-business sites), access control (restricting which sites/protocols users can access), SSL/TLS inspection (decrypting HTTPS for content inspection), traffic logging (audit trail of web activity), and caching (reducing bandwidth). It provides a centralized control point for outbound web traffic."
      incorrect:
        - "Load balancing is provided by reverse proxies and load balancers for distributing traffic across servers — not a primary security function of forward proxies."
        - "A proxy server provides content filtering, access control, traffic inspection, and logging — acting as an intermediary for client requests — this is the primary security function."
        - "VPNs provide remote access over encrypted tunnels. Proxies may use TLS for specific connections but are not tunnel-based encrypted access solutions equivalent to VPNs."
        - "DNS resolution with enhanced security features describes DNS servers with DNSSEC, DoH, or security filtering. A proxy server operates at the HTTP/HTTPS application layer."
    difficulty: "easy"
    tags: ["network-security", "proxy", "web-filtering", "access-control"]

  - id: q-d4-085
    domain: domain4
    question: "What is 'convergence time' in the context of routing protocols and why does it have security implications?"
    options:
      - "The time it takes to establish an encrypted tunnel between network devices"
      - "The time routing protocols take to propagate and agree on updated network topology after a change; during convergence, traffic may be dropped or misrouted, potentially being exploited for DoS"
      - "The time required for firewall rule updates to propagate to all network enforcement points"
      - "The delay between when a security event occurs and when monitoring tools detect it"
    correct_answer: 1
    explanations:
      correct: "Routing protocol convergence is the process where all routers in a network learn about a topology change (link failure, new route, BGP withdrawal) and update their routing tables to reflect the current state. During convergence, traffic may be dropped (black-holed), incorrectly routed, or delayed. Attackers can exploit slow convergence by triggering route flapping to cause extended outages or by manipulating convergence to create routing black holes."
      incorrect:
        - "Encrypted tunnel establishment (IKE in IPsec) is a separate concept from routing convergence. Convergence is specifically about routing protocol state synchronization."
        - "Convergence time is the time for routing protocols to agree on updated topology; during convergence, traffic may be dropped or misrouted — exploitable for DoS attacks."
        - "Firewall rule propagation time is a security policy implementation delay — a different operational concept from routing protocol convergence."
        - "Detection latency (mean time to detect) is a security monitoring metric. Convergence time is specifically about routing protocol synchronization after topology changes."
    difficulty: "hard"
    tags: ["network-security", "routing", "availability", "protocols"]

  - id: q-d4-086
    domain: domain4
    question: "What is the primary security advantage of 'SSL/TLS inspection' (HTTPS inspection) in enterprise security gateways, and what privacy concern does it raise?"
    options:
      - "TLS inspection improves connection speed; privacy concern is increased server load"
      - "TLS inspection decrypts HTTPS traffic for content inspection (malware, DLP), but requires performing a MITM on users' encrypted sessions, raising privacy concerns"
      - "TLS inspection validates server certificates; privacy concern is storing certificate details"
      - "TLS inspection blocks all non-HTTPS traffic; privacy concern is logging unencrypted data"
    correct_answer: 1
    explanations:
      correct: "TLS/SSL inspection involves the security gateway decrypting HTTPS traffic (acting as a MITM — presenting a trusted enterprise CA certificate to the client), inspecting the content (scanning for malware, applying DLP policies, blocking unauthorized content), and re-encrypting before forwarding. Security benefit: visibility into encrypted traffic that might carry malware or data exfiltration. Privacy concern: the enterprise gateway can read all HTTPS content including personal traffic, banking, healthcare — raising employee privacy and legal concerns."
      incorrect:
        - "TLS inspection adds latency (decrypt, inspect, re-encrypt) — it reduces, not improves, connection speed. The trade-off is security visibility vs. performance and privacy."
        - "TLS inspection decrypts HTTPS traffic for content inspection by performing a MITM — providing security visibility while raising legitimate privacy concerns about reading users' encrypted traffic."
        - "Certificate validation (checking server certificates are valid and trusted) is a standard TLS client function — not TLS inspection. Inspection involves actively decrypting the payload content."
        - "TLS inspection doesn't block non-HTTPS traffic — it specifically inspects HTTPS. Unencrypted HTTP traffic is already visible to network monitoring without interception."
    difficulty: "medium"
    tags: ["network-security", "TLS-inspection", "privacy", "MITM"]

  - id: q-d4-087
    domain: domain4
    question: "What is 'VLAN hopping' and which two methods are used to execute it?"
    options:
      - "VLAN hopping involves using VLAN ID 4095 to access all VLANs simultaneously"
      - "VLAN hopping attacks cross VLAN boundaries using switch spoofing (impersonating a trunk port) or double tagging (exploiting native VLAN handling)"
      - "VLAN hopping exploits misconfigured STP to gain root bridge status and intercept all traffic"
      - "VLAN hopping uses SNMP to modify VLAN tables on managed switches"
    correct_answer: 1
    explanations:
      correct: "VLAN hopping allows an attacker to send traffic to VLANs they are not authorized to access. Two methods: (1) Switch spoofing — the attacker's device negotiates a trunk port using DTP (Dynamic Trunking Protocol), gaining access to all VLANs on the trunk; (2) Double tagging — the attacker sends frames with two 802.1Q VLAN tags, exploiting the native VLAN stripping behavior so the inner tag survives to the target VLAN. Mitigations: disable DTP, disable native VLAN on trunks, use dedicated native VLANs not used for data."
      incorrect:
        - "VLAN ID 4095 is not used for simultaneous access to all VLANs. VLAN IDs 1-4094 are valid; 4095 is reserved. This does not describe a valid attack method."
        - "VLAN hopping uses switch spoofing (DTP trunk negotiation) or double tagging (inner/outer 802.1Q tag exploitation) to cross VLAN boundaries — these are the two actual attack methods."
        - "STP root bridge attacks affect network topology and can enable traffic interception through different means. VLAN hopping specifically exploits the VLAN tagging and trunk negotiation mechanisms."
        - "SNMP VLAN table modification would require SNMP write access credentials — it's a configuration attack, not the VLAN hopping technique. VLAN hopping exploits DTP and 802.1Q tagging."
    difficulty: "hard"
    tags: ["network-security", "VLAN", "Layer2", "attacks"]

