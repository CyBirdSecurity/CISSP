  - id: q-d4-092
    domain: domain4
    question: "What is 'SD-WAN' (Software-Defined Wide Area Network) and what security consideration must be addressed in its deployment?"
    options:
      - "SD-WAN uses satellite links for WAN connectivity; security concern is signal interception"
      - "SD-WAN uses software to abstract and orchestrate multiple WAN links; security concern is that internet-based connections require encryption and the centralized controller is a high-value attack target"
      - "SD-WAN eliminates the need for firewalls at branch sites by centralizing security in the cloud"
      - "SD-WAN is a VPN technology that automatically encrypts all traffic between branches"
    correct_answer: 1
    explanations:
      correct: "SD-WAN abstracts multiple WAN connections (MPLS, broadband internet, 4G/5G) and orchestrates traffic across them programmatically. Security considerations: (1) Internet-based WAN paths require encryption (IPsec) because internet traffic can be intercepted; (2) The SD-WAN controller is a centralized management target — its compromise could affect all WAN connections; (3) Branch sites connected via internet paths lack the implicit isolation of dedicated MPLS circuits."
      incorrect:
        - "SD-WAN uses various WAN technologies (broadband, MPLS, cellular) — not specifically satellite. The primary security concern is the use of untrusted internet paths and controller security, not signal interception."
