  - id: q-d4-089
    domain: domain4
    question: "What does 'confidentiality of transmission' specifically require when sending sensitive data between data centers over a leased line from a telecommunications provider?"
    options:
      - "A leased line provides inherent confidentiality because it is a dedicated physical circuit"
      - "Data encryption using protocols like IPsec or MACsec is required because physical infrastructure remains subject to interception and provider staff access"
      - "Confidentiality is ensured by MPLS traffic isolation, which is equivalent to encryption"
      - "Leased lines only require authentication controls; confidentiality is not applicable"
    correct_answer: 1
    explanations:
      correct: "While leased lines provide physical separation from shared internet traffic, they do not provide cryptographic confidentiality. Physical lines can be tapped, provider staff have access to the infrastructure, and traffic can be intercepted at provider switching equipment. For truly sensitive data, end-to-end encryption (IPsec VPN, MACsec) must be implemented over the leased line — the physical circuit is a starting point but not sufficient confidentiality protection."
      incorrect:
        - "Physical circuit dedication provides privacy from other customers' traffic but not confidentiality — the provider's staff and infrastructure can still access the traffic. Physical separation ≠ cryptographic confidentiality."
        - "Data encryption (IPsec or MACsec) is required even over leased lines because physical infrastructure remains accessible to provider staff and potentially subject to interception."
        - "MPLS provides logical traffic isolation (separate label paths) but is not equivalent to encryption. Provider staff and network equipment can still access MPLS-forwarded traffic."
        - "Authentication controls verify identity but do not protect data from interception during transmission. Both authentication and encryption are required for confidentiality over communications links."
    difficulty: "medium"
    tags: ["network-security", "encryption", "WAN", "confidentiality"]

  - id: q-d4-090
    domain: domain4
    question: "What is 'GRE tunneling' and what security limitation makes it inadequate for sensitive data transmission alone?"
    options:
      - "GRE tunneling provides strong encryption but lacks authentication capabilities"
      - "GRE tunneling encapsulates packets to enable routing between different network types but provides no encryption or authentication"
      - "GRE tunneling is insecure because it uses UDP which is connectionless and easily spoofed"
      - "GRE tunneling only supports IPv4 and cannot protect IPv6 traffic in modern networks"
    correct_answer: 1
    explanations:
      correct: "Generic Routing Encapsulation (GRE) is a tunneling protocol that encapsulates packets from one protocol inside another for routing purposes (e.g., routing multicast or non-IP protocols over IP networks). GRE provides no security — it offers no encryption and no authentication. Traffic inside GRE tunnels is transmitted in cleartext and can be captured and read. For security, GRE is commonly combined with IPsec (GRE over IPsec) which adds encryption and authentication."
      incorrect:
        - "GRE does not provide encryption. It is a pure encapsulation protocol with no cryptographic security properties. The statement that it provides 'strong encryption' is incorrect."
        - "GRE encapsulates packets for routing across different network types but provides no encryption or authentication — this correctly identifies its security limitation."
        - "GRE runs over IP (Protocol 47), not UDP. The security limitation is the complete absence of encryption and authentication, not protocol choice."
        - "GRE supports both IPv4 and IPv6 traffic encapsulation. The limitation is the absence of security, not IPv6 support."
    difficulty: "medium"
    tags: ["network-security", "tunneling", "GRE", "VPN"]

