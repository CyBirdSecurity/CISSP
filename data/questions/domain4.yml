    tags: ["network-security", "SDN", "architecture", "centralization"]

  - id: q-d4-061
    domain: domain4
    question: "An attacker intercepts a TLS session by presenting a fraudulent certificate to the client while establishing a separate legitimate TLS session with the server. What attack has occurred and what prevents it?"
    options:
      - "A session replay attack; prevented by TLS session tickets"
      - "A TLS MITM attack using a fraudulent certificate; prevented by certificate pinning, HSTS, or user certificate validation"
      - "A downgrade attack forcing TLS 1.0; prevented by disabling legacy TLS versions"
      - "A padding oracle attack on TLS CBC mode; prevented by using AES-GCM"
    correct_answer: 1
    explanations:
      correct: "This is a TLS Man-in-the-Middle attack using a fraudulent certificate. The attacker presents a fake certificate to the client (obtaining trust through a compromised/rogue CA or by tricking the user to accept it) while establishing a legitimate TLS session with the real server. Defenses: certificate pinning (client refuses certificates not matching expected fingerprint), HSTS preloading (browser-enforced HTTPS), and Certificate Transparency logs (detect fraudulent certificate issuance)."
      incorrect:
        - "Session replay uses a captured valid session — not an active MITM with fraudulent certificates. Session tickets address resumption security, not certificate fraud attacks."
        - "TLS MITM using a fraudulent certificate is the attack; certificate pinning, HSTS, and user certificate validation are defenses — this is the correct identification and prevention."
        - "A downgrade attack forces less secure protocol versions. Presenting a fraudulent certificate is a different attack vector — it's not about protocol version negotiation."
        - "Padding oracle attacks exploit CBC mode decryption oracle vulnerabilities. The described scenario is certificate-based MITM, not a cryptographic padding attack."
    difficulty: "medium"
    tags: ["TLS", "MITM", "certificates", "attacks"]

  - id: q-d4-062
    domain: domain4
    question: "What is 'network topology discovery' and why is it a security concern when performed without authorization?"
    options:
