  - id: q-d4-052
    domain: domain4
    question: "Network Access Control (NAC) performs a posture check on a connecting device and finds it is running an outdated OS without the latest patches. What is the appropriate NAC response?"
    options:
      - "Allow full network access — patching is the user's responsibility"
      - "Quarantine the device to a remediation VLAN with limited access until it meets compliance requirements"
      - "Permanently ban the device's MAC address from the network"
      - "Send an email to the user asking them to patch their device"
    correct_answer: 1
    explanations:
      correct: "NAC quarantine places non-compliant devices in a restricted VLAN with access only to remediation resources (Windows Update, patch servers, helpdesk). The device cannot access production resources until it meets the compliance policy. Once remediated and re-assessed, the device is granted appropriate access. This enforces security posture without permanently blocking users."
      incorrect:
        - "Allowing full access to unpatched devices defeats the purpose of NAC — unpatched devices can be exploited and spread malware to other network resources."
        - "Quarantine to a remediation VLAN until compliance requirements are met is the appropriate NAC response."
        - "Permanent MAC ban is overly punitive for a patching issue — devices should be remediated and allowed back. MAC addresses can also be spoofed."
        - "Email notification alone does not enforce compliance — the device still has full network access during the time the user decides to patch."
    difficulty: "medium"
    tags: ["networking", "NAC", "access-control"]

  - id: q-d4-053
    domain: domain4
    question: "What is the primary purpose of 'out-of-band management' for network devices?"
    options:
      - "Providing faster bandwidth for critical management traffic on production networks"
      - "Separating management traffic onto a dedicated network that remains accessible even if the production network is compromised or down"
      - "Encrypting all management traffic using separate encryption keys from production traffic"
      - "Routing management traffic through a DMZ for security monitoring purposes"
    correct_answer: 1
    explanations:
      correct: "Out-of-band (OOB) management uses a physically separate network infrastructure (dedicated management interfaces, console servers, serial connections) for device administration. Benefits: (1) Management remains accessible even when the production network is down (needed for recovery), (2) Compromise of the production network does not automatically give attackers access to management functions, (3) Management traffic is isolated from capture and analysis by users of the production network."
      incorrect:
        - "OOB management does not provide faster bandwidth — it may use slower connections (serial, dedicated Ethernet). The purpose is isolation and availability, not performance."
        - "OOB management separates management traffic onto a dedicated network that remains accessible even if the production network is compromised or unavailable — this is the primary purpose."
        - "Encryption of management traffic (SSH, HTTPS) is important but is a separate control. OOB management refers to physical network separation, not encryption key separation."
        - "Routing management through a DMZ still uses the production network infrastructure. True OOB management uses a completely separate physical network path."
    difficulty: "medium"
    tags: ["network-security", "management", "OOB", "architecture"]

  - id: q-d4-054
    domain: domain4
    question: "What is 'BGP route hijacking' and why is it difficult to prevent?"
    options:
      - "An attacker modifying routing tables on a local enterprise router to redirect internal traffic"
      - "An AS announcing prefixes it does not legitimately own, redirecting internet traffic through attacker-controlled infrastructure; difficult because BGP relies on trust between ASes with no cryptographic verification by default"
      - "An ISP intentionally throttling BGP routes to competitors to reduce their bandwidth"
      - "A misconfiguration in BGP causing routing loops that make internet destinations unreachable"
    correct_answer: 1
    explanations:
      correct: "BGP hijacking occurs when an Autonomous System (AS) fraudulently announces IP prefixes it does not own. Other ASes accept these announcements because BGP relies on trust between peering partners — there is no cryptographic verification that an AS is authorized to announce specific prefixes. This can redirect traffic through attacker infrastructure (enabling interception, MITM, or blackholing). RPKI (Resource Public Key Infrastructure) with Route Origin Validation is a partial mitigation."
      incorrect:
        - "Local router table modification is a different attack (IP spoofing or local routing attack). BGP hijacking is an internet-scale attack affecting routing between Autonomous Systems globally."
        - "BGP hijacking involves an AS announcing prefixes it doesn't own, redirecting traffic; it's difficult because BGP has no cryptographic verification by default — this is the correct description."
        - "ISP throttling is a commercial practice (net neutrality issue). BGP hijacking is a security attack involving fraudulent route announcements, not intentional throttling."
        - "Routing loops are configuration errors or BGP path problems. Hijacking is an intentional attack involving fraudulent origin announcements to redirect traffic."
    difficulty: "hard"
    tags: ["network-security", "BGP", "routing", "internet"]

  - id: q-d4-055
    domain: domain4
    question: "What is 'deep packet inspection' (DPI) and how does it differ from standard packet filtering?"
    options:
      - "DPI inspects packet headers and IP addresses; standard filtering inspects payload content"
      - "DPI inspects the full packet payload including application-layer content; standard packet filtering only examines headers (IP, TCP/UDP)"
      - "DPI decrypts all traffic before inspection; standard packet filtering only works on unencrypted traffic"
      - "DPI operates at OSI Layer 2; standard packet filtering operates at Layer 7"
    correct_answer: 1
    explanations:
      correct: "Standard (stateless/stateful) packet filtering examines packet headers — source/destination IP, port numbers, TCP flags, connection state. Deep Packet Inspection (DPI) examines the actual payload content of packets, including application-layer data, for content inspection, intrusion detection, malware scanning, and application identification. DPI enables next-generation firewall capabilities like application identification and URL filtering."
      incorrect:
        - "This is reversed. DPI inspects packet payload and application content; standard filtering inspects headers. Payload inspection is the defining characteristic of DPI."
        - "DPI inspects the full packet payload including application-layer content; standard packet filtering only examines headers — this correctly describes the fundamental difference."
        - "DPI can inspect unencrypted traffic; encrypted traffic (TLS) requires TLS inspection (HTTPS inspection) with certificate interception to decrypt before DPI. Not all DPI systems decrypt traffic."
        - "This is reversed. DPI operates at the application layer (Layer 7); basic packet filtering typically operates at Layers 3-4. DPI requires analyzing higher-layer content."
    difficulty: "medium"
    tags: ["network-security", "DPI", "firewalls", "inspection"]

  - id: q-d4-056
    domain: domain4
    question: "A security engineer wants to prevent an attacker who has compromised a workstation from pivoting to other systems on the same network segment. Which control is MOST effective?"
    options:
      - "Deploying a network IDS to detect lateral movement after it begins"
      - "Implementing microsegmentation with host-based firewalls enforcing east-west traffic policies"
      - "Using longer subnet masks to create smaller network segments"
      - "Deploying a SIEM to correlate alerts from multiple compromised hosts"
    correct_answer: 1
    explanations:
      correct: "Microsegmentation implements granular security policies between individual workloads/hosts (east-west traffic control). With microsegmentation, even hosts on the same VLAN or subnet can only communicate with other hosts for which policies explicitly allow it. A compromised workstation cannot reach other systems unless a policy permits the specific communication. This limits lateral movement to only what is explicitly authorized."
      incorrect:
        - "Network IDS detects lateral movement but does not prevent it. By the time detection occurs, the attacker may have already pivoted. Prevention is more effective than detection for lateral movement."
        - "Microsegmentation with host-based firewalls enforcing east-west traffic policies directly prevents lateral movement by blocking unauthorized inter-host communication."
        - "Smaller subnets (VLAN segmentation) limit broadcast domains but do not restrict east-west traffic within the same segment. Subnetting is a network design control, not a lateral movement prevention control."
        - "SIEMs provide detection and correlation capabilities but do not prevent lateral movement. They would be activated after an attacker is already pivoting."
    difficulty: "medium"
    tags: ["network-security", "microsegmentation", "lateral-movement", "zero-trust"]

  - id: q-d4-057
    domain: domain4
    question: "What is 'DNS over HTTPS' (DoH) and what security/privacy problem does it address?"
    options:
      - "DoH encrypts DNS query payloads before transmission to protect data being resolved"
      - "DoH transmits DNS queries inside HTTPS connections, preventing ISPs and network eavesdroppers from monitoring which domains a user is resolving"
      - "DoH replaces DNSSEC by providing stronger cryptographic authentication of DNS responses"
      - "DoH eliminates the need for recursive DNS resolvers by caching all responses locally"
    correct_answer: 1
    explanations:
      correct: "DNS queries are traditionally sent in plaintext over UDP port 53, allowing ISPs, network operators, and eavesdroppers to monitor which domains a user resolves (even without seeing the full URL or content). DNS over HTTPS (DoH) encrypts DNS queries within HTTPS traffic to a DoH resolver, making DNS queries indistinguishable from regular web traffic and preventing network-level DNS monitoring and manipulation."
      incorrect:
        - "DNS payloads contain domain names, not 'encrypted data.' The purpose is to encrypt the DNS query transport, not the data within the query. DoH encrypts the DNS query channel."
        - "DoH transmits DNS queries inside HTTPS connections, preventing network-level monitoring of which domains a user resolves — this correctly describes the privacy and security benefit."
        - "DoH and DNSSEC serve different purposes and can coexist. DNSSEC authenticates DNS records; DoH encrypts the DNS transport. DoH does not replace DNSSEC."
        - "DoH still requires DNS resolvers. It changes the transport protocol (HTTPS vs. UDP/53) but does not eliminate the resolver infrastructure or add caching beyond standard DNS caching."
    difficulty: "medium"
    tags: ["DNS", "privacy", "encryption", "network"]

  - id: q-d4-058
    domain: domain4
    question: "In an 802.11 wireless network, what is the primary security difference between WPA3-Personal and WPA2-Personal?"
    options:
      - "WPA3 uses AES-256 encryption while WPA2 uses AES-128"
      - "WPA3 uses SAE (Simultaneous Authentication of Equals) instead of PSK, providing forward secrecy and resistance to offline dictionary attacks"
      - "WPA3 requires enterprise RADIUS authentication; WPA2 supports both personal and enterprise modes"
      - "WPA3 eliminates the need for a pre-shared key by using certificate-based authentication"
    correct_answer: 1
    explanations:
      correct: "WPA3-Personal replaces WPA2's PSK (Pre-Shared Key) handshake with SAE (Simultaneous Authentication of Equals, also called Dragonfly handshake). SAE provides: (1) Forward secrecy — capturing the handshake does not allow offline dictionary attacks against the passphrase because each session generates unique key material, (2) Resistance to PMKID attacks used to capture WPA2 hashes for offline cracking, and (3) Protection against deauthentication and dictionary attacks."
      incorrect:
        - "Both WPA2 and WPA3 can use AES encryption. WPA3 minimum is CCMP/AES-128; WPA3-Enhanced Open and enterprise modes may use 192-bit Suite-B. The fundamental difference is the authentication mechanism (SAE vs. PSK), not just key length."
        - "WPA3-Personal uses SAE instead of PSK, providing forward secrecy and offline dictionary attack resistance — this is the primary security improvement."
        - "WPA3-Personal mode still uses a pre-shared passphrase but with the SAE exchange mechanism. WPA3-Enterprise uses RADIUS. WPA3-Personal does not require enterprise RADIUS."
        - "WPA3-Personal still uses a pre-shared passphrase for authentication. The change is the authentication protocol (SAE/Dragonfly), not the elimination of shared secrets."
    difficulty: "medium"
    tags: ["wireless", "WPA3", "authentication", "SAE"]

  - id: q-d4-059
    domain: domain4
    question: "Which attack exploits the way TCP connection tracking works by exhausting server resources with half-open connections?"
    options:
      - "Ping of Death — sending oversized ICMP packets to crash the target"
      - "SYN Flood — sending large numbers of SYN packets without completing the three-way handshake, exhausting the server's connection table"
      - "Teardrop attack — sending fragmented packets with overlapping fragment offsets"
      - "UDP Flood — sending high volumes of UDP packets to random ports"
    correct_answer: 1
    explanations:
      correct: "A SYN Flood attack exploits TCP's three-way handshake by sending many SYN (synchronize) packets without completing the handshake (never sending the ACK). The server responds to each SYN with SYN-ACK and allocates resources in a half-open connection table. With enough SYN packets, the connection table fills, and the server cannot accept legitimate connections. SYN cookies and rate limiting are common mitigations."
      incorrect:
        - "Ping of Death exploited buffer overflows in ICMP packet processing for oversized packets. This is a different attack type and is largely patched in modern systems."
        - "SYN Flood exhausts server resources with half-open connections by sending SYN packets without completing the TCP three-way handshake."
        - "Teardrop attacks send fragmented packets with invalid overlapping fragment offsets, causing crashes in reassembly code. Different from SYN flooding — it's a packet fragmentation attack."
        - "UDP Flood sends high volumes of UDP packets to consume bandwidth and processing resources. It doesn't exploit TCP connection state tables — that's the SYN Flood's mechanism."
    difficulty: "easy"
    tags: ["network-security", "DoS", "TCP", "SYN-flood"]

