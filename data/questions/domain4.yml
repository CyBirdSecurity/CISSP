    domain: domain4
    question: "What is the primary security benefit of using 'Software-Defined Networking' (SDN) in enterprise environments?"
    options:
      - "SDN eliminates the need for physical network hardware, reducing capital costs"
      - "SDN separates the control plane from the data plane, enabling centralized security policy enforcement and rapid programmatic response to threats"
      - "SDN provides automatic encryption of all network traffic between endpoints"
      - "SDN replaces firewalls with software-based packet filtering at line speed"
    correct_answer: 1
    explanations:
