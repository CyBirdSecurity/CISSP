    tags: ["network-security", "web-filtering", "proxy", "content"]

  - id: q-d4-064
    domain: domain4
    question: "Which network attack exploits trust relationships between hosts by spoofing the IP address of a trusted host?"
    options:
      - "ARP poisoning — injecting false MAC-to-IP mappings"
      - "IP spoofing — sending packets with a forged source IP address to bypass source-based access controls"
      - "DNS spoofing — returning fraudulent DNS responses to redirect traffic"
      - "ICMP redirect — injecting false routing information via ICMP messages"
    correct_answer: 1
    explanations:
      correct: "IP spoofing involves sending packets with a forged source IP address. Attackers use this to: bypass IP-based access controls (firewalls that allow traffic from trusted IP ranges), launch reflection/amplification DDoS attacks, and conduct blind attacks in trust relationships (e.g., exploiting rsh/rlogin trust based on source IP). Defenses include ingress filtering (BCP38), which prevents packets with obviously spoofed source IPs from leaving a network."
      incorrect:
        - "ARP poisoning corrupts ARP tables to map IP addresses to attacker-controlled MAC addresses — a Layer 2 attack. IP spoofing operates at Layer 3 and involves forging source IP in packet headers."
        - "IP spoofing forges the source IP address to exploit IP-based access controls and trust relationships — this is the correct definition."
        - "DNS spoofing involves returning fraudulent DNS responses to redirect name resolution. It is a different attack vector than IP spoofing, though both can enable MITM attacks."
        - "ICMP redirect attacks inject routing information to redirect traffic through an attacker-controlled path. This is a different network attack from source IP spoofing."
    difficulty: "medium"
    tags: ["network-security", "IP-spoofing", "attacks", "trust"]

  - id: q-d4-065
    domain: domain4
    question: "What is 'network traffic baseline' and why is it essential for effective intrusion detection?"
    options:
      - "A baseline configuration of all network devices that ensures consistent security settings"
      - "A documented profile of normal network behavior patterns used to identify anomalous activity that may indicate an attack"
      - "The minimum bandwidth threshold required to maintain acceptable network performance"
      - "A standard set of firewall rules applied to all new network deployments"
    correct_answer: 1
    explanations:
