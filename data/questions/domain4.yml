      - "Unauthorized topology discovery provides attackers with network maps, identifying targets, paths, and defensive gaps before launching attacks"
      - "Network topology discovery consumes excessive bandwidth that degrades network performance"
      - "Topology discovery tools can accidentally modify network configurations during scanning"
    correct_answer: 1
    explanations:
      correct: "Network topology discovery (using tools like nmap, traceroute, SNMP queries) maps network devices, IP ranges, routing paths, and open services. When performed without authorization, this constitutes reconnaissance — providing attackers with a network map to identify high-value targets, attack paths, and security gaps. Defenders should monitor for unauthorized discovery scanning and conduct their own authorized discovery to understand their attack surface."
      incorrect:
        - "Authorized topology discovery by IT teams is legitimate asset management. The concern is unauthorized discovery by external or internal attackers performing reconnaissance."
        - "Unauthorized topology discovery gives attackers network maps revealing targets, paths, and defensive gaps — this is the primary security concern."
        - "Some discovery tools do generate network traffic, but bandwidth consumption is an operational consideration, not the primary security concern. Stealthy scanning tools minimize traffic impact."
        - "Read-only scanning tools (nmap in default mode) do not modify configurations. Active exploitation tools might, but standard topology discovery is passive observation."
