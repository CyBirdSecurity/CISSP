    tags: ["network-security", "reconnaissance", "scanning", "security"]

  - id: q-d4-063
    domain: domain4
    question: "What is the security difference between 'content filtering' and 'URL filtering' in web security gateways?"
    options:
      - "Content filtering applies to email; URL filtering applies to web browsing — they serve different protocols"
      - "URL filtering blocks access to websites based on domain/URL reputation or category; content filtering inspects the actual content of web pages for malicious code or policy violations"
