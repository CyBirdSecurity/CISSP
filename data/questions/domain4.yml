      incorrect:
        - "Device configuration baselines address security settings on individual devices. Network traffic baseline is about normal traffic behavior patterns, not configuration."
        - "A network traffic baseline documents normal behavior patterns for anomaly detection — identifying deviations that may indicate attacks or breaches."
