    tags: ["network-security", "SD-WAN", "WAN", "cloud"]

  - id: q-d4-093
    domain: domain4
    question: "What is 'network time protocol security' (NTS or authenticated NTP) and why is accurate time critical for security operations?"
    options:
      - "Accurate time is needed for video surveillance timestamp accuracy in physical security"
      - "Accurate, authenticated time is critical for log correlation across systems, TLS certificate validation, Kerberos ticket expiration, and forensic investigations — NTP attacks can manipulate timestamps to falsify audit trails"
      - "Network time synchronization is needed only for SLA measurement in service provider agreements"
      - "Time accuracy is a performance concern; security operations work well with approximate timestamps"
    correct_answer: 1
    explanations:
      correct: "Accurate time is foundational to security operations: log correlation across multiple systems requires synchronized timestamps (events 1 second apart may appear in wrong order or be missed), TLS certificate validity windows require accurate time, Kerberos tickets have 5-minute maximum time skew tolerance, and forensic investigations depend on accurate timelines. NTP attacks (time poisoning) can shift system clocks to falsify audit logs, expire valid certificates, or break Kerberos authentication. NTS (Network Time Security) adds authentication to NTP."
      incorrect:
        - "Video surveillance timestamps are a physical security concern. Security operations (log correlation, forensics, authentication) have far more critical dependencies on accurate time."
        - "Accurate time is critical for log correlation, TLS validation, Kerberos authentication, and forensic investigations — NTP attacks can manipulate timestamps to falsify audit trails."
        - "SLA measurement is an operational concern. Time accuracy is a security requirement affecting authentication, log integrity, and forensic reliability."
        - "Approximate timestamps are insufficient for security operations — correlation errors from 1-2 second time differences can cause missed detections and incorrect incident timelines."
    difficulty: "medium"
    tags: ["network-security", "NTP", "time", "logging"]

  - id: q-d4-094
    domain: domain4
    question: "In IPv6, what replaced the ARP protocol used in IPv4, and what security improvement does this provide?"
    options:
      - "IPv6 eliminated address resolution entirely, using stateless autoconfiguration"
      - "IPv6 uses Neighbor Discovery Protocol (NDP) with ICMPv6; security improvement comes from using SEND (Secure Neighbor Discovery) with cryptographic address verification"
      - "IPv6 uses DHCPv6 exclusively for all address assignment and resolution"
      - "IPv6 replaced ARP with DNSSEC, using DNS for all address-to-link-layer resolution"
    correct_answer: 1
    explanations:
      correct: "IPv6 replaced ARP with Neighbor Discovery Protocol (NDP), using ICMPv6 messages for address resolution, router discovery, and prefix advertisement. NDP suffers from the same spoofing vulnerabilities as ARP (NDP spoofing/poisoning). SEND (Secure Neighbor Discovery, RFC 3971) is an extension that uses Cryptographically Generated Addresses (CGA) and digital signatures to verify address ownership, preventing NDP spoofing. SEND provides the security improvement ARP never had."
      incorrect:
        - "IPv6 still requires layer 2 address resolution — it maps IPv6 addresses to MAC addresses using NDP. Stateless autoconfiguration (SLAAC) generates addresses but still requires NDP for resolution."
        - "IPv6 uses NDP (ICMPv6) instead of ARP; SEND provides cryptographic address verification as the security improvement over ARP's lack of authentication."
        - "DHCPv6 assigns IPv6 addresses but does not handle address-to-MAC resolution (that's NDP). SLAAC and DHCPv6 are both address assignment mechanisms, not resolution protocols."
        - "DNSSEC provides DNS record authentication — it does not resolve IPv6 addresses to MAC addresses at the link layer. NDP handles link-layer address resolution in IPv6."
    difficulty: "hard"
    tags: ["network-security", "IPv6", "NDP", "ARP"]

  - id: q-d4-095
    domain: domain4
    question: "What is a 'screened subnet' (also called a 'true DMZ') architecture and how does it improve on a simple single-firewall DMZ?"
    options:
      - "A screened subnet uses one firewall with three interfaces separating internet, DMZ, and internal networks"
      - "A screened subnet uses two firewalls (outer and inner) with a DMZ network between them — if the outer firewall is compromised, the inner firewall still protects the internal network"
      - "A screened subnet encrypts all traffic between the DMZ and internal network using IPsec"
      - "A screened subnet uses a separate management network accessible only from the internal zone"
    correct_answer: 1
    explanations:
      correct: "A screened subnet (true DMZ) uses two separate firewall devices: an outer firewall separating the internet from the DMZ, and an inner firewall separating the DMZ from the internal network. This provides defense in depth — if an attacker compromises the outer firewall, they only reach the DMZ; the inner firewall still protects the internal network. A single firewall with three interfaces offers convenience but if that firewall is compromised, both DMZ and internal networks are exposed."
      incorrect:
        - "A single firewall with three interfaces (internet, DMZ, internal) is the simplified DMZ — not the screened subnet. Screened subnet specifically uses two separate firewall devices."
        - "A screened subnet uses two separate firewalls with a DMZ between them — if the outer firewall is compromised, the inner firewall still protects internal systems."
        - "Encrypting DMZ-to-internal traffic is a data protection measure — not the defining characteristic of a screened subnet architecture. The key feature is the two-firewall topology."
        - "Out-of-band management networks are a management security best practice. The screened subnet architecture is specifically about the two-firewall topology for internet-DMZ-internal zone protection."
    difficulty: "medium"
    tags: ["network-security", "DMZ", "architecture", "defense-in-depth"]

  - id: q-d4-096
    domain: domain4
    question: "What is 'SSDP amplification' and which consumer device type is most commonly exploited for this attack?"
    options:
      - "Smart TVs are exploited to amplify DNS queries for DDoS attacks"
      - "Home routers, smart TVs, and other IoT devices implementing the Simple Service Discovery Protocol (UPnP) are exploited to amplify DDoS attacks using SSDP's reflection ratio"
      - "Enterprise switches with SSDP enabled are exploited for data center DDoS attacks"
      - "Web servers using SSDP for service discovery are exploited to amplify HTTP floods"
    correct_answer: 1
    explanations:
      correct: "SSDP (Simple Service Discovery Protocol) is part of the UPnP (Universal Plug and Play) standard used by consumer IoT devices (routers, smart TVs, game consoles, printers). SSDP amplification attacks send small SSDP SEARCH requests (spoofed with victim's IP) to internet-exposed UPnP devices, which respond with much larger responses directed at the victim. The amplification factor is approximately 30x. Millions of consumer devices with UPnP exposed to the internet make this attack feasible at scale."
      incorrect:
        - "Smart TVs are one type of device exploited, but the attack uses the SSDP/UPnP protocol specifically and spans many IoT device types — not just DNS queries."
        - "Home routers, smart TVs, and IoT devices implementing UPnP/SSDP are exploited for SSDP amplification DDoS attacks — this correctly identifies the protocol and device type."
        - "Enterprise switches typically do not expose UPnP/SSDP to the internet. SSDP amplification exploits consumer IoT devices, not enterprise infrastructure."
        - "Web servers use HTTP/HTTPS, not SSDP. SSDP is specifically for local service discovery and is not a web server protocol."
    difficulty: "hard"
    tags: ["network-security", "DDoS", "SSDP", "IoT", "amplification"]

  - id: q-d4-097
    domain: domain4
    question: "An organization's web application firewall (WAF) is placed in 'detection-only' mode for the first 30 days. What is the security rationale for this deployment approach?"
    options:
      - "Detection mode saves bandwidth because the WAF does not need to inspect blocked traffic"
      - "Establishing a baseline of legitimate traffic patterns to tune rules before blocking, reducing false positives that could disrupt legitimate business traffic"
      - "Detection mode is required by PCI DSS before WAF can be placed into blocking mode"
      - "WAFs in blocking mode require a separate license; detection mode uses the base license"
    correct_answer: 1
    explanations:
      correct: "Starting a WAF in detection/monitoring mode allows security teams to: observe what traffic the current ruleset would block, identify false positives (legitimate requests that would be incorrectly blocked), tune rules to the application's specific traffic patterns, and establish a baseline. After tuning, blocking mode is enabled with confidence that legitimate business traffic will not be disrupted. Immediately enabling blocking on an untuned WAF can block legitimate users and break application functionality."
      incorrect:
        - "Detection mode inspects all traffic to generate alerts — it consumes similar compute resources to blocking mode. The rationale is tuning and false positive identification, not bandwidth savings."
        - "Establishing a traffic baseline and tuning rules before blocking prevents false positives that could disrupt legitimate business traffic — this is the correct rationale for phased WAF deployment."
        - "PCI DSS does not mandate detection mode before blocking mode. The phased approach is an operational best practice for minimizing disruption, not a compliance requirement."
        - "WAF licensing typically does not distinguish between detection and blocking modes. The operational rationale is the primary reason for phased deployment."
    difficulty: "medium"
    tags: ["network-security", "WAF", "deployment", "tuning"]

  - id: q-d4-098
    domain: domain4
    question: "What is the 'OSI Layer 4' transport layer's primary responsibility and which security attacks specifically target it?"
    options:
      - "Layer 4 manages physical signal transmission; targeted by signal jamming attacks"
      - "Layer 4 provides end-to-end communication with error detection and flow control; targeted by SYN floods, session hijacking, and port scanning"
      - "Layer 4 handles name resolution; targeted by DNS spoofing and cache poisoning"
      - "Layer 4 manages routing between networks; targeted by BGP hijacking and route poisoning"
    correct_answer: 1
    explanations:
      correct: "The Transport Layer (Layer 4) provides end-to-end communication management including: TCP (connection-oriented with reliability, flow control, error detection) and UDP (connectionless, lower overhead). Security attacks specifically targeting Layer 4 include: SYN floods (exploiting TCP connection establishment), session hijacking (manipulating TCP sequence numbers), port scanning (probing TCP/UDP ports), and some DDoS attacks targeting TCP state tables."
      incorrect:
        - "Physical signal transmission is Layer 1 (Physical). Layer 4 manages logical end-to-end communication, not physical signals. Jamming attacks target the physical layer."
        - "Layer 4 manages end-to-end communication (TCP/UDP); attacks include SYN floods, session hijacking, and port scanning — this correctly identifies Layer 4's function and targeted attacks."
        - "Name resolution is performed by DNS (Application Layer 7 and above). DNS spoofing targets the DNS application layer, not Layer 4."
        - "Routing between networks is Layer 3 (Network/IP). BGP operates at the application layer but manages routing decisions. Layer 4 is above IP routing."
    difficulty: "medium"
    tags: ["network-security", "OSI", "Layer4", "transport"]

  - id: q-d4-099
    domain: domain4
    question: "What is 'always-on VPN' (split tunneling vs. full tunnel) and what are the security trade-offs of each approach?"
    options:
      - "Split tunneling routes only VPN traffic through the corporate network; full tunnel routes all traffic — split is more secure"
      - "Full tunnel routes all user traffic through the corporate security stack; split tunneling routes only corporate-destined traffic through VPN, leaving internet traffic to exit directly — full tunnel is more secure but increases bandwidth costs"
      - "Full tunnel VPN encrypts traffic with AES-256; split tunnel uses AES-128 for performance"
      - "Split tunneling applies to mobile devices; full tunnel is for laptop and desktop devices only"
    correct_answer: 1
    explanations:
      correct: "Full tunnel VPN: all user traffic routes through the corporate security stack (inspection, filtering, DLP) regardless of destination. More secure — corporate controls apply to all traffic. Higher bandwidth costs — all internet traffic traverses the corporate network. Split tunneling: only traffic destined for corporate resources routes through VPN; internet traffic exits directly from the user's ISP. Less secure — internet traffic bypasses corporate security controls. Lower bandwidth costs. Attackers on a split-tunneled machine can potentially reach corporate resources while communicating directly with malicious internet servers."
      incorrect:
        - "This is reversed. Full tunnel is more secure (all traffic goes through corporate controls); split tunneling is less secure (internet traffic bypasses corporate security)."
        - "Full tunnel routes all traffic through corporate security (more secure, higher cost); split tunneling routes only corporate traffic through VPN (less secure, lower bandwidth) — this is the correct description."
        - "Both split and full tunnel VPNs can use the same encryption algorithms. The distinction is traffic routing policy, not encryption strength."
        - "Split tunneling vs. full tunnel applies to all VPN client types — it is a routing policy decision, not a device type distinction."
    difficulty: "medium"
    tags: ["network-security", "VPN", "split-tunneling", "remote-access"]

  - id: q-d4-100
    domain: domain4
    question: "What is the security purpose of 'SNMPv3' over its predecessors SNMPv1 and SNMPv2c?"
    options:
      - "SNMPv3 supports more MIB objects than earlier versions, providing broader device management"
      - "SNMPv3 adds authentication (MD5/SHA) and encryption (DES/AES) for SNMP messages, replacing the insecure community string authentication of v1/v2c"
      - "SNMPv3 operates over TLS, inheriting the full security properties of the TLS protocol"
      - "SNMPv3 eliminates polling by using a push-based model that is less susceptible to interception"
    correct_answer: 1
    explanations:
      correct: "SNMPv1 and SNMPv2c use community strings (essentially plaintext passwords) sent in clear text for authentication. Anyone who captures network traffic can read the community string and access SNMP data. SNMPv3 adds: authentication (HMAC-MD5 or HMAC-SHA to verify message integrity and identity), encryption (DES, AES-128/256 for message confidentiality), and access controls per user account. This replaces the fundamentally insecure community string model."
      incorrect:
        - "MIB support is a feature set concern, not a security improvement. SNMPv3's security innovation is authentication and encryption, not expanded MIB coverage."
        - "SNMPv3 adds authentication and encryption replacing insecure community string authentication — this correctly describes the primary security improvement over v1/v2c."
        - "SNMPv3 uses UDP port 161 with its own authentication and encryption mechanisms — it does not run over TLS. TLS is for TCP-based protocols."
        - "SNMP still uses polling (manager queries agents). SNMPv3 did not change the polling model — it added security to the existing request/response model."
    difficulty: "medium"
    tags: ["network-security", "SNMP", "protocols", "authentication"]

  - id: q-d4-101
    domain: domain4
    question: "What is the primary security concern with 'Wi-Fi Protected Setup' (WPS) and why should it be disabled?"
    options:
      - "WPS requires physical proximity to the router, making it less convenient than password setup"
      - "WPS's PIN-based authentication allows an 8-digit PIN to be brute-forced in a practical timeframe due to a design flaw that allows testing PIN halves independently"
      - "WPS uses insecure DES encryption that can be broken with modern hardware in hours"
      - "WPS creates a separate SSID that is permanently vulnerable to deauthentication attacks"
    correct_answer: 1
    explanations:
      correct: "WPS PIN authentication has a fundamental design flaw: the 8-digit PIN (100 million possible combinations) is validated in two halves — first 4 digits and last 4 digits (the last digit is a checksum). This reduces the effective brute-force space to 11,000 combinations (10,000 + 1,000 for the second half). Tools like Reaver can brute-force WPS PINs in hours. WPS should be disabled on all access points; use WPA3/WPA2 with strong passphrases instead."
      incorrect:
        - "WPS convenience is an interface consideration, not a security concern. The security flaw is the vulnerable PIN authentication mechanism, not physical access requirements."
        - "WPS PIN's design flaw allows independent brute-force of its two halves, reducing the effective attack space to ~11,000 combinations from 100 million — this is the critical vulnerability."
        - "WPS does not use DES encryption. It uses the existing WPA2 encryption once authenticated. The vulnerability is in the PIN authentication mechanism, not encryption."
        - "WPS does not create a separate SSID — it is a setup method for the existing SSID. The vulnerability is the brute-forceable PIN authentication mechanism."
    difficulty: "medium"
    tags: ["wireless", "WPS", "vulnerabilities", "brute-force"]

  - id: q-d4-102
    domain: domain4
    question: "What is 'east-west traffic' in modern data center network security, and why has it become a growing security concern?"
    options:
      - "East-west traffic refers to data center interconnects between geographically distributed sites"
      - "East-west traffic is lateral traffic between servers/workloads within the same data center; traditional perimeter security (firewalls at the internet boundary) does not inspect this traffic, allowing lateral movement after initial compromise"
      - "East-west traffic is the inbound traffic from internet users to web-facing applications"
      - "East-west traffic describes backup replication traffic between primary and secondary data centers"
    correct_answer: 1
    explanations:
      correct: "East-west traffic is communication between servers, applications, and workloads within the same data center (lateral traffic), as opposed to north-south traffic (client-to-server traffic entering and leaving the data center). Traditional perimeter firewalls only inspect north-south traffic at the internet boundary. East-west traffic between internal systems is often unmonitored and uninspected, allowing an attacker who compromises one server to move laterally to other servers without traversing any security controls. Microsegmentation addresses this gap."
      incorrect:
        - "Geographically distributed data center interconnects are typically called 'data center interconnects' (DCI) or inter-site traffic. East-west refers to intra-data-center lateral traffic."
        - "East-west is lateral server-to-server traffic within the data center; traditional perimeter firewalls don't inspect it, enabling lateral movement after breach — this correctly defines the concern."
        - "Inbound traffic from internet users to web applications is north-south traffic (entering from outside, going to inside). East-west is lateral, internal-to-internal traffic."
        - "Backup replication is a specific application of east-west traffic but does not define it. East-west encompasses all server-to-server communication within the data center."
    difficulty: "medium"
    tags: ["network-security", "east-west", "microsegmentation", "data-center"]
