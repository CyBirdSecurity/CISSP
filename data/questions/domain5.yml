    tags: ["least-privilege", "IGA", "access-review", "entitlement-management"]

  - id: q-d5-081
    domain: domain5
    question: "Risk-based authentication (adaptive authentication) adjusts the authentication requirements based on contextual signals. Which combination of signals would most likely trigger step-up authentication?"
    options:
      - "Login from the user's usual device at their typical work location during business hours"
      - "Login from a new device in a foreign country at 3 AM requesting access to sensitive financial systems"
      - "Login after a 7-day absence from any system access"
      - "Login with a browser that has an outdated version"
    correct_answer: 1
    explanations:
      correct: "Risk-based authentication aggregates signals including device novelty, geolocation anomalies, impossible travel, time of day, and resource sensitivity. A new device, foreign country, unusual time, and sensitive target represent a high-risk signal combination that would trigger step-up authentication (e.g., additional MFA factor)."
      incorrect:
        - "Normal device, expected location, and business hours represent a low-risk profile — step-up authentication would not be triggered."
        - "Multiple high-risk signals (new device, anomalous location, unusual time, sensitive resource) is correct — this is the typical trigger."
        - "A 7-day absence may trigger session expiration but is not typically a high-risk signal requiring step-up authentication."
        - "Outdated browser is a device compliance signal that might trigger a compliance remediation flow, not typically step-up MFA."
