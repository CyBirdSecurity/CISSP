      - "Defense in depth for access provisioning"
      - "Separation of duties in the approval workflow"
      - "Need-to-know enforcement"
    correct_answer: 2
    explanations:
      correct: "Requiring two independent approvals (manager + data owner) implements separation of duties in the provisioning workflow — no single person can unilaterally grant access. This reduces the risk of collusion, unauthorized provisioning, and insider threat by requiring both business justification (manager) and resource-appropriate approval (data owner)."
      incorrect:
        - "Least privilege governs the scope of access granted, not the approval workflow structure."
        - "Defense in depth describes layered security controls broadly; the specific mechanism here is SoD in the approval process."
        - "Separation of duties in the approval workflow is correct — two independent approvers prevent unilateral access grants."
        - "Need-to-know determines whether access should be granted; the dual-approval process is how the decision is made, not the criteria."
    difficulty: "medium"
    tags: ["separation-of-duties", "access-provisioning", "workflow", "IAM"]

  - id: q-d5-089
    domain: domain5
    question: "What is the difference between authentication and non-repudiation, and which cryptographic mechanism provides non-repudiation?"
    options:
      - "Authentication proves identity to a system; non-repudiation proves actions cannot be denied. Symmetric encryption provides non-repudiation."
      - "Authentication proves identity; non-repudiation provides evidence that a specific entity performed a specific action that cannot later be denied. Digital signatures provide non-repudiation."
      - "Authentication and non-repudiation are equivalent; both are achieved through MFA."
      - "Authentication is technical; non-repudiation is legal. PKI certificates provide both."
    correct_answer: 1
    explanations:
      correct: "Authentication proves who a user is at a point in time. Non-repudiation provides cryptographic proof that a specific entity performed a specific action (e.g., signed a document, sent a message) that the entity cannot later deny. Digital signatures using asymmetric cryptography provide non-repudiation because only the private key holder can create valid signatures."
      incorrect:
        - "Symmetric encryption provides confidentiality; since both parties share the key, either could have created the ciphertext, providing no non-repudiation."
        - "Digital signatures for non-repudiation is correct — asymmetric key signing creates verifiable, undeniable proof of origin."
        - "Authentication and non-repudiation are distinct concepts; MFA improves authentication assurance but does not provide cryptographic non-repudiation."
        - "PKI certificates establish identity but non-repudiation specifically requires the act of signing, not just possessing a certificate."
    difficulty: "medium"
    tags: ["non-repudiation", "digital-signatures", "authentication", "cryptography"]

  - id: q-d5-090
    domain: domain5
    question: "An organization uses an enterprise password manager with centralized vaulting. A security audit finds that 30 employees share a single 'admin' password stored in the vault for a legacy application that does not support individual accounts. What is the PRIMARY security concern?"
