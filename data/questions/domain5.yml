  - id: q-d5-101
    domain: domain5
    question: "What is the key difference between identification, authentication, and authorization in the AAA (Authentication, Authorization, and Accounting) framework?"
    options:
      - "Identification claims identity; authentication proves identity; authorization grants access based on proven identity"
      - "Identification grants access; authentication logs actions; authorization claims identity"
      - "All three are equivalent steps in the login process with different names"
      - "Identification and authentication are the same; authorization is the only distinct step"
    correct_answer: 0
    explanations:
      correct: "Identification is the claim ('I am user X'), authentication is the proof ('here is my password/token proving I am X'), and authorization determines what the authenticated user is permitted to do ('user X may read but not write'). These are distinct sequential steps in the access control process."
      incorrect:
        - "Identification claims, authentication proves, authorization grants access — this is correct and the foundational AAA definition."
        - "The sequence and definitions are inverted; identification is the claim, not the grant of access."
        - "Each step serves a distinct security function; they are not equivalent."
        - "Identification and authentication are distinct — one claims identity, the other verifies it."
    difficulty: "easy"
    tags: ["AAA", "identification", "authentication", "authorization"]

  - id: q-d5-102
    domain: domain5
    question: "An organization implements a 'bring your own identity' (BYOI) model, allowing employees to use their personal Google or Apple ID to access corporate resources. What is the PRIMARY security risk of this approach?"
    options:
      - "BYOI increases latency due to external IdP round trips during authentication"
      - "The organization loses control over credential management, password policies, and account lifecycle for corporate access"
      - "BYOI is incompatible with enterprise SSO protocols like SAML and OIDC"
      - "Personal accounts cannot support multi-factor authentication"
    correct_answer: 1
    explanations:
      correct: "BYOI delegates identity management to consumer IdPs (Google, Apple) that the organization does not control. The organization cannot enforce corporate password policies, mandate MFA, disable accounts immediately upon termination, or control recovery methods. If an employee's personal Google account is compromised, corporate access is also compromised."
      incorrect:
        - "Authentication latency is a performance consideration, not a primary security risk."
        - "Loss of control over credential management and lifecycle is correct — this is the defining risk of BYOI for enterprise access."
        - "BYOI can integrate via OIDC/SAML; technical compatibility is not the primary concern."
        - "Both Google and Apple consumer accounts support MFA; this is not the primary limitation."
    difficulty: "medium"
    tags: ["BYOI", "identity-federation", "credential-management", "IAM-risk"]
