      - "Flaw: MFA self-enrollment without re-verification of identity; Control: requiring manager/helpdesk approval for MFA device changes"
      - "Flaw: single-factor authentication; Control: enforcing mandatory MFA enrollment"
      - "Flaw: shared accounts; Control: individual unique accounts per user"
    correct_answer: 1
    explanations:
      correct: "If MFA device enrollment (adding a new authenticator) does not require re-verification of identity (e.g., re-authentication, manager approval, or helpdesk verification), an attacker with account access can enroll their own device and maintain persistent MFA-authenticated access. Controls include requiring current device confirmation, manager approval, or a verification call for enrolling new MFA devices."
      incorrect:
