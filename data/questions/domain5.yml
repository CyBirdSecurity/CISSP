    tags: ["workload-identity", "Kubernetes", "OIDC", "cloud-IAM"]

  - id: q-d5-080
    domain: domain5
    question: "An identity governance review discovers that 40% of access entitlements in the organization have never been used in the past 180 days. What is the recommended remediation approach?"
    options:
      - "Extend the review cycle to 365 days to reduce administrative burden"
      - "Remove unused entitlements following least privilege principles"
      - "Archive unused entitlements for historical audit trails"
      - "Reclassify unused entitlements as low-risk and skip future reviews"
    correct_answer: 1
    explanations:
      correct: "Unused access represents standing attack surface — if an account is compromised, unused entitlements become available to an attacker. Least privilege requires revoking access that is not demonstrably needed. Many IGA tools support automated removal of entitlements unused beyond a defined threshold."
      incorrect:
        - "Extending review cycles increases risk by allowing unused access to persist longer without scrutiny."
        - "Removing unused entitlements per least privilege is correct — dormant access should be revoked, not retained."
        - "Archiving for audit trails is a reporting function; the entitlements themselves should be removed from production."
        - "Unused access is not inherently low-risk — it represents potential attack surface if the account is compromised."
