      incorrect:
        - "A silver ticket forges a service ticket (TGS) using a specific service account's hash — limited to that service, not domain-wide."
        - "A golden ticket attack is correct — it uses the KRBTGT hash to forge domain-wide Kerberos tickets."
        - "DCSync mimics a domain controller replication request to extract password hashes (including KRBTGT) but is the technique used to obtain the hash, not the ticket forging attack itself."
