      - "Kubernetes Service Account tokens (OIDC-compliant JWTs) bound to specific pods"
      - "Mutual TLS certificates provisioned by the container registry"
      - "SSH key pairs injected at container startup via environment variables"
    correct_answer: 1
    explanations:
