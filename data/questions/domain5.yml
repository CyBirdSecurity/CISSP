        - "VPN-based implicit trust is the legacy perimeter model that Zero Trust is designed to replace."
    difficulty: "medium"
    tags: ["Zero-Trust", "device-identity", "continuous-validation", "access-control"]

  - id: q-d5-071
    domain: domain5
    question: "An organization stores API keys in application code and commits them to a public GitHub repository. What immediate action should the security team take when this is discovered?"
    options:
