  - id: q-d5-094
    domain: domain5
    question: "An organization implements passwordless authentication using FIDO2. A user loses their hardware security key. What should the organization's account recovery procedure require to prevent account takeover?"
    options:
      - "The user can recover their account by providing their username and backup email"
      - "The user can use their SMS phone number as an alternative factor to reset and enroll a new key"
      - "Recovery requires in-person identity verification or strong out-of-band verification before enrolling a new FIDO2 credential"
      - "The IT helpdesk can issue a temporary password to regain access without additional verification"
    correct_answer: 2
    explanations:
      correct: "Account recovery procedures are a common target for bypassing strong authentication. If recovery is weaker than the primary authentication method, attackers target recovery. For FIDO2 (phishing-resistant), recovery must also be strong — typically in-person verification with government ID or multi-channel verification to prevent social engineering of the helpdesk."
      incorrect:
        - "Username plus backup email is weak recovery — email accounts are frequently compromised and this enables account takeover."
        - "SMS recovery reintroduces SIM-swapping vulnerability, bypassing the security improvements of FIDO2 passwordless."
        - "Strong out-of-band identity verification before re-enrollment is correct — recovery strength must match primary authentication strength."
        - "Issuing a temporary password as recovery defeats passwordless and creates a credential that can be phished."
    difficulty: "hard"
    tags: ["FIDO2", "account-recovery", "passwordless", "authentication-design"]

