  - id: q-d5-091
    domain: domain5
    question: "A user attempts to log in to a web application and receives the error: 'No account found with this email.' A security-conscious developer changes the message to: 'Invalid email or password.' Why is the generic message more secure?"
    options:
      - "Generic messages prevent brute-force attacks by slowing down login attempts"
      - "Generic messages prevent account enumeration by not revealing whether a username exists"
      - "Generic messages comply with GDPR requirements for data minimization"
      - "Generic messages prevent SQL injection by avoiding database error exposure"
    correct_answer: 1
    explanations:
      correct: "Specific error messages ('No account found') allow attackers to enumerate valid usernames by trying many emails and observing which generate 'account not found' vs. 'wrong password' responses. A generic message prevents username harvesting, which is typically the first step in credential attacks."
      incorrect:
        - "Generic messages don't inherently slow down login attempts; rate limiting and CAPTCHA address brute force."
        - "Preventing account enumeration is correct — not disclosing whether a username exists protects against username harvesting attacks."
        - "While data minimization is a GDPR principle, it applies to data collection, not login error messages specifically."
        - "SQL injection errors (stack traces, SQL syntax in messages) are a separate issue from username enumeration."
    difficulty: "easy"
    tags: ["account-enumeration", "error-messages", "username-harvesting", "authentication-security"]

  - id: q-d5-092
    domain: domain5
    question: "Which of the following best describes the 'confused deputy' problem in access control?"
    options:
      - "A privileged user accidentally grants excessive access to a less-privileged user"
      - "A program with elevated privileges is tricked by a less-privileged caller into performing actions the caller could not perform directly"
      - "Two users with conflicting roles create authorization decision conflicts"
      - "An authentication system is confused by multiple valid credentials for the same user"
    correct_answer: 1
    explanations:
      correct: "The confused deputy problem occurs when a privileged program (the 'deputy') is manipulated by a less-privileged caller to misuse its authority. Example: A compiler running as root is tricked into writing output to a protected file by a malicious user. In web contexts, CSRF exploits the browser as a confused deputy."
      incorrect:
        - "Accidental privilege escalation is a different problem; the confused deputy involves deliberate exploitation of a trusted intermediary."
        - "A privileged program exploited by a less-privileged caller to perform unauthorized actions is correct — this is the classic confused deputy definition."
        - "Role conflicts describe SoD issues, not the exploitation of a trusted intermediary."
        - "Credential conflicts are an authentication edge case unrelated to the confused deputy access control problem."
    difficulty: "hard"
    tags: ["confused-deputy", "privilege-escalation", "access-control", "CSRF"]

  - id: q-d5-093
    domain: domain5
    question: "An organization uses Group Policy Objects (GPOs) in Active Directory to enforce security configurations on Windows workstations. What is the MOST important security control to apply to GPO management?"
    options:
      - "All users should have read access to GPOs to promote transparency"
      - "GPO editing rights should be tightly restricted and changes should go through change management with testing"
      - "GPOs should be backed up weekly to recover from accidental deletion"
      - "GPOs should be version-controlled in Git for audit purposes"
    correct_answer: 1
    explanations:
