      incorrect:
        - "Performance acceleration is a secondary benefit; the primary security purpose is key protection, not throughput."
        - "HSM key protection for CA private keys is correct — this is the foundational security requirement for a trusted CA."
        - "OCSP response signing is a function an HSM may support but is not the primary purpose in CA deployments."
        - "Certificate lifecycle management is handled by CA software; the HSM's role is specifically key storage and cryptographic operations."
