      - "Kerberoasting"
      - "Golden ticket attack"
    correct_answer: 2
    explanations:
      correct: "Kerberoasting requests service tickets (TGS) encrypted with the service account's password hash, then cracks them offline. It targets service accounts with SPNs registered in Active Directory."
      incorrect:
        - "Pass-the-ticket reuses captured Kerberos tickets rather than cracking them offline."
        - "AS-REP roasting targets accounts with pre-authentication disabled, requesting AS-REP responses encrypted with the user's hash — not service tickets."
        - "Kerberoasting is correct — it specifically targets service tickets (TGS) for accounts with Service Principal Names (SPNs)."
        - "A golden ticket attack forges TGTs using the KRBTGT account hash, granting domain-wide access without cracking service account passwords."
    difficulty: "hard"
    tags: ["Kerberos", "Kerberoasting", "credential-attacks", "Active-Directory"]

  - id: q-d5-055
    domain: domain5
    question: "AS-REP roasting targets Kerberos accounts that have which configuration enabled, allowing an attacker to request an AS-REP response and crack it offline?"
    options:
