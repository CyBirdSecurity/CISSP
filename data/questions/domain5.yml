  - id: q-d5-078
    domain: domain5
    question: "Which access control model allows object owners to grant access to their resources at their own discretion, making it flexible but potentially inconsistent across the organization?"
    options:
      - "Mandatory Access Control (MAC)"
      - "Role-Based Access Control (RBAC)"
      - "Discretionary Access Control (DAC)"
      - "Rule-Based Access Control"
    correct_answer: 2
    explanations:
      correct: "In DAC, resource owners control who can access their objects and can grant/revoke access at their discretion. This is common in file systems (e.g., Windows NTFS ACLs, Unix permissions). The weakness is inconsistency — different owners make different decisions, leading to access sprawl and policy gaps."
      incorrect:
        - "MAC is enforced by the system using security labels; individual owners cannot override access policy."
        - "RBAC centralizes access via role assignments; individual resource owners do not control access independently."
        - "DAC allowing owner discretion is correct — it is the defining characteristic and key weakness of DAC."
        - "Rule-based access control uses system-defined rules (e.g., time of day, IP range) enforced uniformly, not owner discretion."
