        - "Loss of individual accountability and non-repudiation is correct — this is the defining risk of shared credentials."
        - "Password complexity is a secondary concern; the identity accountability issue is the primary security risk."
        - "Rotation difficulty is an operational concern but secondary to the audit trail and accountability problem."
