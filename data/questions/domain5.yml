  - id: q-d5-060
    domain: domain5
    question: "TOTP (Time-based One-Time Password) and HOTP (HMAC-based One-Time Password) are both OTP standards. What is the key technical difference between them?"
    options:
      - "TOTP uses asymmetric cryptography; HOTP uses symmetric cryptography"
      - "TOTP generates codes based on time; HOTP generates codes based on a counter"
      - "TOTP requires internet connectivity; HOTP works offline"
      - "TOTP is more vulnerable to replay attacks than HOTP"
    correct_answer: 1
    explanations:
      correct: "TOTP (RFC 6238) generates OTPs using the current Unix timestamp as input, making codes time-limited (typically 30 seconds). HOTP (RFC 4226) uses a counter incremented on each use, making codes valid until used — which increases replay window risk."
      incorrect:
        - "Both TOTP and HOTP use symmetric HMAC-SHA1; neither uses asymmetric cryptography."
        - "TOTP uses time; HOTP uses a counter — this is correct."
        - "Both TOTP and HOTP are designed to work offline since the shared secret is pre-provisioned."
        - "HOTP is generally more vulnerable to replay than TOTP since codes don't expire until used; TOTP has a short time window."
