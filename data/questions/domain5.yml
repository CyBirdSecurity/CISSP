        - "Pre-authentication disabled is correct — this flag (DONT_REQUIRE_PREAUTH) allows unauthenticated AS-REP requests."
        - "Unconstrained delegation allows forwarding of TGTs to any service but is not the prerequisite for AS-REP roasting."
    difficulty: "hard"
    tags: ["Kerberos", "AS-REP-roasting", "Active-Directory", "credential-attacks"]

  - id: q-d5-056
    domain: domain5
    question: "An attacker who has compromised a Domain Controller extracts the KRBTGT account's NTLM hash and uses it to forge Kerberos tickets granting them domain admin rights for any user. This attack is called:"
