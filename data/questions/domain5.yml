    tags: ["DAC", "access-control-models", "ACL", "IAM"]

  - id: q-d5-079
    domain: domain5
    question: "An organization deploys workload identity for its containerized applications running in Kubernetes. Instead of using static API keys, each pod receives a dynamic short-lived identity credential. What standard mechanism does this leverage?"
