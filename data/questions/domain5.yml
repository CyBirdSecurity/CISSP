  - id: q-d5-072
    domain: domain5
    question: "What is the primary purpose of a Hardware Security Module (HSM) in a PKI deployment?"
    options:
      - "To accelerate TLS handshakes by offloading CPU-intensive cryptographic operations"
      - "To store and protect CA private keys in tamper-evident hardware that prevents key extraction"
      - "To validate certificate revocation status via OCSP responses"
      - "To manage certificate lifecycle including issuance, renewal, and expiration notifications"
    correct_answer: 1
    explanations:
