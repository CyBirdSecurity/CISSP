    tags: ["adaptive-authentication", "risk-based-authentication", "contextual-signals", "MFA"]

  - id: q-d5-082
    domain: domain5
    question: "An organization's internal audit finds that a network engineer has accumulated admin access to the firewall management console, VPN concentrator, DNS servers, and SIEM platform over three years without any role changes. What IAM process failure does this represent?"
    options:
      - "Toxic combination — the engineer has conflicting role assignments"
      - "Separation of duties violation requiring immediate access revocation"
      - "Failure of periodic access recertification to remove access no longer tied to business need"
      - "Privilege escalation attack by the network engineer"
    correct_answer: 2
    explanations:
      correct: "This is privilege creep resulting from failure of periodic access recertification. Over time, the engineer accumulated access from various projects or role expansions that was never removed. IGA programs require managers to periodically certify that each access entitlement remains justified, with automatic removal of uncertified access."
      incorrect:
        - "Toxic combinations describe conflicting duties that together enable fraud (e.g., approving and paying invoices); this is accumulation, not conflict."
        - "Whether this violates SoD depends on the specific combination; the core issue is accumulation without periodic review, not SoD conflict."
        - "Failure of access recertification allowing privilege creep is correct — this is the textbook IGA gap."
        - "There is no indication of malicious intent; this describes a governance failure, not an insider attack."
    difficulty: "medium"
    tags: ["privilege-creep", "access-recertification", "IGA", "least-privilege"]

  - id: q-d5-083
    domain: domain5
    question: "An organization wants to grant a third-party auditor temporary read-only access to their cloud environment logs for a 2-week audit engagement. Which approach best follows least privilege and minimizes risk?"
    options:
      - "Create a permanent auditor account with read-only permissions that can be reused for future audits"
      - "Share a senior engineer's credentials with the auditor under a non-disclosure agreement"
      - "Create a time-limited account with scoped read-only permissions that automatically expires after 2 weeks"
      - "Provide the auditor VPN access to the corporate network and rely on network-level controls"
    correct_answer: 2
    explanations:
      correct: "Time-limited accounts with automatic expiration enforce both least privilege (read-only, scoped to needed resources) and temporal access limitation (no action required for deprovisioning). This eliminates the risk of forgetting to remove access after the audit ends."
      incorrect:
        - "Permanent accounts for temporary access violate least privilege on the temporal dimension — they persist beyond need."
        - "Sharing credentials is a fundamental IAM control failure: it prevents individual accountability, audit trail attribution, and violates most compliance frameworks."
        - "Time-limited, scoped read-only access with auto-expiration is correct — this is the recommended approach for third-party temporary access."
        - "VPN access provides network connectivity but doesn't constrain what the auditor can access; scoped application-level credentials are more precise."
    difficulty: "easy"
    tags: ["third-party-access", "least-privilege", "temporal-access", "access-management"]

  - id: q-d5-084
    domain: domain5
    question: "OpenID Connect (OIDC) ID tokens contain claims about the authenticated user. Which claim is the stable, unique identifier for the user that applications should use to correlate identity across sessions?"
    options:
      - "email — the user's email address"
      - "name — the user's display name"
      - "sub (subject) — a stable, unique identifier for the user at the IdP"
      - "preferred_username — the user's login name"
    correct_answer: 2
    explanations:
      correct: "The 'sub' (subject) claim is a stable, unique identifier assigned by the IdP for a specific user. It is guaranteed not to change and is unique per user per IdP. Email addresses and usernames can change; sub should be used as the primary key for linking IdP identity to application records."
      incorrect:
        - "Email addresses can change (e.g., name change, domain migration) and are not suitable as stable identity keys."
        - "Display names are not unique and can change; they should never be used as identity keys."
        - "The 'sub' claim is correct — it is the OIDC-defined stable unique identifier for user identity."
        - "preferred_username is not guaranteed unique or stable across identity providers; it is a display hint."
    difficulty: "medium"
    tags: ["OIDC", "JWT", "identity-claims", "federation"]

  - id: q-d5-085
    domain: domain5
    question: "A compromised application service account has write access to the production database. The attacker uses this account to exfiltrate 2 million customer records. Which IAM control would have MOST directly limited the impact of this compromise?"
    options:
      - "Enabling multi-factor authentication on the service account"
      - "Implementing account lockout after 5 failed login attempts"
      - "Applying least privilege so the service account has only the minimum necessary database permissions"
      - "Requiring the service account to authenticate using a hardware token"
    correct_answer: 2
    explanations:
      correct: "Least privilege on the service account would have limited what the attacker could do after compromising it. If the account only had SELECT permissions on the specific tables needed for the application's function, the attacker could not exfiltrate data from tables outside that scope. Least privilege is the direct blast radius control."
      incorrect:
        - "Service accounts cannot interactively use MFA; MFA would prevent the service from functioning and is architecturally inapplicable."
        - "Account lockout applies to interactive authentication with login attempts; service account API calls typically don't trigger lockout and attacker's single connection session would not be affected."
        - "Least privilege limiting database permissions is correct — it directly constrains what the compromised account can access."
        - "Hardware tokens require interactive authentication; service accounts use API keys or certificates and cannot use hardware tokens."
    difficulty: "medium"
    tags: ["least-privilege", "service-accounts", "blast-radius", "data-breach"]

  - id: q-d5-086
    domain: domain5
    question: "What is the primary security purpose of certificate revocation, and which mechanism provides the most real-time revocation checking?"
    options:
      - "Certificate revocation prevents expired certificates from being used; CRL distribution points (CDP) provide real-time checking"
      - "Certificate revocation invalidates certificates before their scheduled expiration; OCSP (Online Certificate Status Protocol) provides near-real-time status"
      - "Certificate revocation is used to update certificate information; OCSP Stapling reduces CA load"
      - "Certificate revocation prevents certificate reuse; CT logs verify revocation status"
    correct_answer: 1
    explanations:
      correct: "Revocation invalidates a certificate before its NotAfter date — typically due to key compromise, employee termination, or CA compromise. OCSP provides near-real-time status for individual certificates (unlike CRLs which are downloaded in bulk and may be hours old). OCSP Stapling further improves this by having the server cache the OCSP response."
      incorrect:
        - "CRLs are distributed periodically (often 24-hour validity) and may be many megabytes; they are not real-time. OCSP provides fresher status."
        - "OCSP for near-real-time revocation status is correct — this is the purpose of revocation and the standard mechanism."
        - "Revocation does not update certificate information; new certificates must be issued if information changes."
        - "Certificate Transparency logs record certificate issuance for auditing; they do not provide revocation status."
    difficulty: "medium"
    tags: ["certificate-revocation", "OCSP", "CRL", "PKI"]

  - id: q-d5-087
    domain: domain5
    question: "An organization's Active Directory uses a single forest with multiple domains. A user in the 'US' domain accesses a resource in the 'EU' domain. What Kerberos mechanism enables cross-domain authentication without requiring the user to have a separate EU domain account?"
    options:
      - "Kerberos protocol transition"
      - "Cross-realm trust — the KDC provides a referral ticket for the target domain"
      - "NTLM fallback authentication"
      - "LDAP passthrough authentication"
    correct_answer: 1
    explanations:
      correct: "In Kerberos cross-realm authentication, when a user requests access to a resource in a different realm (domain), their KDC issues a cross-realm TGT (referral ticket) for the target domain's KDC. The user presents this referral to the target KDC to obtain a service ticket for the resource. Forest trusts in AD enable this automatically."
      incorrect:
        - "Protocol transition (S4U2Self) allows a service to obtain a Kerberos ticket on behalf of a user — it is about impersonation, not cross-domain auth."
        - "Cross-realm trust with KDC referral tickets is correct — this is the standard Kerberos mechanism for cross-domain resource access."
        - "NTLM is a fallback when Kerberos fails; it is not the preferred mechanism and does not use the Kerberos ticket infrastructure."
        - "LDAP passthrough is not a Kerberos authentication mechanism; LDAP is used for directory queries, not Kerberos ticket exchange."
    difficulty: "hard"
    tags: ["Kerberos", "cross-realm", "Active-Directory", "forest-trust"]

  - id: q-d5-088
    domain: domain5
    question: "An organization's access request system requires the requester's manager to approve access, and then a second approval from the data owner. This two-layer approval process implements which security principle?"
    options:
