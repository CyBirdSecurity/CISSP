  - id: q-d5-096
    domain: domain5
    question: "An organization discovers that a former employee's Active Directory account, disabled upon termination, still has an active Azure AD (Entra ID) session and can access Microsoft 365 resources. What explains this discrepancy?"
    options:
      - "Azure AD does not inherit account disable status from on-premises AD in hybrid environments"
      - "OAuth access tokens can remain valid until expiration even after account disablement"
      - "The Microsoft 365 license was not revoked, allowing continued access"
      - "Azure AD Connect synchronization has a delay allowing continued access"
    correct_answer: 1
    explanations:
      correct: "In OAuth/OIDC-based access, access tokens are bearer tokens valid until expiration regardless of account status changes. Disabling an account may prevent new token issuance but does not invalidate existing short-lived access tokens (typically 60-90 minutes). For immediate revocation, refresh token revocation and Continuous Access Evaluation (CAE) are required."
      incorrect:
        - "Azure AD does receive disable signals from on-premises AD via Azure AD Connect, though with synchronization delay."
        - "Access token lifetime independent of account status is correct — this is a fundamental OAuth token lifecycle issue."
        - "License revocation prevents future access but existing session tokens may still be valid."
        - "Azure AD Connect synchronization delay (typically 30 min) is a factor but doesn't fully explain ongoing sessions."
    difficulty: "hard"
    tags: ["OAuth", "token-revocation", "hybrid-identity", "offboarding"]

  - id: q-d5-097
    domain: domain5
    question: "What is 'entitlement creep' in the context of cloud IAM, and what control is most effective at preventing it?"
    options:
      - "The gradual accumulation of cloud permissions exceeding what workloads need; mitigated by just-in-time access"
      - "The unauthorized use of cloud entitlements by attackers; mitigated by MFA on cloud consoles"
      - "The slow degradation of IAM policies over time; mitigated by policy versioning"
      - "The proliferation of IAM roles across cloud accounts; mitigated by role consolidation reviews"
    correct_answer: 0
    explanations:
      correct: "Cloud IAM entitlement creep occurs when workloads, users, or roles accumulate permissions over time as requirements change but old permissions are never removed. This creates excessive standing privileges. JIT access combined with regular access reviews using tools like AWS IAM Access Analyzer prevents and detects this accumulation."
      incorrect:
        - "Gradual permission accumulation mitigated by JIT and access reviews is correct — this is the cloud-specific manifestation of privilege creep."
        - "Unauthorized use by attackers is a consequence of entitlement creep, not its definition; MFA is relevant but not the primary prevention."
        - "Policy degradation is not what entitlement creep describes; it is about permission accumulation, not policy quality."
        - "Role proliferation ('role explosion') is a related but distinct problem from entitlement accumulation."
    difficulty: "medium"
    tags: ["entitlement-creep", "cloud-IAM", "least-privilege", "access-reviews"]

  - id: q-d5-098
    domain: domain5
    question: "Which NIST SP 800-63B authenticator assurance level (AAL) requires multi-factor authentication with a cryptographic device (e.g., hardware security key), providing phishing resistance?"
    options:
      - "AAL1 — single factor, any authenticator type"
      - "AAL2 — multi-factor, including software authenticators"
      - "AAL3 — hardware-based multi-factor with verifier impersonation resistance"
      - "AAL4 — government-issued cryptographic hardware token"
    correct_answer: 2
    explanations:
      correct: "AAL3 (NIST SP 800-63B) requires hardware-based authenticators that provide verifier impersonation resistance (phishing resistance). The authenticator must be bound to the specific relying party, preventing credential use on lookalike phishing sites. Hardware FIDO2 keys meet AAL3 requirements."
      incorrect:
        - "AAL1 requires only single-factor authentication; any authenticator including memorized secrets qualifies."
        - "AAL2 requires multi-factor but allows software authenticators (TOTP apps, push notifications) that are not phishing-resistant."
        - "AAL3 with hardware MFA and phishing resistance is correct — it is the highest defined AAL in NIST SP 800-63B."
        - "AAL4 is not a defined level in NIST SP 800-63B; AAL3 is the highest level."
    difficulty: "hard"
    tags: ["NIST-800-63B", "AAL", "phishing-resistance", "authenticator-assurance"]

  - id: q-d5-099
    domain: domain5
    question: "A security engineer is designing API authentication for a public-facing REST API. The API must authenticate individual users (not applications) and authorize access to specific resources. Which OAuth 2.0 grant type with which extension best fits this requirement?"
    options:
      - "Client credentials grant — most efficient for user API access"
      - "Authorization code grant with PKCE and OpenID Connect for user authentication and authorization"
      - "Resource owner password credentials grant for direct username/password API access"
      - "Implicit grant for the simplest token delivery to API consumers"
    correct_answer: 1
    explanations:
      correct: "Authorization code with PKCE (Proof Key for Code Exchange) protects against authorization code interception for public clients. Adding OpenID Connect provides user authentication (ID token) while OAuth provides authorization (access token). This is the current best practice for user-delegated API access."
      incorrect:
        - "Client credentials authenticates applications, not individual users — inappropriate when user identity matters."
        - "Authorization code + PKCE + OIDC is correct — it provides secure user authentication and authorization for API access."
        - "Resource owner password credentials (ROPC) requires passing user credentials directly to the client, violating the OAuth design principle of not exposing credentials to third parties. Deprecated by OAuth 2.1."
        - "Implicit grant is deprecated due to token exposure in URL fragments; modern applications use authorization code with PKCE instead."
    difficulty: "hard"
    tags: ["OAuth2", "PKCE", "OIDC", "API-authentication"]

