    correct_answer: 2
    explanations:
      correct: "If the IdP is compromised, the attacker can forge authentication assertions for any user to any SP that trusts this IdP. This is the fundamental risk of federated identity — all trusting parties inherit the IdP's risk profile. This is called 'IdP compromise blast radius'."
      incorrect:
        - "The attacker can forge assertions for any SP in the trust relationship, not just those with active sessions."
        - "Protocol compatibility is irrelevant; if the IdP can issue assertions for a protocol, the attacker can forge them."
        - "All trusting SPs are at risk — correct — because the attacker controls the assertion-issuing authority."
        - "Active session tokens can be invalidated; the greater risk is that new forged assertions can be issued for any SP."
    difficulty: "medium"
    tags: ["federation", "IdP", "SSO", "trust-relationships"]

