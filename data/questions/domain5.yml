  - id: q-d5-069
    domain: domain5
    question: "An organization implements Attribute-Based Access Control (ABAC) using policies like 'grant access if user.department=Finance AND resource.classification=Confidential AND time.hour BETWEEN 8 AND 18'. Which technology standard is commonly used to express and evaluate these ABAC policies?"
