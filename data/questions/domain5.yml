      incorrect:
        - "DCSync does not require brute-forcing; it uses legitimate replication APIs with compromised high-privilege credentials."
        - "Exploiting the replication protocol to extract hashes remotely is correct — this is what DCSync does, as implemented in Mimikatz's 'lsadump::dcsync' command."
