      incorrect:
        - "SAML carries identity attributes but is not designed for policy evaluation and enforcement logic."
        - "XACML is correct — it is the standard policy language for ABAC with PEP/PDP architecture."
        - "OAuth 2.0 scopes provide coarse-grained authorization based on pre-defined permission sets, not dynamic attribute-based evaluation."
