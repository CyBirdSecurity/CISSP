  - id: q-d5-064
    domain: domain5
    question: "A developer implements an OAuth 2.0 flow for a single-page application (SPA) and uses the implicit grant type. Why is this considered insecure by modern security standards (RFC 9700)?"
    options:
      - "Implicit grant does not support refresh tokens, causing poor user experience"
      - "Access tokens are returned in the URL fragment, exposing them in browser history and referrer headers"
      - "Implicit grant requires client secrets that cannot be secured in browser-side code"
      - "Implicit grant does not support PKCE, making it incompatible with public clients"
    correct_answer: 1
    explanations:
      correct: "In the implicit grant, the access token is returned directly in the URL fragment after redirect. This exposes tokens in browser history, server logs, referrer headers, and to JavaScript on the page. Modern OAuth 2.0 best practices (RFC 9700) mandate authorization code with PKCE for SPAs instead."
      incorrect:
        - "Lack of refresh token support is a usability issue but not the primary security concern driving its deprecation."
        - "URL fragment token exposure is correct — tokens appear in browser-accessible locations where they can be stolen."
        - "The implicit grant was specifically designed for public clients without client secrets; this is by design, not the security flaw."
        - "PKCE is used with authorization code grant; its absence in implicit grant is secondary to the token exposure issue."
