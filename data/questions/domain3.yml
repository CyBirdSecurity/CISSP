        - "Economy of mechanism (Saltzer and Schroeder) advocates for simple, small security mechanisms to enable complete analysis and reduce implementation errors."
        - "Psychological acceptability states that security mechanisms should be designed so they are easy enough to use that users don't circumvent them. This addresses usability, not simplicity of the mechanism itself."
        - "Open design (Kerckhoffs's principle applied broadly) states that the security of a mechanism should not depend on secrecy of its design. This is a separate principle from economy of mechanism."
