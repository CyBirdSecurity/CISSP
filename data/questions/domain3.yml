      - "Factoring the product of two large prime numbers"
      - "Solving elliptic curve discrete logarithm problems"
      - "Finding collisions in cryptographic hash functions"
    correct_answer: 1
    explanations:
      correct: "RSA security is based on the integer factorization problem — it is computationally easy to multiply two large prime numbers (p × q = n), but computationally infeasible to reverse the operation (factor n to find p and q) with sufficiently large numbers. The public key includes n; the security relies on the inability to factor n into its prime components."
      incorrect:
