      incorrect:
        - "This is the correct answer — it combines a compensating control with formal risk acceptance and a review date."
        - "Bare acceptance with no compensating control leaves the exposure entirely unmitigated when isolation is readily achievable."
        - "Disconnecting the controller would halt production, which is an availability impact almost certainly exceeding the risk being addressed. Security decisions must weigh business impact."
