      - "An attacker records and replays a complete TLS session; best prevented by certificate pinning"
    correct_answer: 1
    explanations:
      correct: "A replay attack captures a legitimate authentication message (login token, signed request, Kerberos ticket) and retransmits it to gain unauthorized access without needing to break the cryptography. Defenses use time-limiting mechanisms: nonces (random values used once per transaction), timestamps (rejecting messages older than a defined window), or sequence numbers (detecting out-of-order or duplicate messages). Kerberos uses timestamps; TLS uses session nonces."
      incorrect:
        - "Two-factor authentication improves authentication security but does not prevent replay of a captured valid authentication message. An attacker replaying a valid MFA token within its validity window would still succeed without anti-replay mechanisms."
        - "Replay attacks involve retransmitting captured valid messages; nonces, timestamps, or sequence numbers prevent this by binding messages to a specific time or transaction context."
        - "Cipher mode selection (AES-GCM vs. AES-CBC) affects confidentiality and integrity of data content, not session-level replay protection. The issue is replaying the entire valid message, not decrypting encrypted traffic."
        - "Certificate pinning addresses server impersonation by verifying the server certificate is expected. It does not prevent capturing and replaying valid client authentication messages."
