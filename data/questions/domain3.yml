  - id: q-d3-118
    domain: domain3
    question: "An application team reports that their system checks whether a file exists and is writable, then opens and writes to it a moment later. A reviewer flags this as a security defect. What vulnerability class is being described, and what is the correct fix?"
    options:
      - "A TOCTOU race condition; perform the operation atomically rather than checking and then acting separately"
      - "A buffer overflow; add bounds checking before the write"
      - "An injection flaw; sanitize the filename before use"
      - "An information disclosure flaw; suppress the error message on failure"
    correct_answer: 0
    explanations:
      correct: "Time-of-check to time-of-use is a race condition where state changes between validation and use. An attacker can replace the file with a symbolic link in the interval. The fix is to perform the operation atomically — open the file and operate on the resulting handle rather than re-resolving the path."
      incorrect:
        - "This is the correct answer — checking a condition and acting on it as separate steps creates an exploitable window."
        - "A buffer overflow involves writing past allocated memory boundaries, which is not what the check-then-act pattern describes."
        - "Injection involves untrusted input being interpreted as commands. The defect here is the timing gap, not input interpretation."
        - "This is not primarily an information disclosure issue, and suppressing errors would obscure the problem rather than address the race."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["TOCTOU", "race condition", "secure coding"]

