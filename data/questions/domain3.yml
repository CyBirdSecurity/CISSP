      incorrect:
        - "IVs are not master keys — they do not derive other keys. Session keys are derived through key exchange protocols or KDFs. IVs provide initialization uniqueness for block cipher modes."
        - "An IV provides uniqueness to each encryption operation, preventing identical plaintexts from producing identical ciphertexts and enabling safe key reuse across multiple messages."
        - "Data integrity verification is provided by MACs (Message Authentication Codes) or digital signatures. IVs are part of the encryption process, not authentication tags."
