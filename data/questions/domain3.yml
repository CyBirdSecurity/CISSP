  - id: q-d3-111
    domain: domain3
    question: "A manufacturing plant's engineers report that a legacy programmable logic controller cannot be patched because the vendor no longer exists, and replacing it would require a multi-month production shutdown. What is the MOST appropriate risk response?"
    options:
