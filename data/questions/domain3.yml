  - id: q-d3-114
    domain: domain3
    question: "A software vendor's product uses a random number generator seeded from the system clock to produce session tokens. A researcher demonstrates that tokens generated within the same second are predictable. What is the correct remediation?"
    options:
      - "Replace the generator with a cryptographically secure pseudorandom number generator seeded from a high-entropy source"
      - "Increase the token length while keeping the existing generator"
      - "Hash the generated token with SHA-256 before issuing it"
      - "Reduce the session timeout so predictable tokens expire quickly"
    correct_answer: 0
    explanations:
      correct: "The defect is insufficient entropy in the generator itself. Only replacing it with a CSPRNG seeded from a genuine high-entropy source produces unpredictable tokens. Everything else treats the symptom."
      incorrect:
        - "This is the correct answer — the root cause is a predictable entropy source, and only replacing it resolves the flaw."
        - "A longer token derived from a predictable seed is still predictable. Length does not create entropy that was never there."
        - "Hashing a predictable input produces a predictable output. An attacker who can guess the seed can compute the same hash."
        - "Shortening the window reduces exposure but leaves tokens predictable within it, which is a compensating control rather than a fix."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["cryptography", "randomness", "session management"]

  - id: q-d3-115
