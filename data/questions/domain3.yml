    cognitive_level: "applied"
    tags: ["encryption", "least privilege", "architecture"]

  - id: q-d3-107
    domain: domain3
    question: "An organization's security architect is reviewing a system that processes both classified and unclassified data on the same hardware. Users cleared only for unclassified data must never be able to infer the existence of classified records. Which security model directly addresses this requirement?"
    options:
      - "Bell-LaPadula with polyinstantiation"
      - "Biba integrity model"
      - "Clark-Wilson well-formed transactions"
      - "Brewer-Nash Chinese Wall model"
    correct_answer: 0
    explanations:
      correct: "Bell-LaPadula enforces confidentiality through no-read-up and no-write-down, and polyinstantiation extends it by maintaining multiple versions of a record at different classification levels. This prevents the inference that would occur if a low-clearance query returned an access-denied message confirming a classified record exists."
      incorrect:
        - "Bell-LaPadula with polyinstantiation is the correct answer — it is the combination specifically designed to prevent inference from denial messages."
        - "Biba protects integrity, preventing improper modification. The requirement here is confidentiality and preventing inference, which Biba does not address."
        - "Clark-Wilson enforces integrity through well-formed transactions and separation of duties in commercial systems, not multilevel confidentiality."
        - "Brewer-Nash prevents conflicts of interest by blocking access to competing datasets after an initial choice. It is not designed for multilevel classification inference."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["security models", "Bell-LaPadula", "polyinstantiation"]

  - id: q-d3-108
    domain: domain3
    question: "A financial services firm is selecting a cryptographic approach for a system that must let auditors verify a transaction log has not been altered, while ensuring no one — including administrators — can produce a valid log entry attributed to another party. Which combination BEST meets both requirements?"
    options:
      - "Hash chaining of log entries combined with digital signatures using per-party private keys"
      - "AES-256 encryption of the log file with a key held by the audit team"
      - "HMAC over each entry using a single shared organizational key"
      - "Storing the log on write-once media with restricted physical access"
    correct_answer: 0
    explanations:
      correct: "Hash chaining makes any alteration of an earlier entry detectable because it breaks every subsequent link, satisfying the integrity verification requirement. Digital signatures with per-party private keys provide non-repudiation, so an entry can only have been produced by the holder of that specific private key."
      incorrect:
        - "This is the correct answer — chaining provides tamper evidence and per-party signatures provide attribution."
        - "Encryption provides confidentiality, not integrity verification or attribution. An administrator with the key could still alter and re-encrypt entries undetectably."
        - "A single shared HMAC key means every party who can verify entries can also forge them, which defeats non-repudiation entirely."
        - "Write-once media provides strong tamper resistance but no cryptographic attribution — it cannot prove which party authored a given entry."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["cryptography", "non-repudiation", "integrity"]

  - id: q-d3-109
    domain: domain3
    question: "During a design review, an engineer proposes storing a symmetric encryption key inside the application's compiled binary because 'the binary is not distributed to customers.' What is the MOST accurate assessment of this proposal?"
    options:
      - "It is inadequate because the key cannot be rotated without redeploying, and anyone with access to the binary or memory can extract it"
      - "It is acceptable because compiled binaries obfuscate the key sufficiently"
