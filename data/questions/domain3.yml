  - id: q-d3-092
    domain: domain3
    question: "An HMAC (Hash-based Message Authentication Code) provides which security properties that a plain hash of the same message does NOT provide?"
    options:
      - "Collision resistance and one-way function properties"
      - "Authentication and integrity verification — proving the message came from a party with knowledge of the secret key"
      - "Encryption and confidentiality of the message content"
      - "Non-repudiation through a public key infrastructure binding"
    correct_answer: 1
    explanations:
      correct: "A plain cryptographic hash provides integrity (any change to the message changes the hash) but not authentication (anyone can compute a hash). An HMAC incorporates a shared secret key into the hashing process using a specific construction (HMAC = H(K XOR opad || H(K XOR ipad || message))). Only parties with knowledge of the secret key can produce or verify the correct HMAC, providing message authentication in addition to integrity."
      incorrect:
        - "Both plain hashes and HMACs provide collision resistance and one-way properties. These are properties of the underlying hash function, not specifically advantages of HMAC over plain hashing."
        - "HMAC adds authentication (proving the message came from a key holder) to the integrity property of plain hashing — this is the critical security property that distinguishes HMAC from plain hashes."
        - "Neither plain hashes nor HMACs provide encryption or confidentiality. To protect message contents, encryption (AES-GCM, for example) is required in addition to MAC operations."
        - "Non-repudiation through PKI requires digital signatures with asymmetric keys. HMACs use shared symmetric keys — they cannot provide non-repudiation because both parties know the key."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["cryptography", "HMAC", "authentication", "integrity"]

