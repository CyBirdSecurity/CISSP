      - "It is inadequate solely because symmetric encryption should never be used for this purpose"
    correct_answer: 0
    explanations:
      correct: "Hardcoded keys cannot be rotated without a full rebuild and redeployment, which means a suspected compromise cannot be remediated quickly. The key is also recoverable by anyone who can read the binary or dump process memory. Keys belong in a key management system or hardware security module."
      incorrect:
        - "This is the correct answer — the failure is both operational (no rotation) and technical (trivial extraction)."
        - "Compilation is not obfuscation and certainly not protection. Extracting string and key material from a binary is a routine reverse-engineering task."
        - "Filesystem encryption protects the binary at rest but does nothing once the application is running and the key is in memory."
        - "Symmetric encryption is entirely appropriate for bulk data protection. The problem is key management, not the choice of algorithm class."
