  - id: q-d3-089
    domain: domain3
    question: "What is 'security by obscurity' and why is it considered insufficient as a security strategy?"
    options:
      - "Hiding sensitive data in encrypted form is called security by obscurity — it is insufficient because encryption can be broken"
      - "Relying solely on the secrecy of system design or implementation details as the primary security mechanism — insufficient because once the secret is discovered, all security fails"
      - "Using obfuscated code to protect software intellectual property — insufficient for security but acceptable for IP protection"
      - "Deploying honeypots to mislead attackers — insufficient as attackers eventually identify and bypass them"
    correct_answer: 1
    explanations:
      correct: "Security by obscurity relies on keeping the design, implementation, or configuration of a security system secret as the primary security mechanism. This violates Kerckhoffs's principle, which states that a system should be secure even if everything about it except the key is public knowledge. Once the secret is discovered (through reverse engineering, insider disclosure, or vulnerability research), all security evaporates. Obscurity may be a supplementary layer but not a foundation."
      incorrect:
        - "Storing data in encrypted form is the opposite of obscurity — it relies on mathematical key security, not secrecy of the protection mechanism. Kerckhoffs's principle endorses this approach."
        - "Security by obscurity relies on secrecy of system design as the primary security mechanism — insufficient because discovery of the secret eliminates all security."
        - "Code obfuscation for IP protection is a commercial consideration, not a security strategy in the security sense. Even for IP protection, obfuscation alone is generally insufficient and is separate from information security."
        - "Deception technologies (honeypots, decoys) are legitimate security controls that serve detection purposes — they are not 'security by obscurity' in the traditional sense."
