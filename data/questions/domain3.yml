        - "A properly designed HSM is specifically built so that keys cannot be extracted, including by the vendor. That property is the reason a backup strategy is required."
        - "Loss of the CA key does not decrypt TLS sessions, particularly where forward secrecy is used. The impact is on issuance and trust management."
