    cognitive_level: "recall"
    tags: ["physical-security", "fire-suppression", "availability", "datacenter"]

  - id: q-d3-105
    domain: domain3
    question: "What is the 'Clark-Wilson' integrity model's primary mechanism for ensuring data integrity in commercial systems?"
    options:
      - "Using security labels and mandatory access control to prevent unauthorized data modifications"
      - "Requiring all data modifications to occur through certified transformation procedures and enforcing separation of duties through constrained data items and well-formed transactions"
      - "Implementing cryptographic hashing to verify data has not been modified between read operations"
      - "Applying the 'no read down, no write up' rules to commercial data access control"
    correct_answer: 1
    explanations:
      correct: "Clark-Wilson addresses commercial data integrity through two core mechanisms: (1) Constrained Data Items (CDIs) can only be modified through pre-validated, certified Transformation Procedures (TPs) — not through arbitrary user operations. (2) Separation of duties is enforced so that a TP that creates data cannot be the same as one that approves it. Together, these ensure all modifications go through validated, controlled procedures — modeling business controls like double-entry bookkeeping and approval workflows."
      incorrect:
        - "Security labels and mandatory access control are features of the Bell-LaPadula model (for confidentiality) and military MAC systems — not Clark-Wilson's mechanism."
        - "Clark-Wilson uses certified transformation procedures and separation of duties to ensure all data modifications occur through validated workflows — this is the correct description."
        - "Cryptographic hashing detects tampering after the fact (integrity verification). Clark-Wilson proactively controls how modifications occur through certified procedures, not post-hoc verification."
        - "'No read down, no write up' rules describe the Biba integrity model — not Clark-Wilson. Clark-Wilson uses transformation procedures and separation of duties, not Biba's lattice-based rules."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["security-models", "Clark-Wilson", "integrity", "commercial"]

  - id: q-d3-106
    domain: domain3
    question: "A hospital is deploying a new medical imaging system. The vendor states the system stores patient images on an encrypted volume, but the application service account has read access to every image regardless of which physician requested it. What is the MOST significant weakness in this design?"
    options:
      - "Encryption at rest does not protect against an attacker who compromises the application layer"
      - "The encryption algorithm has not been validated against FIPS 140"
      - "Encrypted volumes reduce system performance for large imaging files"
      - "The vendor has not provided a key escrow arrangement"
    correct_answer: 0
    explanations:
      correct: "Full-volume encryption protects data only against offline threats such as stolen disks. Because the application has standing authorized access to all images, any compromise of the application reads plaintext data through legitimate channels. The missing control is least privilege and access mediation at the application layer, not stronger encryption."
      incorrect:
        - "This is the correct answer — the encryption is doing nothing to constrain an authorized-but-overbroad application identity."
        - "FIPS validation matters for regulated cryptographic implementations, but even a perfectly validated algorithm would not restrict what the over-privileged service account can read."
        - "Performance is an engineering consideration, not the most significant security weakness in a design granting blanket access to patient data."
        - "Key escrow addresses key recovery and availability. It does not address the fact that the application can decrypt everything by design."
