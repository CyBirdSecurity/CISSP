      - "Key length determines the size of the key space; longer keys increase brute-force resistance; NIST recommends 128-bit minimum, 256-bit for long-term security"
      - "Key length affects only the number of rounds in block cipher operation; NIST recommends 192-bit as optimal"
      - "Key length is standardized at 56 bits by NIST for backward compatibility with legacy DES implementations"
    correct_answer: 1
    explanations:
      correct: "Key length determines the key space size (2^n possible keys). Doubling the key length squares the number of possible keys, exponentially increasing brute-force attack resistance. NIST recommends 128-bit minimum for AES in general use, providing 2^128 possible keys — computationally infeasible to brute-force. For long-term security (protecting data for decades or against future quantum computers), 256-bit AES keys are recommended."
      incorrect:
        - "Key length affects security, not just performance. 64-bit keys (DES-era) are insecure by modern standards — brute-force attacks are computationally feasible. NIST recommends 128-256 bit keys."
        - "Key length determines key space size; NIST recommends 128-bit minimum, 256-bit for long-term security — this correctly describes both the significance and the NIST recommendation."
        - "Key length is not synonymous with cipher rounds. AES number of rounds (10 for 128-bit, 12 for 192-bit, 14 for 256-bit) relates to key length but key length's primary security significance is key space size."
        - "DES used 56-bit keys, which are now insecure. NIST deprecated DES decades ago. The current standard is AES with 128, 192, or 256-bit keys."
