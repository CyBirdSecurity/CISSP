  - id: q-d2-078
    domain: domain2
    question: "What is 'data sovereignty' and why is it a critical concern for organizations using multi-region cloud providers?"
    options:
      - "The right of data subjects to access and correct their personal information"
      - "The legal principle that data is subject to the laws of the country where it is physically stored or processed"
      - "An organization's exclusive ownership rights over all data it collects or generates"
      - "The encryption standard required to protect data crossing international borders"
