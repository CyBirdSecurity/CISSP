      incorrect:
        - "Public classification means the data can be freely shared externally. Contract pricing visible only to executives is clearly not public information — disclosure could harm the organization competitively."
        - "Internal classification is for general employee consumption. Executive-only contract pricing requires more restrictive classification than general internal data."
        - "Confidential (limited to specific roles with business need) is the most appropriate classification for executive-only contract pricing data."
        - "While Restricted may be technically possible, it is often reserved by organizations for regulatory data (PII, PHI, PCI) or legally classified information — competitive pricing data typically falls under Confidential in most classification schemes."
    difficulty: "medium"
    tags: ["classification", "governance", "data"]

  - id: q-d2-076
    domain: domain2
    question: "What is the primary security concern with 'data at rest' encryption using a key stored in the same location as the data?"
    options:
      - "Performance degradation due to encryption overhead reduces availability"
      - "If an attacker gains access to the storage system, they can access both the data and the encryption key"
      - "Encryption algorithms used for data at rest are weaker than those used for data in transit"
      - "Regulatory compliance requirements prohibit co-locating keys and encrypted data"
    correct_answer: 1
    explanations:
      correct: "Storing encryption keys alongside encrypted data defeats the purpose of encryption. If an attacker compromises the storage system, they can access both the ciphertext and the key needed to decrypt it. Encryption keys must be stored separately from the data they protect — ideally in a Hardware Security Module (HSM) or a dedicated key management service."
      incorrect:
        - "Performance overhead exists but is not the primary security concern with co-located keys. Modern hardware acceleration minimizes encryption performance impact."
        - "Storing the key with the data means an attacker who compromises the storage system can access both the key and the data, rendering encryption ineffective — this is the primary security concern."
        - "The same strong algorithms (AES-256) are used for data at rest and in transit. Algorithm strength is not the concern — key management is."
        - "While good practice dictates separate key storage, there is no universal regulatory prohibition specifically naming co-located key and data storage. The concern is practical security, not just compliance."
    difficulty: "medium"
    tags: ["encryption", "key-management", "data-at-rest"]

  - id: q-d2-077
    domain: domain2
    question: "Under the US government classification system, information whose unauthorized disclosure could reasonably be expected to cause 'exceptionally grave damage' to national security is classified as:"
