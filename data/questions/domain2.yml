        - "Data sovereignty is the legal principle that data is subject to the laws of the country where it is physically stored — this is the correct definition."
        - "Ownership rights are separate from sovereignty. An organization may own its data but still be subject to foreign country laws when that data crosses borders or is stored abroad."
        - "Data sovereignty is a legal/jurisdictional concept, not an encryption standard. Encryption requirements for cross-border transfer are a separate compliance consideration."
    difficulty: "medium"
    tags: ["sovereignty", "cloud", "legal", "compliance"]

  - id: q-d2-079
    domain: domain2
    question: "An organization discovers that backup tapes for payroll data have been reused for 15 years without proper inventory tracking. Which data lifecycle phase has been neglected?"
    options:
      - "Creation — the data was not properly labeled when initially recorded"
      - "Storage — the backup media was not maintained according to manufacturer specifications"
      - "Retention and archival — without inventory tracking, legal retention requirements may not be met"
