  - id: q-d2-073
    domain: domain2
    question: "A database containing medical records is classified as 'Confidential' but the organization also uses it for employee training scenarios. What data protection principle is being violated?"
    options:
      - "Data minimization — the database contains more data than necessary"
      - "Purpose limitation — the data is being used beyond its original intended purpose"
      - "Data integrity — using the data for training may corrupt the medical records"
      - "Data availability — training use may reduce availability for clinical staff"
    correct_answer: 1
    explanations:
      correct: "Purpose limitation requires that personal data be collected for specified, explicit, and legitimate purposes and not further processed in a manner incompatible with those purposes. Using real patient medical records for employee training goes beyond the clinical purpose for which the data was collected, violating purpose limitation. De-identified or synthetic data should be used for training instead."
      incorrect:
        - "Data minimization addresses collecting only what is necessary — this principle is not directly violated by using existing data for a secondary purpose."
        - "Purpose limitation is violated when data collected for one purpose (medical care) is used for a different purpose (training) without a compatible lawful basis."
        - "Using data for training does not inherently corrupt the records — data integrity addresses accuracy and completeness, not secondary use restrictions."
        - "Availability is about ensuring data is accessible when needed — training use typically does not impact availability unless it involves production system access."
    difficulty: "medium"
    tags: ["privacy", "purpose-limitation", "data-management"]

  - id: q-d2-074
    domain: domain2
    question: "Which media sanitization technique is appropriate for a solid-state drive (SSD) containing sensitive corporate data before it is donated to a school?"
    options:
      - "Degaussing, as it is the most reliable method for all storage media"
      - "Single-pass overwrite using zeros, as SSDs use NAND flash memory similar to HDDs"
      - "Cryptographic erasure or physical destruction, as SSDs have wear leveling that makes traditional overwriting unreliable"
      - "Formatting the drive using the operating system's built-in format utility"
    correct_answer: 2
    explanations:
      correct: "SSDs use NAND flash memory with wear-leveling algorithms that distribute writes across the entire storage medium — this means standard overwriting may not reach all data sectors, leaving remnant data. Cryptographic erasure (destroying the encryption key, if the drive uses encryption) or physical destruction are the most reliable methods for SSDs. NIST SP 800-88 provides guidance on this."
      incorrect:
        - "Degaussing works on magnetic media (HDDs, tapes) by disrupting magnetic fields. SSDs do not use magnetic storage and are not affected by degaussing — it provides no data sanitization for SSDs."
        - "Single-pass overwriting on SSDs is unreliable due to wear-leveling, over-provisioning, and bad block remapping. Data in these areas may not be overwritten and can be recovered. This is why NIST 800-88 recommends cryptographic erasure or destruction for SSDs."
        - "Cryptographic erasure or physical destruction is the correct approach for SSDs — wear leveling makes traditional overwriting unreliable on solid-state storage."
        - "OS-level formatting (quick or full) does not reliably erase data on SSDs. Quick format only removes file system pointers; even full format may not reach all data due to wear leveling."
    difficulty: "medium"
    tags: ["sanitization", "media", "SSD", "data-destruction"]

  - id: q-d2-075
    domain: domain2
    question: "An organization classifies data into four tiers: Public, Internal, Confidential, and Restricted. A new contract document contains pricing information visible only to executives. Which classification is MOST appropriate?"
