  - id: q-d6-085
    domain: domain6
    question: "A security engineer is reviewing a penetration test report and notices a finding rated 'Critical' with CVSS 9.8 on an isolated development server that contains only synthetic test data. Should the organization treat this with the same urgency as the same vulnerability on a production database server?"
    options:
      - "Yes — all Critical vulnerabilities must be patched within 24 hours regardless of context"
      - "No — risk is contextual; the CVSS base score does not account for asset criticality, exposure, and actual data sensitivity"
      - "Yes — CVSS scores are absolute and must not be modified by organizational context"
      - "No — vulnerabilities in development environments are always low priority"
    correct_answer: 1
    explanations:
      correct: "CVSS base scores are environment-agnostic. The same vulnerability has a very different risk profile on an isolated dev server with synthetic data versus a production database server with sensitive customer data. The CVSS Environmental score exists precisely to modify the base score for organizational context. Risk-based vulnerability management prioritizes remediation based on actual business risk, not just base CVSS scores."
      incorrect:
        - "Uniform 24-hour remediation for all Critical vulnerabilities ignores context and may allocate remediation resources inefficiently."
        - "Contextual risk adjustment based on asset criticality and data sensitivity is correct — CVSS base scores are starting points, not absolute mandates."
        - "CVSS base scores are explicitly designed to be starting points; the Environmental metric is provided for organizational context adjustment."
        - "Development environment vulnerabilities may be deprioritized relative to production, but blanket low-priority treatment is an overgeneralization."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["CVSS", "risk-prioritization", "vulnerability-management", "context"]

