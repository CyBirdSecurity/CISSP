      incorrect:
        - "Technology stack confirmation is useful for developers, not attackers; the security concern is what attackers can do with this information."
        - "Verbose error disclosing implementation details aiding targeted exploits is correct — this is an information disclosure vulnerability."
        - "Random input triggering an error response with a stack trace shows information disclosure; SQL injection would require confirming data manipulation, not just an error message."
