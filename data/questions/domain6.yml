  - id: q-d6-091
    domain: domain6
    question: "Which of the following activities is part of the 'planning and reconnaissance' phase of a penetration test per NIST SP 800-115?"
    options:
      - "Exploiting discovered vulnerabilities to gain unauthorized access"
      - "Documenting findings and providing remediation recommendations"
      - "Defining scope, rules of engagement, and gathering intelligence about the target"
      - "Escalating privileges after initial system compromise"
    correct_answer: 2
    explanations:
      correct: "NIST SP 800-115 defines four penetration testing phases: Planning (scope, authorization, rules of engagement, coordination), Discovery (reconnaissance and scanning), Attack (exploitation), and Reporting. The planning phase includes defining what is in scope, establishing legal authorization, and gathering open-source intelligence about the target."
      incorrect:
        - "Exploiting vulnerabilities is the Attack phase of NIST SP 800-115, not the planning phase."
        - "Documenting findings and recommendations is the Reporting phase, the final phase after testing."
        - "Defining scope, rules of engagement, and intelligence gathering is correct — these are Planning phase activities."
        - "Privilege escalation is a post-exploitation activity within the Attack phase."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["NIST-800-115", "penetration-testing", "planning", "reconnaissance"]

  - id: q-d6-092
    domain: domain6
    question: "An organization runs a compliance-based vulnerability scan and finds no critical vulnerabilities. A subsequent risk-based assessment finds several serious vulnerabilities the compliance scan missed. What explains this discrepancy?"
    options:
      - "Compliance-based scans use better scanning tools than risk-based assessments"
      - "Compliance scans check only what regulations require, potentially missing vulnerabilities outside the compliance scope"
      - "Risk-based assessments always generate more findings due to scope creep"
      - "Compliance scans use outdated vulnerability signatures"
    correct_answer: 1
    explanations:
      correct: "Compliance-based scanning checks only the controls and vulnerabilities specified by a regulatory framework (PCI DSS, HIPAA). Vulnerabilities outside the compliance scope — even critical ones — are not checked. Risk-based assessments prioritize by actual business risk across the full attack surface, catching what compliance-only programs miss."
      incorrect:
        - "Tool quality is not determined by assessment methodology; compliance scans may use the same scanning tools."
        - "Compliance scans checking only regulatory requirements and missing out-of-scope vulnerabilities is correct — this is the fundamental limitation of compliance-only security."
        - "Scope creep could affect any assessment; risk-based assessments find more because they look at a broader scope, not due to uncontrolled expansion."
        - "Vulnerability signature currency is not determined by whether an assessment is compliance-based or risk-based."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["compliance-scanning", "risk-based-assessment", "vulnerability-management", "compliance-gap"]

  - id: q-d6-093
    domain: domain6
    question: "A security team wants to prevent developers from committing secrets (API keys, passwords, certificates) to the code repository. Which testing control is MOST effective as a preventive measure?"
    options:
      - "Conducting quarterly code audits to find committed secrets"
      - "Implementing pre-commit hooks that scan for secrets patterns before code is committed"
      - "Requiring developers to sign an acceptable use policy about secrets management"
      - "Scanning production code repositories weekly for secrets"
    correct_answer: 1
    explanations:
      correct: "Pre-commit hooks run automatically before each commit and scan staged files for patterns matching secrets (API key formats, private key headers, tokens). This prevents secrets from ever entering the repository — far more effective than detecting them after the fact when exposure has already occurred. Tools include git-secrets, detect-secrets, and truffleHog."
      incorrect:
        - "Quarterly audits detect secrets months after exposure; they are reactive, not preventive."
        - "Pre-commit hooks scanning for secrets before commit is correct — prevention at the point of introduction is optimal."
        - "Policy without technical control relies on developer compliance; pre-commit hooks enforce policy automatically."
        - "Weekly scanning is better than quarterly but still allows up to 7 days of exposure; pre-commit hooks prevent exposure entirely."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["secrets-management", "pre-commit-hooks", "DevSecOps", "code-security"]

  - id: q-d6-094
    domain: domain6
    question: "An organization conducts penetration testing of its industrial control systems (ICS/SCADA) environment. What unique consideration applies to ICS penetration testing that differs from standard IT penetration testing?"
    options:
      - "ICS systems use the same vulnerability databases as IT systems and require identical testing approaches"
      - "Active exploitation in ICS environments risks disrupting physical processes that could cause safety incidents, requiring a more passive/careful approach"
      - "ICS penetration tests must be conducted by government-certified testers"
      - "ICS environments cannot be penetration tested and must rely solely on compliance audits"
    correct_answer: 1
    explanations:
      correct: "ICS/SCADA systems control physical processes (power grids, manufacturing, water treatment). Active exploitation that works safely against IT systems could crash PLCs, trigger emergency shutdowns, or cause physical safety incidents. ICS testing requires safety analysis, often involves passive network monitoring rather than active exploitation, and may use a separate test environment to avoid production risk."
      incorrect:
        - "ICS uses specialized protocols (Modbus, DNP3, OPC) and has different vulnerability profiles from standard IT systems; identical approaches would be inappropriate."
        - "Active exploitation risk to physical processes requiring careful passive approaches is correct — this is the defining unique consideration for ICS testing."
        - "No government certification requirement for ICS testers exists as a blanket requirement; sector-specific requirements vary."
        - "ICS environments can and should be assessed; the approach is adapted for safety, not avoided entirely."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["ICS-security", "SCADA", "OT-security", "penetration-testing"]

  - id: q-d6-095
    domain: domain6
    question: "A security assessor is evaluating an organization's patch management program. They find that critical patches (CVSS 9+) are applied within 48 hours, high patches within 7 days, and medium patches within 30 days. What is this structure an example of?"
    options:
      - "Ad hoc patching with inconsistent timelines"
      - "Risk-based patch prioritization with defined SLAs by severity"
      - "Compliance-driven patching based on regulatory requirements"
      - "Automated patching without human oversight"
    correct_answer: 1
    explanations:
      correct: "Tiered SLAs mapped to vulnerability severity (CVSS-based) represent risk-based patch prioritization — the highest-risk vulnerabilities receive the most urgent response. This structure ensures resources are allocated efficiently based on risk while maintaining accountability through defined timeframes."
      incorrect:
        - "Defined, tiered timelines per severity indicate a structured program, not ad hoc patching."
        - "Risk-based patch prioritization with defined severity SLAs is correct — this is the recommended patch management structure."
        - "Compliance-driven patching follows regulatory schedules, not CVSS severity tiers; these timelines may differ from regulatory requirements."
        - "Automated patching without oversight is a different concept; the SLA structure describes a governance framework, not automation."
    difficulty: "easy"
    cognitive_level: "applied"
    tags: ["patch-management", "SLA", "risk-based", "vulnerability-management"]

  - id: q-d6-096
    domain: domain6
    question: "A security team implements a RASP (Runtime Application Self-Protection) solution. What does RASP do that a traditional WAF cannot?"
    options:
      - "RASP operates at the network perimeter before traffic reaches the application"
      - "RASP executes inside the application and can detect and block attacks based on application context and execution flow, not just network patterns"
      - "RASP provides better SQL injection detection by analyzing database query logs"
      - "RASP replaces the need for secure coding practices by automatically fixing vulnerabilities"
    correct_answer: 1
    explanations:
      correct: "RASP instruments the application at runtime and intercepts function calls, data flows, and execution paths from inside the application. It can detect context-aware attacks that bypass WAF pattern matching (e.g., legitimate-looking requests that are actually attacks) because it sees what the application code actually does with the input, not just what the request looks like on the wire."
      incorrect:
        - "Operating at the network perimeter describes a WAF; RASP operates inside the application process."
        - "Inside-application context-aware detection blocking attacks based on actual execution is correct — this is RASP's key differentiator."
        - "WAFs and RASP both can detect SQLi patterns; RASP's advantage is context-aware detection, not database log analysis."
        - "RASP detects and blocks attacks at runtime but does not fix underlying code vulnerabilities; secure development remains necessary."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["RASP", "WAF", "runtime-protection", "application-security"]

  - id: q-d6-097
    domain: domain6
    question: "An organization's third-party risk program requires security assessments of all vendors with access to sensitive data. For a vendor with hundreds of small suppliers, assessing each individually would be cost-prohibitive. Which scalable approach best manages this risk?"
    options:
      - "Trust all third-party vendors that have SOC 2 Type II reports without additional assessment"
      - "Use standardized security questionnaires (e.g., SIG, CAIQ) with contractual security requirements and periodic right-to-audit clauses"
      - "Only assess vendors with direct network access; ignore those with data access only"
      - "Require all vendors to implement identical security controls regardless of risk level"
    correct_answer: 1
    explanations:
      correct: "Standardized questionnaires (SIG - Standard Information Gathering, CAIQ - Consensus Assessment Initiative Questionnaire) provide scalable assessment across many vendors. Combined with contractual security requirements and right-to-audit clauses, this creates a scalable third-party risk program without requiring individual deep assessments for every vendor."
      incorrect:
        - "SOC 2 reports provide valuable assurance but have scope limitations; they should inform risk decisions but not automatically waive additional assessment."
        - "Scalable questionnaires with contractual requirements and audit rights is correct — this is the standard scalable third-party risk approach."
        - "Data access provides as much risk as network access; vendors processing sensitive data must be assessed."
        - "One-size-fits-all controls ignore the different risk profiles of different vendors; risk-tiered requirements are more effective and practical."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["third-party-risk", "vendor-assessment", "supply-chain", "security-questionnaire"]

  - id: q-d6-098
    domain: domain6
    question: "A security engineer wants to verify that all TLS certificates in the organization's web infrastructure are from authorized CAs and have not been misissued. Which mechanism provides the most systematic view of all certificates issued for organizational domains?"
    options:
      - "Checking certificate expiration dates via Nagios monitoring"
      - "Certificate Transparency (CT) logs — a public record of all certificates issued by participating CAs"
      - "Reviewing CA invoices to identify all purchased certificates"
      - "Running network scans with SSL Labs grading tools"
    correct_answer: 1
    explanations:
      correct: "Certificate Transparency (RFC 6962) requires CAs to log all issued certificates in public, append-only logs. Organizations can monitor CT logs (via tools like certspotter, crt.sh, or Facebook CT monitoring) to detect unauthorized certificates for their domains — including certificates misissued by rogue or compromised CAs — even before the certificates are deployed."
      incorrect:
        - "Expiration monitoring detects expired certificates but not misissued or unauthorized certificates."
        - "CT log monitoring of the public record of all issued certificates is correct — this is the authoritative way to find all certificates for a domain."
        - "CA invoices only show certificates purchased from that specific CA; shadow IT certificates from other CAs or unauthorized issuances are missed."
        - "Network scanning finds deployed certificates but misses certificates that were issued but not yet deployed or deployed on unknown hosts."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["certificate-transparency", "PKI", "CA", "certificate-monitoring"]

  - id: q-d6-099
    domain: domain6
    question: "A security assessment report categorizes findings using DREAD scoring. What does the 'R' in DREAD stand for, and what does it measure?"
    options:
      - "Risk — the overall risk rating combining all other factors"
      - "Reproducibility — how easily the attack can be reproduced"
      - "Recoverability — how quickly the organization can recover from the attack"
      - "Reachability — the percentage of users reachable by the attack"
    correct_answer: 1
    explanations:
      correct: "DREAD (Damage, Reproducibility, Exploitability, Affected users, Discoverability) scores threat risk. Reproducibility measures how easily and consistently an attack can be executed — an attack that works 100% of the time on first attempt scores higher than one requiring specific conditions or multiple attempts."
      incorrect:
        - "Overall risk rating is the output of the DREAD model, not what 'R' specifically measures."
        - "Reproducibility measuring attack consistency is correct — this is the DREAD 'R' component."
        - "Recovery time is a business continuity metric not included in the DREAD model."
        - "Affected users is the 'A' in DREAD; 'R' specifically measures attack reproducibility."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["DREAD", "threat-modeling", "risk-scoring", "vulnerability-assessment"]

  - id: q-d6-100
    domain: domain6
    question: "An organization discovers that its CI/CD pipeline builds are pulling dependencies from public package registries (npm, PyPI). An attacker publishes a malicious package with the same name as an internal private package. The build system downloads and executes the malicious public package. This attack is called:"
    options:
      - "Supply chain poisoning via typosquatting"
      - "Dependency confusion (namespace confusion) attack"
      - "Malicious package injection via compromised registry credentials"
      - "Build pipeline remote code execution"
    correct_answer: 1
    explanations:
      correct: "Dependency confusion (discovered by Alex Birsan in 2021) exploits package managers that prioritize public registries over private ones when the same package name exists in both. An attacker publishes a public package with the same name as an organization's private package but a higher version number. The build system downloads the higher-versioned public package instead of the intended private one."
      incorrect:
        - "Typosquatting uses misspelled package names (e.g., 'reqeusts' instead of 'requests'); dependency confusion uses the exact same name as a private package."
        - "Dependency confusion exploiting public registry priority over private registries is correct — this is the specific attack vector."
        - "Compromised registry credentials would allow an attacker to modify existing packages; this attack doesn't require any credential access."
        - "Remote code execution is the consequence of the attack; 'build pipeline RCE' does not name the specific attack technique."
    difficulty: "hard"
    cognitive_level: "applied"
    tags: ["dependency-confusion", "supply-chain", "CI-CD", "package-security"]

  - id: q-d6-101
    domain: domain6
    question: "A security team is implementing threat intelligence sharing with peer organizations in their industry sector. Which standard protocol is designed for automated machine-readable threat intelligence sharing?"
    options:
      - "STIX/TAXII (Structured Threat Information eXpression / Trusted Automated eXchange of Intelligence Information)"
      - "SNMP (Simple Network Management Protocol)"
      - "OpenIOC (Open Indicators of Compromise format)"
      - "MISP (Malware Information Sharing Platform)"
    correct_answer: 0
    explanations:
      correct: "STIX is the data format standard for expressing threat intelligence (TTPs, indicators, threat actors, campaigns) in a machine-readable way. TAXII is the transport protocol for sharing STIX content between organizations and threat intelligence platforms. Together they enable automated, standardized threat intelligence exchange."
      incorrect:
        - "STIX/TAXII for standardized automated threat intelligence exchange is correct — these are the OASIS standards designed for this purpose."
        - "SNMP is a network device management protocol, not a threat intelligence sharing standard."
        - "OpenIOC is an older Mandiant-created format for expressing indicators of compromise; it predates STIX and has less industry adoption."
        - "MISP is a threat intelligence platform (tool) that can share intelligence; STIX/TAXII are the underlying standards that MISP supports."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["STIX", "TAXII", "threat-intelligence", "information-sharing"]

  - id: q-d6-102
    domain: domain6
    question: "An organization wants to assess its incident detection capability by simulating real-world attacker behavior against live security controls. This type of assessment is BEST described as:"
    options:
      - "Vulnerability assessment"
      - "Breach and Attack Simulation (BAS)"
      - "Tabletop exercise"
      - "Red team assessment"
    correct_answer: 1
    explanations:
      correct: "Breach and Attack Simulation (BAS) platforms (e.g., SafeBreach, AttackIQ, Picus) continuously simulate real attacker behaviors mapped to MITRE ATT&CK against live security controls. This tests whether controls detect and block specific techniques, providing objective, ongoing measurement of security posture without manual penetration testing effort."
      incorrect:
        - "Vulnerability assessments identify weaknesses but do not simulate attack behaviors against live controls."
        - "BAS platforms simulating real-world attacker behavior against live controls is correct — this is the definition of Breach and Attack Simulation."
        - "Tabletop exercises are discussion-based scenarios; they do not test technical controls with actual attack simulation."
        - "Red team assessments involve human testers using creative attack methods; BAS is automated and continuous, complementing but not replacing red teams."
    difficulty: "medium"
    cognitive_level: "applied"
    tags: ["BAS", "breach-attack-simulation", "security-testing", "MITRE-ATT&CK"]
