  - id: q-d6-076
    domain: domain6
    question: "A web application penetration tester discovers that changing the 'user_id' parameter in an API request from '123' to '124' returns another user's account data without any error. What vulnerability class does this represent?"
    options:
      - "SQL injection"
      - "Insecure Direct Object Reference (IDOR) / Broken Object Level Authorization (BOLA)"
      - "Mass assignment"
      - "JWT algorithm confusion"
    correct_answer: 1
    explanations:
      correct: "IDOR (also called BOLA in the OWASP API Security Top 10) occurs when an application uses user-controllable references (like user_id=124) to access objects without verifying the requester is authorized to access that specific object. This allows horizontal privilege escalation by guessing or incrementing identifiers."
      incorrect:
        - "SQL injection involves injecting SQL syntax into queries; accessing another user's record by changing an ID parameter is an authorization flaw, not SQL injection."
        - "IDOR/BOLA allowing access to another user's data by manipulating object identifiers is correct — this is the defining characteristic."
        - "Mass assignment allows setting unintended object properties via bulk parameter assignment; it is a different vulnerability class."
        - "JWT algorithm confusion exploits JWT signature verification, not object-level access control."
    difficulty: "easy"
    cognitive_level: "applied"
    tags: ["IDOR", "BOLA", "authorization", "API-security"]

