  - id: q-d6-071
    domain: domain6
    question: "A Cross-Site Request Forgery (CSRF) attack exploits which web security property?"
    options:
      - "The browser trusts all JavaScript from the same origin domain"
      - "The browser automatically includes cookies (including session tokens) in requests to sites, allowing attackers to forge requests on behalf of authenticated users"
      - "The server trusts all requests with valid HTTP headers"
      - "The application trusts all requests from the application's own IP address"
    correct_answer: 1
    explanations:
      correct: "CSRF exploits the browser's automatic inclusion of cookies in cross-origin requests. An authenticated user visiting an attacker's page triggers requests to the target application with the user's session cookie attached. The server sees a valid session cookie and processes the malicious action. CSRF tokens and SameSite cookies mitigate this."
      incorrect:
        - "Same-origin policy restricts JavaScript from reading cross-origin responses but does not prevent browsers from sending cookies in cross-origin requests — which is what CSRF exploits."
        - "Browser automatically including cookies in cross-origin requests enabling forged requests is correct — this is the CSRF mechanism."
        - "Server header trust is a different issue; CSRF exploits the session cookie mechanism, not header validation."
        - "IP-based trust is a different vulnerability category; CSRF works regardless of IP addressing."
    difficulty: "medium"
    cognitive_level: "recall"
    tags: ["CSRF", "web-security", "session-management", "cookies"]

