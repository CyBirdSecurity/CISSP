topics:
  - id: d2-t1
    domain: domain2
    number: "2.1"
    title: "Identify and Classify Information and Assets"
    summary: "Building an asset inventory and applying classification schemes so protection effort matches actual sensitivity and value."
    tags: ["asset classification", "data classification", "asset inventory"]
    key_terms: ["Asset Inventory", "Data Classification", "Sensitivity", "Asset Valuation", "Declassification", "Data Discovery"]
    sections:
      - heading: "You Can't Protect What You Haven't Inventoried"
        blocks:
          - type: paragraph
            text: "Asset security begins with knowing what you have: hardware, software, and — most importantly — information assets, wherever they live (on-prem servers, endpoints, cloud storage, third-party systems). An asset inventory is the foundation for every later control; you cannot classify, protect, or retire what you don't know exists. Shadow IT and forgotten legacy systems are common sources of breaches precisely because they fall outside the inventory and its associated controls."
      - heading: "Classification Schemes"
        blocks:
          - type: paragraph
            text: "Classification assigns each asset a sensitivity level so that protection controls scale appropriately — encrypting and tightly restricting a public marketing brochure the same way you would a trade secret wastes resources, while under-protecting the trade secret creates real risk. Government/military environments commonly use Top Secret / Secret / Confidential / Unclassified; commercial organizations commonly use schemes like Public / Internal / Confidential / Restricted."
          - type: list
            style: bullet
            items:
              - "Classification should be based on the impact of unauthorized disclosure, alteration, or loss — not on how the data 'feels' subjectively sensitive"
              - "Every classification level should have documented, corresponding handling requirements (see 2.2)"
              - "Classification is not one-time — data can be reclassified as its sensitivity changes over time (e.g. quarterly earnings become public after an announcement)"
          - type: callout
            style: tip
            text: "The exam expects you to know that data owners (not IT or security teams) are ultimately responsible for assigning classification — they understand the business value and sensitivity best."
      - heading: "Valuing Assets"
        blocks:
          - type: paragraph
            text: "Classification depends on first understanding an asset's actual value, which isn't always its purchase price. Asset valuation considers replacement/reconstruction cost (what it would cost to rebuild or reacquire), the value of what it protects or produces (a modestly-priced database server holding a company's entire customer list has value far beyond its hardware cost), liability exposure if it's compromised, and lost productivity/revenue if it's unavailable. This is the same thinking that feeds Domain 1's quantitative risk formulas (SLE = Asset Value × Exposure Factor) — accurate asset valuation is a prerequisite for accurate risk numbers downstream, not a separate exercise."
      - heading: "Reclassification and Declassification"
        blocks:
          - type: paragraph
            text: "Because classification isn't permanent, a mature program defines who can change it and under what conditions — both upgrading sensitivity (data that becomes more sensitive, e.g. after a regulation changes) and downgrading/declassifying it (data that no longer needs its original protection level, e.g. financial results after public announcement, or historical data whose sensitivity has genuinely diminished with age). Declassification should be a deliberate, documented decision by the data owner, not something that happens implicitly just because a control was relaxed or forgotten over time."
      - heading: "Automated Discovery and Classification Tools"
        blocks:
          - type: paragraph
            text: "Manually classifying every file an organization creates doesn't scale past a small environment, which is why most mature programs supplement manual owner-driven classification with automated data discovery and classification tooling — software that scans file shares, databases, and cloud storage for patterns matching sensitive data types (credit card number formats, government ID formats, health record keywords) and automatically tags or flags matches for review. This is especially important for finding sensitive data that was never properly classified in the first place — a spreadsheet of customer social security numbers saved to a general file share by an employee who never thought to apply a classification label at all. Automated tools reduce (but don't eliminate) reliance on humans remembering to classify correctly every time; the data owner remains accountable for confirming and acting on what the tooling finds."
      - heading: "Classification Review Cadence"
        blocks:
          - type: paragraph
            text: "Beyond event-driven reclassification (like a public earnings announcement), mature programs also review classifications on a periodic schedule — commonly annually for high-sensitivity data — since sensitivity can drift gradually rather than through one discrete triggering event (a competitive product roadmap that was highly sensitive at conception may be substantially less sensitive a few years after the product has shipped and iterated well past it). A classification scheme that's applied once at creation and never revisited tends to drift out of alignment with actual current sensitivity over time, in the same way policy documentation drifts if it's never reviewed (per Domain 1's documentation lifecycle content)."

  - id: d2-t2
    domain: domain2
    number: "2.2"
    title: "Information and Asset Handling Requirements"
    summary: "Translating classification levels into concrete rules for labeling, handling, storing, and transmitting each type of asset."
    tags: ["handling requirements", "labeling", "marking"]
    key_terms: ["Labeling", "Marking", "Handling Standard", "Data Owner", "Data Sovereignty", "Information Rights Management (IRM)"]
    sections:
      - heading: "From Classification to Concrete Rules"
        blocks:
          - type: paragraph
            text: "Once data is classified, a handling standard defines exactly what's required at each level: how it must be labeled/marked, where it may be stored, what encryption is required in transit and at rest, who may access it, and how it must be destroyed. Without this translation step, classification is just a label with no operational effect."
          - type: list
            style: bullet
            items:
              - "Labeling/marking — physical documents get printed classification banners; electronic files get metadata tags or headers/footers"
              - "Storage requirements — e.g. Restricted data must be stored only on encrypted, access-controlled systems, never on removable media"
              - "Transmission requirements — e.g. Confidential data may only leave the network over an encrypted channel or approved secure file transfer"
              - "Access requirements — who may view/edit each classification level, typically tied to need-to-know, not just clearance level"
          - type: callout
            style: example
            text: "A 'Restricted' handling standard might require: encrypted storage, no printing without approval, no external email without DLP review, and mandatory shredding (not just recycling) at end of life."
      - heading: "Handling Physical and Non-Digital Assets"
        blocks:
          - type: paragraph
            text: "Handling requirements aren't only about digital files — printed documents, whiteboards used to discuss sensitive projects, backup tapes, and even verbal discussions in shared spaces all need handling rules appropriate to the classification of what's being discussed or stored. A 'clean desk' policy (sensitive printed material isn't left visible/unattended) and controlled disposal of physical media (shredding rather than standard recycling for sensitive documents) are handling requirements just as much as an encryption standard is — the exam sometimes tests whether a candidate recognizes handling obligations apply beyond the purely digital realm."
      - heading: "Handling Across Borders: Data Sovereignty"
        blocks:
          - type: paragraph
            text: "Data sovereignty is the principle that data is subject to the laws of the country/jurisdiction where it's physically stored or processed, not just the laws of the organization's home country. A handling standard for data about EU residents may need to require that data stay within specific jurisdictions, or require the cross-border transfer safeguards described under GDPR in Domain 1 (Standard Contractual Clauses, adequacy decisions) — handling requirements and legal/regulatory obligations aren't separate concerns, they converge directly at this point, where a technical decision (which region a cloud provider stores data in) becomes a compliance decision."
      - heading: "Marking in Practice: A Worked Example Across Levels"
        blocks:
          - type: paragraph
            text: "A concrete, consistent marking scheme makes handling rules self-enforcing to some degree, since anyone touching the asset can immediately see what's required just by looking at it. A Public document might carry no marking at all, or an explicit 'Public' footer confirming it's cleared for release. An Internal document typically carries a footer/banner ('Internal Use Only') and is excluded from external distribution by policy. A Confidential document adds a prominent header and footer on every page, distribution restricted to named individuals or roles, and often a document control number for tracking. A Restricted (or equivalent top-tier) document adds the strictest marking — often per-page watermarking with the viewer's identity, tracked/logged access, and explicit prohibition on printing or export without separate written approval — precisely because the marking itself is a control: it makes misuse harder to claim as accidental and easier to detect."
      - heading: "Information Rights Management (IRM/DRM)"
        blocks:
          - type: paragraph
            text: "Traditional access controls stop protecting a file the moment it's legitimately opened and copied elsewhere — from that point, the classification label is just a marking with no technical enforcement behind it. Information Rights Management (sometimes called Digital Rights Management in a broader context) embeds protection directly into the file itself: even after a legitimate recipient opens a document, IRM can persistently enforce restrictions like preventing copy/paste, printing, or forwarding, and can even revoke access to a file that's already been distributed if the classification or the recipient's authorization changes later. This extends handling requirements beyond the boundary of the organization's own systems — a Confidential file shared with an external partner can still carry its handling restrictions with it, rather than becoming an unrestricted, unmanaged copy the moment it leaves the network."

  - id: d2-t3
    domain: domain2
    number: "2.3"
    title: "Provisioning Resources Securely"
    summary: "Building security into how hardware, software, and cloud resources are acquired and configured from the start."
    tags: ["provisioning", "hardening", "secure acquisition", "cloud shared responsibility"]
    key_terms: ["Secure Provisioning", "Hardening", "Baseline Configuration", "Asset Onboarding", "Shared Responsibility Model", "Golden Image"]
    sections:
      - heading: "Security Starts at Acquisition"
        blocks:
          - type: paragraph
            text: "Secure provisioning means new hardware, software, and cloud resources are configured to an approved secure baseline before they ever touch production or handle real data — not hardened as an afterthought once something has already gone live. This includes verifying the provenance of hardware/software (to avoid counterfeit or tampered components, tying back to supply chain risk in Domain 1), applying hardening baselines, and removing default credentials and unnecessary services before deployment."
          - type: list
            style: bullet
            items:
              - "Hardening — disabling unused services/ports, changing default credentials, applying vendor security guides (e.g. CIS Benchmarks)"
              - "Baseline configuration — a documented, approved starting configuration every new asset of a given type must match"
              - "Asset registration — every provisioned resource is added to the inventory (2.1) with an assigned owner and classification-appropriate controls from day one"
          - type: callout
            style: tip
            text: "In cloud environments, 'secure provisioning' extends to infrastructure-as-code templates — baking hardened configuration into the template ensures every resource spun up from it inherits the same secure baseline automatically."
      - heading: "Golden Images"
        blocks:
          - type: paragraph
            text: "A golden image is a pre-hardened, pre-approved template (a virtual machine image, container image, or full system snapshot) that new instances are provisioned from, rather than every new asset being manually hardened one at a time. This makes secure provisioning consistent and repeatable at scale — the hardening work happens once, when the golden image is built and reviewed, and every subsequent instance inherits it automatically. Golden images still need a maintenance process of their own (periodically rebuilding them with current patches, since an outdated golden image just provisions consistently outdated systems)."
      - heading: "Cloud Provisioning and the Shared Responsibility Model"
        blocks:
          - type: paragraph
            text: "In cloud environments, secure provisioning is explicitly split between the provider and the customer under the shared responsibility model, and where the line falls shifts depending on the service model: in IaaS (Infrastructure as a Service), the provider secures the underlying physical infrastructure and virtualization layer, while the customer is responsible for securely provisioning and hardening everything from the guest operating system up (patching, configuration, access control). In PaaS (Platform as a Service), the provider additionally manages the operating system and runtime, leaving the customer responsible mainly for the application and its data/configuration. In SaaS (Software as a Service), the provider manages nearly everything technical, leaving the customer responsible primarily for how they configure the application (user access, data classification/sharing settings) rather than any underlying infrastructure at all."
          - type: callout
            style: tip
            text: "A commonly tested exam framing: the customer's security responsibility shrinks as you move from IaaS to PaaS to SaaS, but it never reaches zero — even in SaaS, the customer remains responsible for identity/access configuration and how they classify and share their own data within the platform."
      - heading: "A Complete Asset Onboarding Checklist"
        blocks:
          - type: paragraph
            text: "Bringing the elements of secure provisioning together, a thorough onboarding process typically confirms: the asset was sourced through an approved, verified supplier (Domain 1's SCRM); it was built from (or matches) an approved golden image/baseline; default credentials have been changed and unnecessary services disabled; it's been assigned an owner, a classification-appropriate control set, and added to the asset inventory (2.1); it's enrolled in ongoing patch and configuration management (Domain 7); and, for anything handling sensitive data, it's been scoped correctly against relevant compliance requirements (Domain 1/2's compliance-mapping content) before it ever receives real production data. Skipping any single step tends to surface later as exactly the kind of untracked, unhardened, forgotten asset that Domain 2's opening topic warns creates outsized breach risk."
      - heading: "Looking Ahead to Decommissioning"
        blocks:
          - type: paragraph
            text: "Secure provisioning has a mirror-image counterpart at the other end of an asset's life: secure decommissioning, covered in depth as part of the information system lifecycle in Domain 3 and the sanitization/media-management content in Domain 7. It's worth flagging here because the two are symmetric — an asset that was provisioned with a documented owner and clear classification is far easier to decommission securely later (its owner, contents, and required disposal handling are already known), while an asset that was provisioned informally, without registration, often becomes exactly the kind of orphaned system that's later found still holding sensitive data long after anyone remembers it exists."

  - id: d2-t4
    domain: domain2
    number: "2.4"
    title: "Data Lifecycle Management"
    summary: "The stages data passes through from creation to destruction, and the controls appropriate at each stage."
    tags: ["data lifecycle", "data at rest", "data in transit", "data in use"]
    key_terms: ["Data at Rest", "Data in Transit", "Data in Use", "Data Lifecycle", "Sanitization", "Confidential Computing", "Data Remanence"]
    sections:
      - heading: "The Stages of the Lifecycle"
        blocks:
          - type: list
            style: numbered
            items:
              - "Create — data is generated or captured; classification should be assigned as early as possible"
              - "Store — data at rest; protected primarily through encryption, access control, and physical security"
              - "Use — data in use (actively being processed in memory); protected through techniques like memory encryption and strict access to processing systems"
              - "Share — data in transit; protected primarily through encryption (TLS, VPNs) and secure transfer protocols"
              - "Archive — data retained for compliance/business reasons but not actively used; still requires protection matching its classification"
              - "Destroy — data reaches end of retention and is sanitized/destroyed so it cannot be recovered"
          - type: paragraph
            text: "Each state — at rest, in transit, and in use — has distinct threats and therefore distinct controls. Encrypting data at rest does nothing to protect it while it's decrypted in memory during processing (data in use), which is why sensitive processing environments add controls like restricted memory access, secure enclaves, or confidential computing techniques."
      - heading: "Protecting Data in Use: Confidential Computing"
        blocks:
          - type: paragraph
            text: "Data in use has historically been the hardest state to protect, because traditional encryption must be reversed (decrypted) before a CPU can actually process the data, creating a window where it's exposed in plaintext in memory — accessible to a sufficiently privileged attacker, a compromised hypervisor, or even in some cases the cloud provider's own operators. Confidential computing addresses this using hardware-based trusted execution environments (the same enclave concept introduced in Domain 3) to process data inside a protected region where even the operating system or hypervisor can't observe it, extending meaningful protection all the way through the data-in-use stage rather than leaving it as the one unprotected gap in an otherwise fully encrypted lifecycle."
      - heading: "Data Remanence by Media Type"
        blocks:
          - type: paragraph
            text: "How thoroughly 'deleted' data can actually be recovered depends heavily on the underlying storage technology, which is why sanitization method must be matched to media type rather than applied as one universal process. On traditional magnetic hard drives, data can often be recovered even after a standard delete (which just removes the file system pointer, not the underlying bits) — overwriting (multiple passes of random or fixed patterns) or degaussing (exposing the drive to a strong magnetic field that scrambles the magnetic domains storing the data) are established, reliable methods. Solid-state drives (SSDs) complicate this significantly: wear-leveling algorithms mean the physical location the drive reports for a piece of data often isn't where it's actually stored, so a targeted overwrite command may not reach every physical copy, and traditional degaussing doesn't work at all on SSDs since they don't store data magnetically — cryptographic erasure (destroying the encryption key for a self-encrypting drive, instantly rendering all its data permanently unreadable regardless of physical remanence) or physical destruction are generally the only fully reliable sanitization methods for SSDs and other flash-based media."
          - type: callout
            style: tip
            text: "NIST SP 800-88 is the standard reference for sanitization methods and requirements, defining Clear (protects against simple, non-invasive recovery methods), Purge (protects against laboratory-grade recovery techniques), and Destroy (physically destroys the media so it can never be reused at all) as the three general sanitization categories, each appropriate to different data sensitivity levels."
      - heading: "Why Lifecycle Thinking Matters"
        blocks:
          - type: callout
            style: tip
            text: "Exam scenarios often describe a control that protects data in only one state and ask what's missing. If a scenario says data is 'encrypted on the server' but employees regularly export it to USB drives, the gap is data in transit/data leaving the controlled environment, not data at rest."

  - id: d2-t5
    domain: domain2
    number: "2.5"
    title: "Asset Retention"
    summary: "Determining how long data and assets must be kept, balancing legal/regulatory requirements against the risk of holding data too long."
    tags: ["retention", "records management", "legal hold"]
    key_terms: ["Retention Policy", "Legal Hold", "Records Management", "Data Minimization", "e-Discovery", "Defensible Deletion", "Grandfather-Father-Son"]
    sections:
      - heading: "Retention Is a Balancing Act"
        blocks:
          - type: paragraph
            text: "Retention policy defines how long each category of data/asset must be kept before disposal, driven by legal and regulatory minimums (e.g. tax records, healthcare records), business need, and litigation requirements. Retaining data longer than necessary is itself a risk — it expands the amount of sensitive data an attacker could steal, increases storage/compliance cost, and can create legal exposure (data that shouldn't exist can't be subpoenaed or breached). Retaining it for too short a time can violate regulatory minimums or destroy evidence needed for a legal matter."
          - type: list
            style: bullet
            items:
              - "Retention schedules should be defined per data category, not applied as one blanket rule organization-wide"
              - "Legal hold suspends normal disposal schedules the moment litigation is reasonably anticipated — destroying data under legal hold, even per an otherwise valid retention policy, can constitute spoliation of evidence"
              - "Data minimization (collect and keep only what's needed) reduces retention burden and risk simultaneously"
          - type: callout
            style: example
            text: "An organization with a standard 'delete emails after 2 years' policy must suspend that deletion for any custodian's mailbox once a lawsuit is filed or reasonably anticipated, even if the 2-year mark is reached during the case."
      - heading: "Retention Schedules Vary Widely by Data Type"
        blocks:
          - type: paragraph
            text: "A single organization-wide retention period is almost never appropriate, because different data categories carry very different legal minimums and business needs. Financial/tax records are frequently subject to multi-year statutory minimums (commonly cited as around seven years in many jurisdictions for core financial records). Employment records often need to be kept for a period spanning well after employment ends, to cover potential future employment-related claims. Security logs might be retained for a much shorter, operationally-driven period (e.g. 90 days to a year) unless a specific regulation or active investigation extends that. Marketing/transient data may have almost no formal retention requirement at all, and the organization's own data-minimization goals become the primary driver for how long it's kept. A well-designed retention schedule maps each meaningfully distinct data category to its own justified period, rather than defaulting everything to the strictest (or the most convenient) single number."
      - heading: "Backup Media Rotation: Grandfather-Father-Son"
        blocks:
          - type: paragraph
            text: "Retention thinking applies to backup media itself, not just the primary data. Grandfather-Father-Son (GFS) is a classic backup rotation scheme that assigns different retention periods to different backup tiers: daily backups ('son') are kept for a short period and cycled/overwritten frequently; weekly backups ('father') are kept longer, giving a mid-term recovery point; and monthly backups ('grandfather') are retained the longest, providing long-term historical recovery points without needing to keep every single daily backup indefinitely. This tiered approach balances two competing goals also seen elsewhere in retention: enough recent recovery points to support fast, granular restores (RPO-driven, per Domain 1/7), and enough long-term retention to satisfy compliance or historical-analysis needs, without the storage cost of keeping every daily backup ever made forever."

  - id: d2-t6
    domain: domain2
    number: "2.6"
    title: "Data Security Controls and Compliance Requirements"
    summary: "Selecting the right technical controls (encryption, DLP, tokenization) to satisfy both security needs and specific regulatory obligations."
    tags: ["data security controls", "encryption", "DLP", "tokenization", "compliance", "compliance frameworks"]
    key_terms: ["Encryption", "Tokenization", "Data Loss Prevention (DLP)", "Data Masking", "Scoping and Tailoring", "PCI DSS", "HIPAA", "GDPR", "FIPS 140"]
    sections:
      - heading: "Common Data Security Controls"
        blocks:
          - type: list
            style: bullet
            items:
              - "Encryption — renders data unreadable without the correct key; the baseline control for confidentiality at rest and in transit"
              - "Tokenization — replaces sensitive data with a non-sensitive substitute (a token) that has no exploitable value outside the tokenization system, commonly used for payment card data"
              - "Data masking / de-identification — obscures or removes identifying details, often used to make production data safe for use in test/development environments"
              - "Data Loss Prevention (DLP) — monitors and blocks unauthorized movement of sensitive data (e.g. blocking an email containing a credit card number pattern from leaving the network)"
          - type: callout
            style: example
            text: "Tokenization vs. encryption: an encrypted credit card number can be decrypted back to the original with the key. A token has no mathematical relationship to the original number — it can only be 'detokenized' by looking it up in a secure vault, which limits the blast radius if the token itself is stolen."
      - heading: "Where DLP Actually Watches"
        blocks:
          - type: paragraph
            text: "DLP isn't a single tool but a category deployed at different points, and each deployment point catches a different kind of exposure. Network DLP inspects traffic leaving the network (email, web uploads, file transfers) and blocks or flags matches against defined sensitive-data patterns. Endpoint DLP runs directly on user devices, able to catch attempts to copy sensitive data to a USB drive, paste it into an unapproved application, or print it — activity that never touches the network at all and so would be invisible to network DLP alone. Storage/discovery DLP (closely related to the automated classification tooling from 2.1) scans data at rest across file shares, databases, and cloud storage to find sensitive data sitting in places it shouldn't be, independent of any specific transfer attempt. A mature DLP program layers all three, since each catches a distinct category of exposure the others would miss."
      - heading: "Standardizing Cryptographic Implementations: FIPS 140"
        blocks:
          - type: paragraph
            text: "Selecting 'encryption' as a control isn't specific enough on its own — the exam distinguishes choosing a strong algorithm (Domain 3's cryptography content) from validating that a specific product's implementation of that algorithm is actually trustworthy. FIPS 140 (Federal Information Processing Standard 140, currently at revision 140-3) is the U.S. government standard for validating cryptographic modules — the physical or software component that actually performs encryption/decryption — testing not just the algorithm's correctness but the module's actual implementation, key handling, and tamper resistance, at graded security levels. Many regulated industries and government contracts require FIPS 140-validated cryptographic modules specifically, which is a meaningfully different (and stricter) requirement than simply 'uses AES' — an in-house implementation of a correct algorithm, never independently validated, does not satisfy a FIPS 140 requirement even if the underlying math is sound."
      - heading: "Mapping Controls to Compliance Requirements"
        blocks:
          - type: paragraph
            text: "Different regulations mandate different specific controls for the same underlying data — PCI DSS dictates detailed requirements for cardholder data, HIPAA for health information, GDPR for EU personal data. Rather than building a separate control set per regulation, mature programs select a strong baseline (often mapped to a framework like NIST 800-53 or ISO 27001, per Domain 1's governance-framework content) and then scope/tailor it — adding the specific extra controls a given regulation requires on top of the shared baseline, rather than maintaining entirely parallel programs."
          - type: list
            style: bullet
            items:
              - "PCI DSS — the most prescriptive of the three about specific technical controls: it names concrete requirements such as strong cryptography for stored and transmitted cardholder data, network segmentation to isolate the cardholder data environment, quarterly vulnerability scans, and strict limits on how long certain card data elements may be retained at all"
              - "HIPAA — organizes its requirements as administrative, physical, and technical safeguards rather than naming specific products or algorithms; many technical safeguards (like encryption) are 'addressable' rather than strictly 'required,' meaning an organization must implement them or formally document an equivalent alternative control and the reasoning, rather than being free to simply skip them"
              - "GDPR — even less prescriptive about specific technical controls than HIPAA; it requires 'appropriate technical and organizational measures' proportionate to risk, explicitly naming pseudonymization and encryption only as examples, and leaves the organization to justify why its chosen controls are adequate for the actual risk — which places more of the compliance burden on documented risk assessment and justification than on meeting a fixed checklist"
          - type: callout
            style: tip
            text: "This is a useful spectrum to remember for the exam: PCI DSS is the most prescriptive/specific about exact controls, HIPAA sits in the middle (safeguard categories with some named but 'addressable' specifics), and GDPR is the most risk-based/principles-driven, asking for 'appropriate' measures rather than naming a fixed control list — mirroring the same prescriptive-vs-risk-based spectrum introduced for governance frameworks in Domain 1 (PCI DSS behaves like a prescriptive control catalog; GDPR behaves like a risk-based framework)."
          - type: callout
            style: example
            text: "Tokenization is a good example of a control that satisfies overlapping regulations differently: PCI DSS explicitly recognizes tokenization as a way to remove systems from compliance scope entirely (if a system only ever handles tokens, not real card numbers, it faces far fewer PCI requirements), while GDPR would evaluate the same tokenization approach more generally as one possible 'appropriate technical measure' supporting its broader risk-based pseudonymization principle — same control, evaluated through two differently-structured compliance lenses."
