topics:
  - id: d6-t1
    domain: domain6
    number: "6.1"
    title: "Designing and Validating Assessment, Test, and Audit Strategies"
    summary: "Planning a coherent program of assessments, tests, and audits so coverage matches risk instead of happening ad hoc."
    tags: ["assessment strategy", "test strategy", "audit planning"]
    key_terms: ["Assessment", "Audit", "Test Strategy", "Scope", "Rules of Engagement"]
    sections:
      - heading: "Assessment vs. Test vs. Audit"
        blocks:
          - type: paragraph
            text: "These three terms are related but distinct. An assessment is a broad evaluation of security posture (e.g. a risk assessment or vulnerability assessment) — often less formal, aimed at understanding current state. A test is a specific, hands-on technical exercise that validates whether a control actually works as intended (e.g. penetration testing, control testing). An audit is a formal, often independent review against a defined standard or requirement (regulatory, contractual, or internal policy) that produces a documented finding of compliance or non-compliance."
          - type: callout
            style: tip
            text: "The exam distinguishes these by formality and purpose: an assessment explores, a test validates, an audit certifies compliance against a standard."
      - heading: "Building a Coherent Strategy"
        blocks:
          - type: paragraph
            text: "A mature program doesn't run tests and audits randomly — it plans a strategy: which systems get tested, how often, using which methods, and why, driven by the risk assessment (Domain 1). High-value or high-risk systems (internet-facing, holding regulated data) warrant more frequent and rigorous testing than low-risk internal tools. The strategy should also define scope and rules of engagement up front — what's in bounds, what's off-limits, and what authorization has been obtained — before any technical testing begins."
      - heading: "What Drives Testing Frequency and Depth"
        blocks:
          - type: list
            style: bullet
            items:
              - "Regulatory/contractual mandate — some regimes specify minimum cadence directly (e.g. PCI DSS requiring quarterly vulnerability scans and periodic penetration testing for systems in the cardholder data environment, per Domain 2's compliance-mapping content)"
              - "Change velocity — a system that changes frequently (frequent deployments, evolving architecture) accumulates new risk faster and needs more frequent reassessment than a stable, rarely-changed system"
              - "Criticality and exposure — internet-facing systems and those holding regulated/high-value data warrant deeper and more frequent testing than internal, low-sensitivity tools"
              - "Findings history — a system with a track record of recurring findings warrants closer, more frequent scrutiny until that pattern is resolved"
          - type: callout
            style: tip
            text: "Rules of engagement matter beyond just 'being nice to have documented' — testing a production system without clear authorization and defined boundaries can itself look like an attack, trigger incident response, and in the worst case create legal exposure for the tester, even when the intent was purely defensive."
      - heading: "Matching Test Type to What It Actually Validates"
        blocks:
          - type: paragraph
            text: "A well-built strategy doesn't default to the same test type everywhere — it deliberately matches technique to what actually needs validating. Compliance-driven testing exists to satisfy a specific external requirement (a PCI quarterly scan, an annual penetration test mandated by a contract) and its scope is largely defined by that requirement rather than by the organization's own judgment of risk. Assurance-driven testing exists to genuinely validate that a control works as designed, independent of any compliance checkbox, and its scope is defined by what the organization actually wants to know. The two overlap often (a rigorous compliance-driven test can also provide real assurance) but aren't guaranteed to be the same thing — a program that only ever runs the minimum testing a regulation requires, and nothing more where real risk warrants it, is optimizing for compliance rather than for security, which the exam expects you to recognize as a meaningfully different (and weaker) posture."
      - heading: "Using Threat Modeling to Scope What Gets Tested"
        blocks:
          - type: paragraph
            text: "Rather than scoping a test strategy purely around 'test everything equally' or purely around compliance mandates, mature programs use the threat modeling concepts from Domain 8 (STRIDE, attack trees, data flow diagrams) to identify which components and trust boundaries carry the most realistic attacker interest, and weight testing depth accordingly. A component that threat modeling identifies as a high-value target — one that sits on a trust boundary, handles sensitive data, or was flagged with a high-likelihood/high-impact threat during design — warrants deeper, more frequent testing than a component the same exercise rated as low-consequence, even if both are nominally in scope for the same compliance-driven test. This ties threat modeling and testing strategy together as complementary parts of the same lifecycle: modeling predicts where problems are likely to be, and testing verifies whether that prediction holds up in practice."

  - id: d6-t2
    domain: domain6
    number: "6.2"
    title: "Security Control Testing"
    summary: "Specific technical testing methods — vulnerability scanning, penetration testing, code review, and more — used to validate controls."
    tags: ["vulnerability scanning", "penetration testing", "code review", "red team"]
    key_terms: ["Vulnerability Scan", "Penetration Test", "Black Box", "White Box", "Gray Box", "Static Analysis", "Dynamic Analysis", "Red Team", "Blue Team", "Purple Team", "Fuzz Testing", "Breach and Attack Simulation"]
    sections:
      - heading: "Vulnerability Scanning vs. Penetration Testing"
        blocks:
          - type: paragraph
            text: "A vulnerability scan is an automated process that identifies known weaknesses (missing patches, misconfigurations) without actively exploiting them — breadth over depth, run frequently and cheaply. A penetration test goes further: testers actively attempt to exploit identified weaknesses to demonstrate real-world impact, showing not just that a vulnerability exists but what an attacker could actually achieve with it. Penetration tests are more resource-intensive and typically run less frequently (e.g. annually) or after significant changes."
          - type: list
            style: bullet
            items:
              - "Black box testing — tester has no prior knowledge of the internal system, simulating an external attacker"
              - "White box testing — tester has full knowledge (source code, architecture diagrams, credentials), enabling deep, thorough testing"
              - "Gray box testing — tester has partial knowledge, simulating an insider or an attacker who's already gained limited access"
      - heading: "The Phases of a Penetration Test"
        blocks:
          - type: paragraph
            text: "A structured penetration test typically moves through recognizable phases: reconnaissance (gathering information about the target, passively and/or actively), scanning/enumeration (identifying live hosts, open services, and potential vulnerabilities in more detail), exploitation (actively attempting to leverage a vulnerability to gain access), post-exploitation (once access is gained, assessing what an attacker could actually do from there — privilege escalation, lateral movement, data access — to demonstrate real business impact, not just initial entry), and reporting (documenting findings, evidence, and remediation guidance, tying into 6.4). Skipping post-exploitation is a common shortcut that understates real risk — proving initial access was possible says less than proving what an attacker could reach afterward."
      - heading: "Red Team, Blue Team, and Purple Team"
        blocks:
          - type: paragraph
            text: "A red team plays the attacker, typically with a broader, more realistic, less constrained mandate than a standard penetration test — often testing detection and response capability, not just finding vulnerabilities, and sometimes without the defenders even knowing a test is underway (unlike a scheduled, disclosed penetration test). A blue team is the defensive side — the people actually monitoring and responding to what the red team (or a real attacker) does. Purple teaming isn't a separate team so much as a collaborative exercise structure: red and blue work together in real time, sharing what's being attempted and what's being detected as it happens, specifically to improve detection capability faster than a traditional 'red team attacks, blue team is graded afterward' model would."
          - type: callout
            style: tip
            text: "The exam distinction that matters most: a standard penetration test is scoped to find and demonstrate vulnerabilities; a red team exercise is scoped to test the organization's actual detection and response capability under realistic attack conditions, which is a different (and often broader) goal."
      - heading: "Continuous Validation: Breach and Attack Simulation"
        blocks:
          - type: paragraph
            text: "Traditional penetration testing and red teaming are point-in-time exercises — accurate for the moment they're performed, but potentially stale within weeks as the environment changes. Breach and Attack Simulation (BAS) tools automate the continuous, repeated execution of known attack techniques (often mapped directly to MITRE ATT&CK, from Domain 1) against production or production-like environments, providing an ongoing signal of whether detection and prevention controls still catch known techniques, rather than relying solely on an annual snapshot. BAS doesn't replace human-led penetration testing or red teaming — it lacks the creativity and novel-technique discovery a skilled human tester brings — but it fills the gap between those periodic, expensive, human-driven exercises with continuous, automated, lower-cost validation of the basics."
      - heading: "Fuzz Testing"
        blocks:
          - type: paragraph
            text: "Fuzz testing (fuzzing) feeds a target — an application, a network service, a file parser — large volumes of malformed, unexpected, boundary-case, or entirely random input, and monitors for crashes, hangs, or other abnormal behavior that reveals an unhandled edge case an attacker could potentially exploit. Unlike vulnerability scanning (which checks for already-known signatures) or structured test cases (which check for expected, anticipated behavior), fuzzing is specifically designed to surface unknown, previously undiscovered flaws by exploring input space a human tester wouldn't think to try. It's especially effective against software that parses complex or attacker-controlled input formats (file parsers, network protocol implementations, API request bodies) where a huge, hard-to-fully-enumerate space of malformed input is exactly the kind of attack surface a determined attacker would probe manually if a fuzzer hadn't already found the crash first."
      - heading: "Code-Level and Configuration Testing"
        blocks:
          - type: paragraph
            text: "Static Application Security Testing (SAST) analyzes source code without executing it, catching insecure patterns early but potentially missing runtime-only issues. Dynamic Application Security Testing (DAST) tests a running application from the outside, like an attacker would, catching real runtime behavior but requiring a working build to test against. Configuration and compliance scanning checks systems against a hardening baseline (e.g. CIS Benchmarks). Each method has blind spots the others cover, so mature programs combine multiple testing types rather than relying on just one — the same SAST/DAST concepts are covered again, applied specifically to custom software, in Domain 8."
      - heading: "Interface Testing: UI, Network, and API"
        blocks:
          - type: paragraph
            text: "A system is only as secure as every interface where something outside it can interact with it, and each interface type deserves its own deliberate testing rather than assuming coverage of one implies coverage of the others. User interface testing checks the application from the perspective of a human user, including whether client-side controls (form validation, hidden fields, disabled buttons) are actually enforced server-side too, since anything enforced only in the UI can typically be bypassed by a request crafted directly against the backend. Network interface testing examines the services and ports actually exposed at the network layer, independent of what any particular application intends to expose — a service accidentally left listening that no UI ever links to is invisible to UI-focused testing but fully reachable to network scanning. API testing has become the fastest-growing category as applications increasingly expose functionality directly through APIs consumed by mobile apps, single-page applications, and third-party integrations — API testing specifically checks for broken object-level authorization (a request for another user's resource by ID, since APIs often expose resource identifiers directly), excessive data exposure (returning more fields than the calling UI actually uses, which an attacker calling the API directly can still see), and rate-limiting gaps that a UI's own pacing would normally have masked."
          - type: callout
            style: tip
            text: "The exam's takeaway: a UI-only test posture provides false confidence, because it validates only the interface most legitimate users interact with, while attackers routinely go straight for the underlying API or network service the UI merely wraps."

  - id: d6-t3
    domain: domain6
    number: "6.3"
    title: "Collecting Security Process Data"
    summary: "Gathering the operational metrics — from account management to disaster recovery testing — that feed assessment and reporting."
    tags: ["security metrics", "log review", "KPI"]
    key_terms: ["Security Metrics", "Log Review", "Account Management Review", "KPI/KRI", "Continuous Control Monitoring"]
    sections:
      - heading: "Why Process Data Matters"
        blocks:
          - type: paragraph
            text: "Testing controls in isolation (6.2) only tells part of the story — ongoing security process data shows whether the security program is functioning day-to-day as designed. This includes account management data (are terminated accounts actually disabled promptly?), log review results (are alerts being triaged, or piling up unreviewed?), backup verification data (do restores actually work, not just complete?), and training completion rates."
          - type: list
            style: bullet
            items:
              - "Account management — provisioning/deprovisioning timeliness, orphaned account counts"
              - "Backup verification — successful restore testing, not just backup job completion status"
              - "Key performance indicators (KPIs) — measure how well a process is performing (e.g. patch deployment time)"
              - "Key risk indicators (KRIs) — early warning metrics that a risk is trending upward (e.g. rising number of unpatched critical vulnerabilities)"
          - type: callout
            style: tip
            text: "A backup job reporting 'success' every night is not the same as a verified, working restore — the exam favors answers that emphasize testing/verifying data (e.g. actually restoring from backup) over simply collecting status logs."
      - heading: "Building a Useful Metrics Program"
        blocks:
          - type: paragraph
            text: "Raw metrics collected but never reviewed provide no more value than logs that are never reviewed (Domain 7's monitoring content) — a security metrics program needs a defined audience and cadence, not just a dashboard nobody opens. Good security metrics generally share a few properties: they're actionable (someone can actually do something differently based on the number), they're consistently measured over time (so trends are meaningful rather than one-off snapshots), and they're tied to a specific owner accountable for improving them if they trend the wrong way. A metric like 'number of security incidents last month' is easy to collect but has limited value on its own without normalization (incidents per number of assets, or per number of employees, to distinguish genuine trend from simple organizational growth) and without breaking it down by severity, since a rising count of trivial incidents means something very different than a rising count of severe ones."
      - heading: "Continuous Control Monitoring"
        blocks:
          - type: paragraph
            text: "Rather than only checking whether controls work at scheduled test intervals (an annual pen test, a quarterly access review), continuous control monitoring automates the ongoing collection of process data so drift or failure is caught close to when it happens, not months later at the next scheduled check. This is the process-data equivalent of the configuration drift monitoring introduced in Domain 7 — instead of periodically re-verifying a system's configuration against baseline, continuous control monitoring periodically (or constantly) re-verifies that security processes (account reviews happening on schedule, logs actually being reviewed, patches actually being deployed within SLA) are still functioning as designed."
      - heading: "Disaster Recovery and Business Continuity Testing Data"
        blocks:
          - type: paragraph
            text: "DR/BC plans (Domain 1) are only as good as the evidence that they actually work, which is why exercise results are themselves a category of process data worth collecting deliberately rather than treating a completed exercise as the end of the story. Useful DR/BC process data includes: how the actual recovery time achieved during a test compared against the plan's target RTO (a system that recovers in six hours against a four-hour RTO target is a finding, not a pass); how much data loss occurred during a simulated failure compared against the target RPO; which specific steps in the plan failed, were skipped, or required improvisation not documented in the plan itself; and how long it took to actually declare a disaster and activate the plan in the first place, since decision latency at the start of a real event often matters as much as technical recovery speed once the plan is running. Tracking this data across successive exercises, rather than treating each test as an isolated pass/fail event, is what actually drives plan maturity over time — a program that never worsens its RTO/RPO gap because each exercise's findings get fed back into plan revisions is meaningfully different from one that repeats the same gaps year after year."

  - id: d6-t4
    domain: domain6
    number: "6.4"
    title: "Analyzing Test Output and Generating Reports"
    summary: "Turning raw test results into prioritized, actionable findings that decision-makers can actually use."
    tags: ["reporting", "remediation prioritization", "false positive", "CVSS"]
    key_terms: ["Finding", "False Positive", "Remediation Priority", "Executive Summary", "CVSS", "False Negative"]
    sections:
      - heading: "From Raw Output to Meaningful Findings"
        blocks:
          - type: paragraph
            text: "Raw scanner/test output is rarely useful on its own — it must be analyzed to remove false positives (results that appear to be issues but aren't, given the actual environment/context), correlate related findings, and prioritize based on real risk (exploitability, exposure, data sensitivity of the affected system), not just a generic severity score. A 'critical' vulnerability on an isolated, air-gapped test system is a lower real-world priority than a 'medium' vulnerability on an internet-facing production server holding regulated data."
      - heading: "False Positives and False Negatives"
        blocks:
          - type: paragraph
            text: "A false positive (a finding that looks like a real issue but isn't) wastes remediation effort and, if they're frequent enough, trains reviewers to distrust and eventually ignore the tool's output entirely — the same 'alert fatigue' risk that applies to SIEM tuning in Domain 7. A false negative (a real issue the test failed to catch at all) is more dangerous precisely because it's invisible — the organization believes it's covered when it isn't. Tuning a testing program is a constant balance between these two failure modes: an overly aggressive scanner configuration reduces false negatives but raises false positives (and analyst workload/fatigue), while an overly conservative one reduces noise but risks missing real issues. Neither error rate can be driven to zero, which is exactly why the analysis step — human judgment applied to raw automated output — remains a required part of the process rather than something full automation can fully replace."
      - heading: "Standardized Severity Scoring: CVSS"
        blocks:
          - type: paragraph
            text: "The Common Vulnerability Scoring System (CVSS) gives vulnerabilities a standardized numeric severity score (0-10) based on factors like attack vector (can it be exploited remotely over a network, or does it require local/physical access?), attack complexity, privileges required, and the impact to confidentiality, integrity, and availability if exploited. CVSS gives organizations a common baseline vocabulary for comparing severity across different tools and vendors, but it deliberately doesn't account for an organization's specific environment — which is exactly why analysis (correlating CVSS with actual exposure, compensating controls already in place, and business context) is still a required human step, not something CVSS alone can determine. A high CVSS score is a strong starting signal for prioritization, not the final word on it."
      - heading: "Communicating Results Effectively"
        blocks:
          - type: paragraph
            text: "A good report serves multiple audiences: an executive summary communicates business risk and overall posture in non-technical terms for leadership, while detailed technical findings (with reproduction steps and remediation guidance) serve the teams who must actually fix the issues. Every finding should include enough detail to be actionable — what's wrong, why it matters, and what to do about it — not just a raw vulnerability name and severity score. Mature programs also assign each finding a remediation SLA tied to its prioritized severity (e.g. critical findings remediated within days, low findings within a quarter) and track findings against that SLA over time — a finding that's simply reported once and never tracked to closure provides much less real risk reduction than the same finding tracked until it's actually fixed."
      - heading: "When Remediation Isn't the Right Answer: Risk Acceptance"
        blocks:
          - type: paragraph
            text: "Not every finding gets remediated, and treating 'remediate everything' as the only acceptable outcome misreads what the analysis and reporting step is actually for. A finding can be formally risk-accepted (the organization consciously decides the cost or disruption of fixing it outweighs the risk it poses, and a accountable owner signs off on that decision explicitly, per Domain 1's risk response options), mitigated through a compensating control rather than a direct fix (e.g. a legacy system that can't be patched is instead isolated on its own segment), or transferred (covered by insurance rather than technically resolved). What distinguishes a defensible risk acceptance from simply ignoring a finding is documentation and ownership — a named, accountable individual explicitly accepting the risk, with the decision recorded and periodically revisited, versus a finding that's just quietly absent from the next report with no record of why. Auditors and examiners specifically look for this distinction: a documented, owned risk acceptance is a sign of a functioning program; an undocumented gap between what was found and what's still open is a red flag."
          - type: callout
            style: tip
            text: "The exam frames reporting as a communication exercise as much as a technical one — a report that's technically accurate but unusable by its audience has failed at its purpose."

  - id: d6-t5
    domain: domain6
    number: "6.5"
    title: "Conducting or Facilitating Security Audits"
    summary: "The distinction between internal, external, and third-party audits, and the auditor's role versus the organization's role."
    tags: ["internal audit", "external audit", "third-party audit"]
    key_terms: ["Internal Audit", "External Audit", "Third-Party Audit", "Auditor Independence", "SOC 2", "Audit Evidence", "SOC 1", "SOC 3", "SSAE 18"]
    sections:
      - heading: "Types of Audits"
        blocks:
          - type: list
            style: bullet
            items:
              - "Internal audit — conducted by the organization's own audit function; useful for continuous self-monitoring but has less independence than an external audit"
              - "External audit — conducted by an independent outside party (regulator or hired firm); provides higher assurance to outside stakeholders precisely because of that independence"
              - "Third-party audit — conducted on behalf of, or requested by, an external stakeholder such as a customer or partner (e.g. a SOC 2 report an organization commissions to prove its controls to its own customers)"
          - type: callout
            style: tip
            text: "Auditor independence is core to audit credibility — an auditor should not audit a system or process they personally designed, implemented, or operate, since that creates a conflict of interest and undermines the objectivity the audit is supposed to provide."
      - heading: "SOC Report Types"
        blocks:
          - type: paragraph
            text: "SOC (System and Organization Controls) reports, issued under the SSAE 18 attestation standard by an independent CPA firm, come in several distinct flavors the exam expects you to tell apart. A SOC 1 report focuses specifically on controls relevant to a customer's financial reporting (e.g. a payroll processor's controls, since errors there could affect a customer's financial statements). A SOC 2 report focuses on the AICPA Trust Services Criteria — security, availability, processing integrity, confidentiality, and privacy — and is the report most commonly relevant to a general technology/security audience evaluating a vendor. A SOC 3 report covers the same Trust Services Criteria as SOC 2 but is a shorter, general-use summary intended for public distribution (e.g. posted on a vendor's website), whereas SOC 1 and SOC 2 reports contain detailed, sensitive information typically shared only under NDA with specific customers. Within SOC 1 and SOC 2, a Type I report assesses whether controls are suitably designed as of a specific point in time, while a Type II report assesses whether those controls actually operated effectively over an extended period (commonly six to twelve months) — Type II is significantly stronger assurance, since it demonstrates sustained operation rather than just a snapshot of design."
          - type: callout
            style: tip
            text: "Exam shortcut: SOC 1 = financial reporting relevance; SOC 2 = security/availability/confidentiality relevance (the one security professionals care about most); SOC 3 = the public-facing summary version of SOC 2. Type I = design at a point in time; Type II = operating effectiveness over a period — Type II is the stronger assurance of the two."
      - heading: "The Phases of an Audit"
        blocks:
          - type: paragraph
            text: "A formal audit typically moves through: planning (defining scope, objectives, and the criteria being audited against — a specific standard, regulation, or internal policy), fieldwork (gathering evidence and testing whether controls actually operate as claimed), reporting (documenting findings, including any exceptions/deficiencies identified), and follow-up (verifying that findings from the audit are actually remediated, often as part of the next audit cycle rather than left unchecked). An audit that stops at the reporting phase and never verifies remediation risks becoming a repeat exercise — the same finding reappearing audit after audit, which auditors specifically look for as a sign of an organization not acting on what it already knows."
      - heading: "How Auditors Gather Evidence"
        blocks:
          - type: list
            style: bullet
            items:
              - "Inquiry — asking personnel how a control works; the weakest form of evidence on its own, since it relies entirely on what someone says rather than independent verification"
              - "Observation — watching a control being performed in real time; stronger than inquiry, but only proves the control worked at the specific moment observed"
              - "Inspection — reviewing documentation or artifacts (a signed change ticket, a configuration screenshot, a log entry) as evidence a control operated as described"
              - "Reperformance — the auditor independently redoes the control themselves to verify the claimed result; the strongest form of evidence, since it doesn't rely on trusting anyone else's account or artifact at all"
          - type: callout
            style: example
            text: "Verifying that access reviews happen quarterly: inquiry is asking the access-review owner if it happens (weakest); observation is watching one occur; inspection is reviewing the signed-off access review records from the last four quarters; reperformance is the auditor independently pulling the access list and confirming it matches what the review claimed to have found (strongest)."
      - heading: "Common Audit Pitfalls: Scope Creep and Audit Fatigue"
        blocks:
          - type: paragraph
            text: "Two practical failure modes recur often enough in real audit programs to be worth recognizing directly. Scope creep happens when an audit's boundaries expand beyond what was originally agreed during planning — auditors pulling in adjacent systems or processes not part of the defined scope, which stretches timelines, increases cost, and can create exactly the kind of unclear authorization boundary that 6.1's rules-of-engagement content warns against for technical testing. A well-run audit revisits scope changes formally rather than letting them happen informally mid-fieldwork. Audit fatigue is the organizational cousin of alert fatigue: when the same systems face frequent, overlapping audits from multiple stakeholders (a customer's third-party audit, an internal audit, a regulator's external audit, all within the same year, often asking for overlapping evidence in different formats), the teams being audited start treating audit requests as a compliance chore to get through quickly rather than a genuine opportunity to surface real issues, which degrades the honesty and thoroughness of the evidence auditors actually receive."
          - type: callout
            style: tip
            text: "A growing practice for managing audit fatigue is a shared control framework or unified evidence repository — mapping one set of collected evidence (system configurations, access review records, test results) to the specific requirements of multiple overlapping audits/frameworks at once, so the same underlying evidence satisfies a SOC 2 auditor, an ISO 27001 auditor, and an internal audit without the audited team re-answering the same questions three separate times in three separate formats."

  - id: d6-t6
    domain: domain6
    number: "6.6"
    title: "Vulnerability Management in Practice"
    summary: "Running a vulnerability program as a continuous lifecycle — scan types and their trade-offs, prioritization beyond raw severity, and closing the loop through verified remediation."
    tags: ["vulnerability management", "scanning", "remediation", "CVSS", "patch management"]
    key_terms: ["Credentialed Scan", "Agent-Based Scanning", "CVE", "CVSS", "EPSS", "KEV Catalog", "Scan Window", "Remediation SLA", "Compensating Control", "Attack Surface Management"]
    sections:
      - heading: "The Lifecycle, Not the Scan"
        blocks:
          - type: paragraph
            text: "Organizations frequently mistake running a scanner for having a vulnerability management program. The scan is one step in a continuous loop: maintain an accurate asset inventory (you cannot scan what you do not know exists, which is why Domain 2's inventory is a hard dependency), discover vulnerabilities, prioritize them against real risk, assign ownership with a deadline, remediate, and then verify by rescanning rather than trusting a ticket marked closed. A program that produces reports nobody acts on has the same security value as no program at all, plus the cost."
          - type: callout
            style: warning
            text: "The most common program failure is volume without prioritization: a scanner reporting 40,000 findings across the estate produces paralysis, not security. If a scenario describes a team overwhelmed by scan output, the answer is risk-based prioritization and asset criticality, not more scanning or more staff."
      - heading: "Scan Types and What Each Actually Sees"
        blocks:
          - type: list
            style: bullet
            items:
              - "Uncredentialed (unauthenticated) scan — probes from outside like an attacker with no access; shows externally visible exposure but infers much from banners, producing more false positives"
              - "Credentialed (authenticated) scan — logs into the target and reads actual installed versions and configuration; far more accurate and far fewer false positives, which is why it is the recommended default for internal assets"
              - "Agent-based scanning — software resident on the endpoint reports continuously; reaches laptops that are rarely on the corporate network when scans run, and avoids scan-window scheduling entirely"
              - "Network versus host scanning — network scans find exposed services across ranges; host scans examine one system deeply, including local configuration a network scan cannot observe"
              - "Passive scanning — infers assets and versions by watching traffic rather than sending probes; produces zero impact on fragile systems, at the cost of only seeing what happens to communicate"
          - type: callout
            style: tip
            text: "Credentialed versus uncredentialed is a favorite exam distinction. Credentialed scans give accuracy and completeness; uncredentialed scans give the attacker's-eye view of exposure. The mature answer to which you should run is both, for different questions — but if a scenario complains about false positives, credentialed scanning is the fix."
          - type: paragraph
            text: "Scanning is not free of risk. Aggressive scans have knocked over fragile legacy systems, medical devices, and industrial controllers, which is why production scanning needs an agreed window, change-management awareness, and gentler configurations for sensitive equipment. The correct answer for a system too fragile to scan is not to skip assessment but to substitute a safer method — passive discovery, configuration review, or testing an identical non-production instance."
      - heading: "Prioritization Beyond the Severity Score"
        blocks:
          - type: paragraph
            text: "CVSS base scores describe a vulnerability's intrinsic characteristics in isolation, not the risk it poses to a particular organization. A critical-rated flaw in an isolated lab system matters less than a medium-rated one in an internet-facing system holding regulated data. Mature prioritization combines severity with asset criticality and data sensitivity, exposure (internet-facing or internally reachable only), whether a working exploit exists publicly, and whether compensating controls already reduce exploitability."
          - type: list
            style: bullet
            items:
              - "CVE — the unique identifier for a specific publicly known vulnerability; a naming scheme, not a rating"
              - "CVSS — the standardized severity score; note the temporal and environmental metric groups exist precisely to adjust the base score for exploit maturity and local context, and are widely ignored"
              - "EPSS — estimates the probability a vulnerability will actually be exploited in the wild, which is a fundamentally different and often more actionable question than how bad it would be"
              - "KEV catalog — a curated list of vulnerabilities with confirmed active exploitation; anything on it warrants emergency handling regardless of its CVSS score"
          - type: callout
            style: example
            text: "A vulnerability with a CVSS of 9.8 that no one has ever exploited and that sits behind three layers of segmentation may reasonably wait, while a 6.5 under active mass exploitation on an internet-facing server is an emergency tonight. Reasoning from likelihood and impact rather than from a single number is exactly the risk-based judgment the exam rewards."
      - heading: "Closing the Loop"
        blocks:
          - type: paragraph
            text: "Remediation deadlines should be defined by policy as tiered SLAs — critical internet-facing findings in days, lower-severity internal ones in a quarter — so that urgency is an agreed standard rather than a negotiation each time. Where a fix genuinely cannot be applied, because a vendor has not released one or an application breaks under the patch, the correct outcome is a documented compensating control plus a formally accepted, time-bounded, and reviewed risk (Domain 1), not a finding that silently ages. Verification by rescan matters because patches fail to apply, get rolled back, and get reverted by image redeployment more often than anyone expects. Useful program metrics are mean time to remediate, percentage of assets covered by scanning at all, and the age distribution of open findings — coverage in particular, because unscanned assets are invisible risk rather than absent risk."

  - id: d6-t7
    domain: domain6
    number: "6.7"
    title: "Penetration Testing: Authorization, Methodology, and Reporting"
    summary: "The legal and procedural scaffolding that separates a penetration test from a crime, the recognized methodologies, and how findings become organizational improvement."
    tags: ["penetration testing", "rules of engagement", "authorization", "OSSTMM", "red team"]
    key_terms: ["Rules of Engagement", "Get Out of Jail Free Letter", "Scope Statement", "Black Box", "White Box", "Gray Box", "PTES", "NIST SP 800-115", "OSSTMM", "Responsible Disclosure", "Deconfliction"]
    sections:
      - heading: "Authorization Comes First, Always"
        blocks:
          - type: paragraph
            text: "The only difference between a penetration test and a computer crime is documented authorization from someone with the authority to grant it. Written approval from senior management — the informal 'get out of jail free' letter — must exist before any testing begins, and testers should carry it during physical or social engineering engagements where they may be detained by security staff who are, correctly, doing their jobs. Authorization from a system owner is insufficient when the systems sit in a third party's cloud or data center; the hosting provider's own terms and authorization requirements apply independently."
          - type: list
            style: bullet
            items:
              - "Scope — precisely which addresses, applications, facilities, and personnel are in scope, and explicitly what is out of scope"
              - "Timing — permitted testing windows, and whether destructive or denial-of-service testing is authorized at all (usually it is not)"
              - "Rules of engagement — permitted techniques, handling of discovered sensitive data, whether social engineering and physical entry are allowed, and required stop conditions"
              - "Escalation and deconfliction — a named contact reachable at any hour, so a defender who detects the activity can confirm whether it is the test or an actual intrusion"
              - "Evidence handling — how captured credentials and extracted data are stored, transmitted, and destroyed after the engagement"
          - type: callout
            style: warning
            text: "Discovering evidence of a pre-existing real compromise mid-test is a defined scenario worth knowing: testing stops, the escalation contact is notified immediately, and the organization's incident response process takes over. Continuing to test through an active intrusion contaminates evidence and risks being blamed for the attacker's actions."
      - heading: "Knowledge Levels and What Each Tests"
        blocks:
          - type: list
            style: bullet
            items:
              - "Black box (zero knowledge) — testers begin with nothing, simulating an external attacker; realistic reconnaissance, but budget is consumed discovering what the organization already knows, and coverage is whatever they happen to find"
              - "White box (full knowledge) — testers receive architecture documentation, source code, and credentials; maximum coverage and depth per hour spent, at the cost of realism"
              - "Gray box (partial knowledge) — the common middle ground, often simulating an attacker who has already achieved a foothold or an insider with ordinary user access"
          - type: callout
            style: tip
            text: "A related distinction the exam draws: whether the defending team knows a test is happening. A double-blind test, where defenders are unaware, evaluates detection and response capability as much as it evaluates the controls — which is often the more valuable finding, since it measures whether the SOC actually catches what it is supposed to catch."
      - heading: "Recognized Methodologies"
        blocks:
          - type: paragraph
            text: "Using a published methodology makes results repeatable, comparable across engagements and vendors, and defensible to auditors — an ad hoc test's coverage depends entirely on the individual tester's habits. The frameworks the exam may reference include NIST SP 800-115, the U.S. federal technical guide to information security testing; PTES, the Penetration Testing Execution Standard, covering pre-engagement through reporting; OSSTMM, the Open Source Security Testing Methodology Manual, notable for its emphasis on measurable results; OWASP's testing guides for web and mobile applications specifically; and MITRE ATT&CK as the shared vocabulary for describing which adversary techniques were exercised and which were detected."
      - heading: "Reporting and What Happens Afterward"
        blocks:
          - type: paragraph
            text: "A penetration test report that only lists findings has delivered half its value. Effective reports open with an executive summary written for people who will not read the technical body, stating business risk in business terms; provide reproducible technical detail so engineers can confirm and fix each issue; rate findings by real risk to this organization rather than by generic severity; and give prioritized, actionable remediation guidance. Crucially, they should also record what defenders detected and how quickly, because a finding that the SOC never noticed the tester's lateral movement is often more important than any individual vulnerability."
          - type: paragraph
            text: "The report itself is among the most sensitive documents an organization possesses — a curated roadmap for compromising it — and warrants classification, restricted distribution, and encrypted storage and transmission accordingly. Findings should feed the risk register and remediation tracking rather than living in a PDF, and retesting after remediation is what converts a test from an assessment into an improvement. Where testing is performed against third parties or products, responsible disclosure practices apply: notify the owner, allow reasonable time to remediate, and coordinate any public disclosure."

  - id: d6-t8
    domain: domain6
    number: "6.8"
    title: "Log Review, Monitoring, and Synthetic Testing as Assessment"
    summary: "Using operational telemetry and simulated transactions as continuous assessment activities that reveal what point-in-time testing cannot."
    tags: ["log review", "synthetic transactions", "RUM", "monitoring", "continuous assessment"]
    key_terms: ["Synthetic Transaction", "Real User Monitoring", "Log Review", "Baseline", "Detection Coverage", "Alert Tuning", "Canary Test", "Service Level Objective"]
    sections:
      - heading: "Log Review as an Assessment Technique"
        blocks:
          - type: paragraph
            text: "Domain 7 covers logging as an operational capability; Domain 6 treats reviewing those logs as an assessment activity in its own right. Logs answer questions no scanner can: are the controls actually being exercised, are there failed access attempts nobody investigated, are administrative actions occurring outside change windows, do the account privileges in use match what the access review approved. A control that exists on paper and is never triggered in the logs may not be enforcing anything at all, and log review is frequently how that is discovered."
          - type: callout
            style: tip
            text: "Assessing logging itself is a distinct and testable idea: are the systems that should be logging actually sending logs, are the right event types enabled, is time synchronized across sources, and is retention sufficient to investigate an intrusion discovered months later? A gap in log coverage is an assessment finding, because it is an inability to detect and investigate."
      - heading: "Synthetic Transactions"
        blocks:
          - type: paragraph
            text: "A synthetic transaction is a scripted interaction executed against a system on a schedule — log in, search, add to cart, check out — verifying that the whole path works and measuring how long it takes. Because it runs continuously and independently of whether real users are active, it detects failures at three in the morning, on paths that are rarely exercised, and in the gap between individually healthy components and an actually working end-to-end service. It also provides a consistent performance baseline that makes degradation visible before users complain."
          - type: paragraph
            text: "Real user monitoring is the complement, capturing what actual users experience across their real devices, networks, and geographies — data synthetic tests cannot produce because they run from fixed, known conditions. Synthetic testing gives consistency and coverage of rare paths; RUM gives reality and breadth. Neither substitutes for the other, and the security-relevant point is that both feed the availability leg of the CIA triad with evidence rather than assumption."
          - type: callout
            style: example
            text: "Synthetic transactions can validate security controls directly, not just availability. A scheduled test that attempts an action which policy should block — accessing a resource without authorization, submitting input that a WAF should reject — verifies the control is still enforcing. Controls fail silently after upgrades and configuration changes far more often than anyone expects, and only an active test catches it."
      - heading: "Validating That Detection Actually Works"
        blocks:
          - type: paragraph
            text: "The most consequential monitoring assessment question is not whether alerts fire but whether the right ones do and whether anyone responds. Detection coverage is meaningfully measured by mapping deployed detections against adversary techniques (MITRE ATT&CK) and identifying which techniques would currently go unnoticed, then confirming through breach and attack simulation or purple-team exercises that the detections that supposedly exist genuinely trigger. Alert fatigue is itself an assessment finding: a queue generating thousands of low-value alerts daily is functionally equivalent to no monitoring, because analysts learn to dismiss them, and tuning is a security improvement rather than a convenience."

  - id: d6-t9
    domain: domain6
    number: "6.9"
    title: "Code Review, Misuse Cases, and Software Test Techniques"
    summary: "The assessment techniques aimed specifically at software — manual and automated review, coverage analysis, and testing for what a system should refuse to do."
    tags: ["code review", "misuse case", "test coverage", "SAST", "DAST", "regression testing"]
    key_terms: ["Static Analysis", "Dynamic Analysis", "Interactive Analysis", "Fagan Inspection", "Peer Review", "Misuse Case", "Abuse Case", "Negative Testing", "Code Coverage", "Regression Testing", "Fuzzing"]
    sections:
      - heading: "Manual Review and Its Formal Variants"
        blocks:
          - type: paragraph
            text: "Automated analysis finds pattern-matchable defects; humans find logic flaws, authorization mistakes, and design errors that no tool recognizes because they require understanding intent. Peer review is the lightweight, routine form. Fagan inspection is the formal, structured variant with defined roles and phases — planning, overview, preparation, inspection, rework, and follow-up — used where defect cost is very high, such as safety-critical or aerospace software. The exam-relevant point is that formality should scale with consequence: a Fagan inspection on a marketing page is waste, and unstructured peer review on flight control software is negligence."
          - type: callout
            style: warning
            text: "Authorization logic is the canonical example of what only human review catches. A tool can verify that input is validated and that a query is parameterized; it generally cannot determine that a given endpoint should have checked whether this particular user owns the record being requested. Broken access control consistently ranks at the top of the OWASP list precisely because it is a logic problem, not a syntax problem."
      - heading: "Automated Analysis Techniques"
        blocks:
          - type: list
            style: bullet
            items:
              - "SAST (static) — analyzes source or binaries without executing them; runs early and pinpoints exact lines, but cannot see runtime configuration and is prone to false positives"
              - "DAST (dynamic) — tests the running application from outside; finds real, exploitable issues including deployment and configuration flaws, but only in the paths it reaches and without pointing at the responsible code"
              - "IAST (interactive) — instruments the running application so it observes execution from inside during testing, combining dynamic accuracy with code-level pinpointing"
              - "SCA (software composition analysis) — identifies third-party and open-source components and their known vulnerabilities, which is where a large share of real risk lives"
              - "Fuzzing — submits malformed, unexpected, and random input at scale to provoke crashes and unhandled conditions; particularly effective against parsers, file format handlers, and memory-unsafe code"
          - type: callout
            style: tip
            text: "The clean exam distinction: static analysis reads the code without running it, dynamic analysis runs it without reading it, and interactive analysis does both at once. Each finds a different class of defect, which is why a mature program layers them rather than choosing one."
      - heading: "Misuse Cases and Negative Testing"
        blocks:
          - type: paragraph
            text: "Ordinary test cases verify that a system does what it should when used correctly. Misuse cases — sometimes called abuse cases — invert this by modeling what a hostile actor would deliberately attempt and verifying the system refuses: submitting another user's identifier to retrieve their record, replaying a completed transaction, manipulating a client-side price, skipping a required workflow step by requesting a later endpoint directly. This is where threat modeling from Domain 1 becomes concrete test cases, and it is the specific discipline that catches business logic flaws, which automated scanners essentially never find because nothing in the traffic looks malformed."
          - type: callout
            style: example
            text: "Negative testing is the broader habit: confirm the system correctly rejects bad input, denies unauthorized actions, and fails safely, rather than only confirming it accepts good input. A system that has only ever been tested with valid data has been tested for functionality, not for security."
      - heading: "Coverage and Regression"
        blocks:
          - type: paragraph
            text: "Test coverage analysis measures how much of the code the test suite actually exercises — statement, branch, condition, and path coverage in increasing order of rigor. High coverage is a useful signal but a dangerous target: it proves lines were executed, not that meaningful assertions were made about their behavior, and a suite with ninety percent coverage and weak assertions can pass while the software is broken. Regression testing re-runs existing tests after every change to confirm that a fix or feature did not break something previously working, and it carries direct security weight, since security patches themselves introduce defects and a patch that quietly breaks an authorization check is worse than the vulnerability it closed."

  - id: d6-t10
    domain: domain6
    number: "6.10"
    title: "Assessing Account Management, Backup, and Recovery Readiness"
    summary: "The operational assessments that verify identity hygiene, that backups can actually restore, and that recovery plans work under conditions nobody chose."
    tags: ["access review", "account management", "backup verification", "DR testing", "recertification"]
    key_terms: ["Access Recertification", "Orphaned Account", "Privilege Creep", "Separation of Duties Review", "Restore Test", "Tabletop Exercise", "Parallel Test", "Full Interruption Test", "RTO Validation"]
    sections:
      - heading: "Assessing Account Management"
        blocks:
          - type: paragraph
            text: "Account management review is the recurring assessment of who has access to what and whether they should. It is unglamorous and consistently productive, because entitlements accumulate: people change roles and keep the old access (privilege creep), contractors and departed employees leave accounts behind (orphaned accounts), service accounts are provisioned broadly for convenience and never revisited, and emergency access granted during an incident is never revoked. Access recertification requires the business owner — not IT — to affirmatively confirm each person's continued need, because only the owner knows what the job actually requires."
          - type: list
            style: bullet
            items:
              - "Orphaned and dormant accounts — accounts belonging to departed staff, or unused for an extended period, both of which are attacker footholds with no one watching"
              - "Privileged account inventory — whether the population of administrative accounts matches the approved list, and whether any standing privilege should be just-in-time instead"
              - "Separation of duties validation — testing for toxic combinations where one identity can both initiate and approve the same sensitive transaction"
              - "Provisioning and deprovisioning timeliness — measuring elapsed time from termination to access removal, which is a directly reportable metric and a common audit finding"
          - type: callout
            style: warning
            text: "Rubber-stamped recertification is a well-known failure mode: a manager presented with two hundred entitlements approves them all in one click, producing an audit artifact with no assurance behind it. Assessing the recertification process itself — sampling approvals and testing whether the reviewer could have justified them — is the higher-order finding."
      - heading: "Verifying Backups Actually Restore"
        blocks:
          - type: paragraph
            text: "A backup job reporting success proves data was written somewhere; it does not prove the data can be read back, that it is complete, that the encryption keys are available, or that the restore fits inside the recovery time objective. The only assessment that answers those questions is an actual restore test, performed to separate hardware, on a schedule, with the elapsed time measured against the RTO the business agreed to. Organizations discover corrupted backup chains, missing databases, unavailable keys, and restore procedures nobody has ever executed most often during a real disaster, which is the worst possible moment."
          - type: callout
            style: tip
            text: "Ransomware changed the assessment criteria for backups. Beyond restorability, the questions now are whether backups are immutable or offline so an attacker with domain administrator access cannot encrypt or delete them, and whether restoring would reintroduce the attacker's persistence. A backup reachable with the same credentials that compromised production is not a recovery capability."
      - heading: "Testing Continuity and Recovery Plans"
        blocks:
          - type: list
            style: bullet
            items:
              - "Read-through / checklist review — participants review the plan for accuracy and gaps; lowest cost and lowest assurance, but genuinely useful for catching stale contact lists and departed staff"
              - "Structured walkthrough / tabletop exercise — the team talks through a scenario together, surfacing coordination gaps and unstated assumptions without touching production"
              - "Simulation test — a realistic scenario is enacted with actual response steps taken, short of failing over production systems"
              - "Parallel test — recovery systems are brought up and processing is run alongside production, verifying the alternate site genuinely works without risking the live environment"
              - "Full interruption test — production is actually stopped and operations run from recovery; the highest assurance and the highest risk, requiring executive approval and often reserved for the most critical functions"
          - type: paragraph
            text: "The progression matters because assurance and business risk rise together, and the appropriate level is driven by the criticality established in the business impact analysis. Whatever the level, the deliverable is not a passing grade but a list of gaps that update the plan — a test that finds nothing usually means the scenario was too easy or participants were too prepared, not that the organization is ready."

  - id: d6-t11
    domain: domain6
    number: "6.11"
    title: "Third-Party, Compliance, and Regulatory Assessment"
    summary: "Assessing organizations you do not control, and demonstrating to regulators and customers that your own controls work."
    tags: ["third-party assessment", "compliance", "SOC 2", "vendor risk", "attestation"]
    key_terms: ["Right to Audit", "SOC 2 Type II", "ISO 27001 Certification", "Shared Assessment", "SIG Questionnaire", "Bridge Letter", "Complementary User Entity Control", "Continuous Monitoring", "Nth-Party Risk"]
    sections:
      - heading: "Assessing Vendors You Cannot Scan"
        blocks:
          - type: paragraph
            text: "Third parties process an organization's data on infrastructure it does not own and usually may not scan or test. Assessment therefore relies on a graduated set of methods, chosen by how much risk the relationship actually carries: a security questionnaire completed by the vendor (cheapest, entirely self-reported, and only as honest as the respondent); an independent attestation such as a SOC 2 Type II or ISO 27001 certificate; a right-to-audit clause exercised directly; and, where contractually permitted, technical testing of the specific service. The tiering point is the testable one — a vendor handling regulated data at scale warrants a different depth of assessment than one supplying office furniture, and applying identical scrutiny to both wastes finite assessment capacity."
          - type: callout
            style: warning
            text: "Right-to-audit clauses are frequently negotiated into contracts and then never exercised, which provides legal standing but no assurance. An unexercised right is not an assessment; the exam expects contractual rights to be paired with an actual program that uses them."
      - heading: "Reading an Attestation Correctly"
        blocks:
          - type: paragraph
            text: "SOC 2 Type I describes whether controls were suitably designed at a single point in time; Type II tests whether they operated effectively across a period, typically six to twelve months, and is the substantially stronger report. Reading one properly means going past the opinion letter: check the scope, since a report may cover only one product or data center and not the service you actually use; read the exceptions and management responses, because a clean opinion can still contain meaningful deviations; check the period covered and request a bridge letter for the gap between the report's end and today; and pay particular attention to complementary user entity controls, which are the things the report explicitly assumes you are doing on your side and for which the vendor accepts no responsibility."
          - type: callout
            style: tip
            text: "Complementary user entity controls are a favorite exam trap. A vendor's SOC 2 may state that customers are responsible for configuring access controls, managing their own users, and enabling encryption options. An organization that read only the opinion page and assumed the vendor handled everything has an unmitigated gap that the report explicitly disclaimed."
          - type: paragraph
            text: "Point-in-time attestation is also increasingly recognized as insufficient on its own, since a vendor's posture can change materially the day after an audit period closes. Continuous monitoring — external attack surface monitoring, breach notification clauses, and periodic reassessment triggered by changes in the relationship — is the maturing practice. Nth-party risk extends the same logic: a critical vendor's own critical subcontractors are part of the organization's real exposure even though there is no direct contractual relationship with them."
      - heading: "Demonstrating Your Own Compliance"
        blocks:
          - type: paragraph
            text: "The mirror image of vendor assessment is proving your own controls to regulators, customers, and certification bodies. This is where evidence discipline decides outcomes: controls that work but cannot be evidenced will be recorded as findings, because an auditor can only attest to what can be demonstrated. Practical maturity means generating evidence as a byproduct of operations — automated reports, ticket trails, system-generated logs — rather than assembling it manually under deadline, which is both expensive and prone to the appearance of reconstruction after the fact."
          - type: callout
            style: example
            text: "The distinction the exam draws repeatedly: compliance demonstrates that specified controls are in place, while security means the organization is actually defensible. They overlap substantially but are not the same, and an organization optimizing purely for the audit will eventually pass an assessment and still be breached. Compliance is a floor to build on, not a ceiling to stop at."
